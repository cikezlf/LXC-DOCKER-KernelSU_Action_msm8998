name: 小米6 Kernel CI（Docker + LXC + KernelSU 修复版v11）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load config
        run: |
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
            libssl-dev libelf-dev wget curl python3 python2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler libstdc++-10-dev \
            build-essential libncurses5-dev \
            xz-utils cpio unzip

      - name: Prepare workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}-v11
          restore-keys: |
            kernel-${{ env.KERNEL_SOURCE_BRANCH }}-

      - name: Clone kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          fi

      - name: Integrate KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "Integrating KernelSU ${{ env.KERNELSU_TAG }}..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${{ env.KERNELSU_TAG }}/kernel/setup.sh" | bash -s ${{ env.KERNELSU_TAG }}
          if [ -f drivers/kernelsu/Makefile ]; then
            echo 'ccflags-y += -w -fcommon' >> drivers/kernelsu/Makefile
            echo "KernelSU driver ccflags patched"
          fi
          ls -la drivers/kernelsu/

      - name: Apply compatibility patches
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            if [ -f "$f" ]; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
              echo "Patched $f"
            fi
          done
          sed -i '/^HOSTCFLAGS/s/$/ -fcommon -w/' Makefile
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec \
            sed -i 's/-Werror/-Wno-error/g' {} +
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec \
            sed -i 's/-Werror=[^ ]*//g' {} +
          echo "Removed all -Werror flags"
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Clean build dir
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper || true
          make clean || true

      - name: Generate feature config
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -f kernel_features.txt
          echo "# Docker/LXC/KernelSU core config" >> kernel_features.txt
          for cfg in \
            "CONFIG_NAMESPACES=y" \
            "CONFIG_NET_NS=y" \
            "CONFIG_PID_NS=y" \
            "CONFIG_IPC_NS=y" \
            "CONFIG_UTS_NS=y" \
            "CONFIG_USER_NS=y" \
            "CONFIG_CGROUPS=y" \
            "CONFIG_CGROUP_CPUACCT=y" \
            "CONFIG_CGROUP_DEVICE=y" \
            "CONFIG_CGROUP_FREEZER=y" \
            "CONFIG_CGROUP_SCHED=y" \
            "CONFIG_CPUSETS=y" \
            "CONFIG_MEMCG=y" \
            "CONFIG_MEMCG_SWAP=y" \
            "CONFIG_MEMCG_SWAP_ENABLED=y" \
            "CONFIG_CGROUP_PIDS=y" \
            "CONFIG_VETH=y" \
            "CONFIG_BRIDGE=y" \
            "CONFIG_BRIDGE_NETFILTER=y" \
            "CONFIG_IP_NF_FILTER=y" \
            "CONFIG_IP_NF_TARGET_MASQUERADE=y" \
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" \
            "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" \
            "CONFIG_NETFILTER_XT_MATCH_IPVS=y" \
            "CONFIG_NETFILTER_XT_MARK=y" \
            "CONFIG_IP_NF_NAT=y" \
            "CONFIG_NF_NAT=y" \
            "CONFIG_NF_NAT_IPV4=y" \
            "CONFIG_NF_NAT_NEEDED=y" \
            "CONFIG_IP_NF_TARGET_REDIRECT=y" \
            "CONFIG_NETFILTER_ADVANCED=y" \
            "CONFIG_NF_CONNTRACK=y" \
            "CONFIG_NF_CONNTRACK_MARK=y" \
            "CONFIG_IP_NF_IPTABLES=y" \
            "CONFIG_IP_NF_MANGLE=y" \
            "CONFIG_NETFILTER_XT_TARGET_MARK=y" \
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=y" \
            "CONFIG_NETFILTER_XT_MATCH_MARK=y" \
            "CONFIG_NETFILTER_XT_MATCH_OWNER=y" \
            "CONFIG_IP_VS=y" \
            "CONFIG_IP_VS_NFCT=y" \
            "CONFIG_IP_VS_PROTO_TCP=y" \
            "CONFIG_IP_VS_PROTO_UDP=y" \
            "CONFIG_IP_VS_RR=y" \
            "CONFIG_IP_VS_SH=y" \
            "CONFIG_IP_VS_WRR=y" \
            "CONFIG_OVERLAY_FS=y" \
            "CONFIG_OVERLAY_FS_REDIRECT_DIR=y" \
            "CONFIG_OVERLAY_FS_INDEX=y" \
            "CONFIG_TMPFS=y" \
            "CONFIG_TMPFS_POSIX_ACL=y" \
            "CONFIG_TMPFS_XATTR=y" \
            "CONFIG_KEYS=y" \
            "CONFIG_POSIX_MQUEUE=y" \
            "CONFIG_FANOTIFY=y" \
            "CONFIG_FHANDLE=y" \
            "CONFIG_PROC_FS=y" \
            "CONFIG_SYSFS=y" \
            "CONFIG_DEVTMPFS=y" \
            "CONFIG_DEVTMPFS_MOUNT=y" \
            "CONFIG_MACVLAN=y" \
            "CONFIG_VLAN_8021Q=y" \
            "CONFIG_BRIDGE_VLAN_FILTERING=y" \
            "CONFIG_SECCOMP=y" \
            "CONFIG_SECCOMP_FILTER=y" \
            "CONFIG_SECURITY=y" \
            "CONFIG_SECURITY_NETWORK=y" \
            "CONFIG_SECURITY_SELINUX=y" \
            "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" \
            "CONFIG_SECURITY_SELINUX_DISABLE=y" \
            "CONFIG_SECURITY_SELINUX_DEVELOP=y" \
            "CONFIG_SECURITY_SELINUX_AVC_STATS=y" \
            "CONFIG_CC_STACKPROTECTOR=y" \
            "CONFIG_KSU=y" \
            "CONFIG_KPROBES=y" \
            "CONFIG_HAVE_KPROBES=y" \
            "CONFIG_KPROBE_EVENTS=y" \
            "CONFIG_MODULES=y" \
            "CONFIG_MODULE_UNLOAD=y" \
            "CONFIG_KALLSYMS=y" \
            "CONFIG_KALLSYMS_ALL=y" \
            "CONFIG_MMU=y" \
            "CONFIG_SWAP=y" \
            "CONFIG_FREEZER=y" \
            "CONFIG_EVENTFD=y" \
            "CONFIG_EPOLL=y" \
            "CONFIG_UNIX=y" \
            "CONFIG_INET=y" \
            "CONFIG_IPV6=y" \
            "CONFIG_BPF=y" \
            "CONFIG_BPF_SYSCALL=y" \
            "CONFIG_PACKET=y" \
            "CONFIG_UNIX_DIAG=y" \
            "CONFIG_INET_DIAG=y" \
            "CONFIG_INET_TCP_DIAG=y" \
            "CONFIG_INET_UDP_DIAG=y" \
            "CONFIG_PACKET_DIAG=y" \
            "CONFIG_NETLINK_DIAG=y" \
            "CONFIG_NETFILTER_XT_TARGET_TPROXY=y" \
            "CONFIG_IP_MULTIPLE_TABLES=y" \
            "CONFIG_IPV6_MULTIPLE_TABLES=y" \
            "CONFIG_IPV6_SUBTREES=y" \
            "CONFIG_IP6_NF_FILTER=y" \
            "CONFIG_IP6_NF_TARGET_MASQUERADE=y" \
            "CONFIG_IP6_NF_IPTABLES=y" \
            "CONFIG_IP6_NF_MANGLE=y" \
            "CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y" \
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y" \
            "CONFIG_NETFILTER_XT_MATCH_STATISTIC=y" \
            "CONFIG_NETFILTER_XT_MATCH_STRING=y" \
            "CONFIG_TASKSTATS=y" \
            "CONFIG_TASK_DELAY_ACCT=y" \
            "CONFIG_TASK_IO_ACCOUNTING=y" \
            "CONFIG_IKCONFIG=y" \
            "CONFIG_IKCONFIG_PROC=y" \
            "CONFIG_BINFMT_MISC=y" \
            "CONFIG_MAGIC_SYSRQ=y" \
            "CONFIG_PRINTK_TIME=y" \
            "CONFIG_NET_SCHED=y" \
            "CONFIG_STRICT_MEMORY_RWX=n" \
          ; do
            echo "$cfg" >> kernel_features.txt
          done
          echo "kernel_features.txt created, line count:"
          wc -l kernel_features.txt
          echo "First 5 lines:"
          head -5 kernel_features.txt

      - name: Configure kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export O=out
          export HOSTCFLAGS="-fcommon -w -O2"

          echo "=== Step 1: Load defconfig ==="
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          if [ $? -ne 0 ]; then
            echo "defconfig load failed!"
            exit 1
          fi

          echo "=== Step 2: Merge feature config ==="
          if [ -f ../kernel_features.txt ]; then
            sed -i 's/^[[:space:]]*//' ../kernel_features.txt
            sort ../kernel_features.txt | uniq > /tmp/feature_fragment.txt
            if [ -f scripts/kconfig/merge_config.sh ]; then
              scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/feature_fragment.txt
              if [ $? -ne 0 ]; then
                echo "merge_config.sh failed!"
                exit 1
              fi
            fi
          fi

          echo "=== Step 3: olddefconfig ==="
          make O=out ARCH=arm64 olddefconfig
          if [ $? -ne 0 ]; then
            echo "olddefconfig failed!"
            exit 1
          fi

          echo "=== Config verification ==="
          echo "KSU:"
          grep "CONFIG_KSU=" out/.config || echo "KSU NOT FOUND!"
          echo "Core:"
          grep -E "^CONFIG_(NAMESPACES|CGROUPS|OVERLAY_FS|VETH|BRIDGE|SECCOMP|KPROBES)=" out/.config

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "=== Compiler info ==="
          aarch64-linux-gnu-gcc --version | head -2
          python --version
          echo "====================="

          export KBUILD_BUILD_HOST=CI
          export KBUILD_BUILD_USER=MI6
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export O=out
          export HOSTCFLAGS="-fcommon -w -O2"
          export KCFLAGS="-w -fcommon"

          echo "=== Starting build ==="
          make -j$(nproc) O=out 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}

          if [ $BUILD_RC -ne 0 ]; then
            echo "BUILD FAILED! Error lines:"
            grep -n -i -E "(error:|fatal error|undefined reference|multiple definition|cannot find|no such file|bad instruction|invalid operand)" build.log | grep -v "ccache" | tail -80
            echo ""
            echo "=== Last 150 lines ==="
            tail -150 build.log
            exit $BUILD_RC
          fi

          echo "BUILD SUCCESS!"
          ls -lh out/arch/arm64/boot/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-v11
          path: kernel_workspace/android-kernel/build.log
          retention-days: 7

      - name: Download AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3 ]; then
            git clone -b master --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

      - name: Package kernel zip
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          rm -f *.zip
          rm -rf dtb* zImage Image* *-dtb 2>/dev/null || true

          if [ -f ../android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb ./
            echo "Using Image.gz-dtb"
          elif [ -f ../android-kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz ./
            echo "Using Image.gz (no dtb)"
          elif [ -f ../android-kernel/out/arch/arm64/boot/Image ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image ./
            echo "Using Image"
          else
            echo "No kernel image found!"
            ls -lh ../android-kernel/out/arch/arm64/boot/
            exit 1
          fi

          rm -f anykernel.sh
          echo '### AnyKernel3 Ramdisk Mod Script' >> anykernel.sh
          echo '## osm0sis @ xda-developers' >> anykernel.sh
          echo '### Properties' >> anykernel.sh
          echo 'properties() {' >> anykernel.sh
          echo 'kernel.string=MI6 (sagit) Kernel with Docker/LXC + KernelSU' >> anykernel.sh
          echo 'do.devicecheck=1' >> anykernel.sh
          echo 'do.modules=0' >> anykernel.sh
          echo 'do.systemless=0' >> anykernel.sh
          echo 'do.cleanup=1' >> anykernel.sh
          echo 'do.cleanuponabort=0' >> anykernel.sh
          echo 'device.name1=sagit' >> anykernel.sh
          echo 'device.name2=MCE16' >> anykernel.sh
          echo 'device.name3=MCT1' >> anykernel.sh
          echo 'device.name4=MI6' >> anykernel.sh
          echo 'device.name5=' >> anykernel.sh
          echo 'supported.versions=' >> anykernel.sh
          echo 'supported.patchlevels=' >> anykernel.sh
          echo '; }' >> anykernel.sh
          echo '' >> anykernel.sh
          echo '### shell Variables' >> anykernel.sh
          echo 'block=/dev/block/bootdevice/by-name/boot;' >> anykernel.sh
          echo 'is_slot_device=0;' >> anykernel.sh
          echo 'ramdisk_compression=auto;' >> anykernel.sh
          echo 'patch_vbmeta_flag=auto;' >> anykernel.sh
          echo '' >> anykernel.sh
          echo '. tools/ak3-core.sh;' >> anykernel.sh
          echo '' >> anykernel.sh
          echo '### AnyKernel install' >> anykernel.sh
          echo 'dump_boot;' >> anykernel.sh
          echo 'write_boot;' >> anykernel.sh
          echo '## end install' >> anykernel.sh

          echo "anykernel.sh created:"
          cat anykernel.sh

          zip -r9 "../MI6-sagit-KernelSU-Docker-LXC.zip" . -x "*.git*" -x "README.md"
          echo "Package done:"
          ls -lh "../MI6-sagit-KernelSU-Docker-LXC.zip"

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MI6-sagit-Kernel-Package
          path: kernel_workspace/MI6-sagit-KernelSU-Docker-LXC.zip
