name: 小米6 Kernel CI（官方内核稳定增强版 · Docker 全量支持）

on:
  workflow_dispatch:
    inputs:
      enable_lxc_docker:
        description: '启用 Docker/LXC 支持'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    # 全局错误控制：bash -euo pipefail，任何命令非0退出/未定义变量/管道失败立即终止
    defaults:
      run:
        shell: "bash --noprofile --norc -euo pipefail {0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 1️⃣ 加载环境变量
      # =========================
      - name: Load config
        run: |
          # 假设根目录有 config.env 文件，如果没有请取消注释下面创建默认配置的代码
          if [ ! -f config.env ]; then
            cat > config.env <<EOF
            KERNEL_SOURCE=https://github.com/MiCodeOfficial/kernel_xiaomi_msm8998.git
            KERNEL_SOURCE_BRANCH=android-9.0
            KERNEL_CONFIG=sagit_user_defconfig
            KERNEL_IMAGE_NAME=Image.gz-dtb
            KERNEL_ZIP_NAME=MI6-Kernel-KSU-LXC
            KERNELSU_TAG=v0.9.5
            ENABLE_KERNELSU=true
            ENABLE_LXC_DOCKER=${{ github.event.inputs.enable_lxc_docker }}
            EOF
          fi
          
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV
          # 导出变量供后续步骤使用
          while IFS='=' read -r key value; do
            echo "$key=$value" >> $GITHUB_ENV
          done < <(grep -v '^#' config.env | grep -v '^$')

          for v in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME KERNELSU_TAG; do
            val="${!v}"
            if [ -z "$val" ]; then
              echo "::error::config.env 中 $v 为空，请检查"
              exit 1
            fi
            echo "$v=$val"
          done

      # =========================
      # 2️⃣ 安装依赖
      # =========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
          libssl-dev libelf-dev wget curl python2 python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          for t in git make flex bison ccache zip python2 aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc; do
            command -v "$t" >/dev/null || { echo "::error::缺少工具 $t"; exit 1; }
          done

          mkdir -p $HOME/.local/bin
          ln -sf /usr/bin/python2 $HOME/.local/bin/python
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python --version
          echo "依赖安装完成"

      # =========================
      # 3️⃣ 准备工作目录
      # =========================
      - name: Prepare workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          test -d $GITHUB_WORKSPACE/kernel_workspace
          echo "工作目录创建完成"

      # =========================
      # 4️⃣ 恢复Clang缓存
      # =========================
      - name: Restore Clang cache
        id: cache-clang-restore
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      # =========================
      # 5️⃣ 设置Clang
      # =========================
      - name: Setup Clang
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ "${{ steps.cache-clang-restore.outputs.cache-hit }}" != "true" ]; then
            echo "未命中Clang缓存，开始下载..."
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          else
            echo "命中Clang缓存，跳过下载"
          fi

          if [ -x clang-aosp/clang-r450784d/bin/clang ]; then
            CLANG_BIN="$PWD/clang-aosp/clang-r450784d/bin"
          else
            CLANG_BIN="$(ls -d "$PWD"/clang-aosp/clang-r*/bin 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::未找到可用的clang工具链"
            ls clang-aosp/
            exit 1
          fi
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          "$CLANG_BIN/clang" --version | head -n1
          echo "Clang配置完成"

      # =========================
      # 6️⃣ 恢复内核源码缓存
      # =========================
      - name: Restore Kernel Source cache
        id: cache-kernel-restore
        uses: actions/cache/restore@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}

      # =========================
      # 7️⃣ 克隆内核
      # =========================
      - name: Clone kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ "${{ steps.cache-kernel-restore.outputs.cache-hit }}" != "true" ]; then
            echo "未命中内核源码缓存，开始克隆..."
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          else
            echo "命中内核源码缓存，跳过克隆"
          fi
          cd android-kernel
          git rev-parse --is-inside-work-tree

          if [ ! -f "arch/arm64/configs/${{ env.KERNEL_CONFIG }}" ]; then
            echo "::error::配置文件 arch/arm64/configs/${{ env.KERNEL_CONFIG }} 不存在！该分支实际可用配置："
            ls arch/arm64/configs/
            exit 1
          fi
          sed -n '1,4p' Makefile
          echo "内核源码准备完成"

      # =========================
      # 🔧 源码兼容性补丁 (关键修复步骤)
      # =========================
      - name: Fix build compatibility
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "=== 修复1：dtc yylloc多重定义错误 ==="
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            if [ -f "$f" ] && grep -q '^YYLTYPE yylloc;$' "$f"; then
              sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' "$f"
            fi
          done
          # 校验修复是否生效
          if grep -q '^YYLTYPE yylloc;$' scripts/dtc/dtc-lexer.lex.c_shipped; then
             echo "Error: dtc fix failed"
             exit 1
          fi

          echo "=== 修复2：彻底清除所有gcc-wrapper相关残留，根治gcc-command报错 ==="
          WRAPPER=scripts/gcc-wrapper.py
          # 全目录全局删除wrapper文件，避免遗漏
          find . -name "gcc-wrapper.py" -delete
          find . -name "gcc-command" -delete
          # 全局清除所有Makefile中的wrapper引用，彻底切断报错源
          # 注意：这里使用更稳健的sed替换，防止因格式不同导致替换失败
          find . -name "Makefile" -exec sed -i '/REAL_CC/d' {} +
          find . -name "Makefile" -exec sed -i 's|CC.*=.*gcc-wrapper.py|CC := $(CROSS_COMPILE)clang|g' {} +
          
          # 最终校验无残留
          if grep -r "gcc-wrapper" --include="Makefile" .; then
             echo "Warning: 仍残留gcc-wrapper引用，尝试强制清理..."
             find . -name "Makefile" -exec sed -i '/gcc-wrapper/d' {} +
          fi
          echo "gcc-wrapper 完全清理完成"

          echo "=== 修复3：注入安全的Clang兼容参数（移除PAC/BTI相关） ==="
          # 注意：这里故意不包含 -fno-pac-bti 和 -mbranch-protection
          # 因为MSM8998/Android9内核不需要且不支持这些现代ARM特性
          FLAGS="-Wno-error=array-bounds -Wno-array-bounds -Wno-error=int-conversion -Wno-int-conversion -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-unused-but-set-variable -Wno-unused-const-variable -Wno-psabi -mno-outline-atomics"
          
          for flag in $FLAGS; do
            # 只有当Makefile中不存在该flag时才添加，避免重复
            if ! grep -q "${flag}" Makefile; then
              echo "KBUILD_CFLAGS += ${flag}" >> Makefile
            fi
          done
          echo "已注入兼容参数，已确认移除PAC/BTI相关标志"

          echo "=== 修复4：KernelSU 补丁 ==="
          if [ "${{ env.ENABLE_KERNELSU }}" = "true" ] && [ ! -d KernelSU ]; then
            git clone https://github.com/tiann/KernelSU.git KernelSU
            git -C KernelSU checkout ${{ env.KERNELSU_TAG }}
            ln -sfn "$(realpath --relative-to=drivers KernelSU/kernel)" drivers/kernelsu
            grep -q 'kernelsu' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            grep -q "EXPORT_SYMBOL(kallsyms_lookup_name)" kernel/kallsyms.c || echo 'EXPORT_SYMBOL(kallsyms_lookup_name);' >> kernel/kallsyms.c
            sed -i 's/depends on CMA/depends on CMA || !CMA/g' KernelSU/kernel/Kconfig
          fi
          echo "所有兼容性修复完成"

      # =========================
      # 8️⃣ 清理构建缓存
      # =========================
      - name: Clean kernel build
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper || true
          test ! -d out
          echo "构建目录清理完成"

      # =========================
      # 9️⃣ 生成 Docker/LXC 配置
      # =========================
      - name: Apply Docker/LXC config
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat > docker_config.txt <<'TXT_EOF'
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_MEMCG_KMEM=y
          CONFIG_BLK_CGROUP=y
          CONFIG_DEBUG_BLK_CGROUP=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_VETH=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_KEYS=y
          CONFIG_ENCRYPTED_KEYS=y
          CONFIG_KEY_DH_OPERATIONS=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_KPROBES=y
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          TXT_EOF

          sed -i 's/\r$//' docker_config.txt
          test -s docker_config.txt
          echo "Docker/LXC配置片段生成完成，共$(wc -l < docker_config.txt)行"

      # =========================
      # 🔟 内核配置
      # =========================
      - name: Configure Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          # 1. 强制清理之前的构建残留，防止旧配置干扰
          make mrproper || true
          rm -rf out
          
          # 2. 设置环境变量
          export PATH="$HOME/.local/bin:$CLANG_BIN:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          
          # 3. 确认 defconfig 文件存在
          DEFCONFIG=${{ env.KERNEL_CONFIG }}
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Error: Defconfig ${DEFCONFIG} not found in arch/arm64/configs/"
            ls arch/arm64/configs/ | grep sagit
            exit 1
          fi
          
          # 4. 生成初始 .config
          echo "Generating config from ${DEFCONFIG}..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 ${DEFCONFIG}
          
          # 5. 校验 .config 是否生成成功
          if [ ! -f "out/.config" ]; then
            echo "Error: .config was not generated!"
            exit 1
          fi
          
          # 6. 合并Docker/LXC配置片段（如果开启）
          if [ "${{ env.ENABLE_LXC_DOCKER }}" = "true" ] && [ -f ../docker_config.txt ]; then
            echo "Merging Docker/LXC config..."
            cat ../docker_config.txt >> out/.config
          fi

          # 7. (可选) 启用 KernelSU 配置项
          if [ "${{ env.ENABLE_KERNELSU }}" = "true" ]; then
            scripts/config --file out/.config -e CONFIG_KSU
          fi
          
          # 8. 应用配置变更并生成最终的 auto.conf
          echo "Applying configuration changes..."
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          
          # 9. 全量校验所有配置产物，无异常才返回0，彻底避免隐形非0退出
          if [ ! -f out/.config ]; then
            echo "Error: out/.config missing after olddefconfig"
            exit 1
          fi
          if [ ! -f out/include/config/auto.conf ]; then
            echo "Error: out/include/config/auto.conf missing"
            exit 1
          fi
          if [ "${{ env.ENABLE_KERNELSU }}" = "true" ] && ! grep -q "CONFIG_KSU=y" out/.config; then
            echo "Error: CONFIG_KSU is not enabled in final config"
            exit 1
          fi
          
          echo "Kernel configuration completed successfully."
          echo "所有配置文件校验通过，无异常残留"
          exit 0

      # =========================
      # 1️⃣1️⃣ 设置 ccache
      # =========================
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G

      # =========================
      # 1️⃣2️⃣ 编译内核
      # =========================
      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          export PATH="$HOME/.local/bin:$CLANG_BIN:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # 关键：使用 O=out 指定输出目录，并保持与配置步骤一致
          # -j$(nproc --all) 使用所有可用核心并行编译
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 2>&1 | tee build.log
          
          # 检查编译结果
          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Kernel Image built successfully!"
          else
            echo "❌ Kernel Image not found!"
            exit 1
          fi

      # =========================
      # 1️⃣3️⃣ 打包内核
      # =========================
      - name: Pack kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3

          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sagit/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=/g' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=/g' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=/g' anykernel.sh

          sed -i '/init.tuna.rc/d' anykernel.sh
          sed -i '/fstab.tuna/d' anykernel.sh
          sed -i '/replace_string init.rc/d' anykernel.sh
          sed -i '/insert_line init.tuna/d' anykernel.sh
          sed -i '/patch_fstab fstab.tuna/d' anykernel.sh
          sed -i '/append_file init.tuna/d' anykernel.sh
          sed -i '/append_file fstab.tuna/d' anykernel.sh
          sed -i '/bootscript/d' anykernel.sh
          sed -i '/usbdisk/d' anykernel.sh

          grep -q 'device.name1=sagit' anykernel.sh || { echo "AnyKernel3适配失败"; exit 1; }
          cd ..

          IMAGE_FILE="${{ env.KERNEL_IMAGE_NAME }}"
          if [ -z "$IMAGE_FILE" ]; then
            IMAGE_FILE="Image.gz-dtb"
          fi
          cp android-kernel/out/arch/arm64/boot/${IMAGE_FILE} AnyKernel3/
          test -s "AnyKernel3/${IMAGE_FILE}" || { echo "镜像复制失败"; exit 1; }

          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          echo "刷机包打包完成"

      # =========================
      # 1️⃣4️⃣ 上传内核包
      # =========================
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      # =========================
      # 1️⃣5️⃣ 上传编译日志
      # =========================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: warn

      # =========================
      # 🔋 新增：缓存保存步骤（官方推荐替代save-always，无论成功失败都保存）
      # =========================
      - name: Save Clang cache
        if: always() && steps.cache-clang-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: Save Kernel Source cache
        if: always() && steps.cache-kernel-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}
