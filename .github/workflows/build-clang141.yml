      - name: 【修复Clang兼容2】AppArmor crypto.c 变长数组
        id: fix-apparmor
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp security/apparmor/crypto.c security/apparmor/crypto.c.bak
          python3 << 'PYEOF'
          content = open('security/apparmor/crypto.c', 'r').read()
          func_name = 'int aa_calc_profile_hash'
          idx = content.find(func_name)
          if idx == -1:
              func_name = 'aa_calc_profile_hash'
              idx = content.find(func_name)
          if idx == -1:
              print("[✗] 未找到函数")
              exit(1)
          brace_start = content.find('{', idx)
          depth = 1
          pos = brace_start + 1
          while pos < len(content) and depth > 0:
              if content[pos] == '{': depth += 1
              elif content[pos] == '}': depth -= 1
              pos += 1
          new_func = '''int aa_calc_profile_hash(struct aa_profile *profile, u32 version, void *start, size_t len)
          {
              struct shash_desc *desc;
              int error = -ENOMEM;
              u32 le32_version = cpu_to_le32(version);
              if (!apparmor_tfm) return 0;
              profile->hash = kzalloc(apparmor_hash_size, GFP_KERNEL);
              if (!profile->hash) goto fail;
              desc = kzalloc(sizeof(*desc) + crypto_shash_descsize(apparmor_tfm), GFP_KERNEL);
              if (!desc) goto fail;
              desc->tfm = apparmor_tfm;
              desc->flags = 0;
              error = crypto_shash_init(desc);
              if (error) goto fail_desc;
              error = crypto_shash_update(desc, (u8 *)&le32_version, 4);
              if (error) goto fail_desc;
              error = crypto_shash_update(desc, (u8 *)start, len);
              if (error) goto fail_desc;
              error = crypto_shash_final(desc, profile->hash);
              if (error) goto fail_desc;
              kfree(desc);
              return 0;
          fail_desc:
              kfree(desc);
          fail:
              kfree(profile->hash);
              profile->hash = NULL;
              return error;
          }'''
          content = content[:idx] + new_func + content[pos:]
          open('security/apparmor/crypto.c', 'w').write(content)
          print("[✓] AppArmor crypto.c 修复完成")
          PYEOF

