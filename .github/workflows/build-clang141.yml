name: Build Kernel for Sagit (Xiaomi 6) - Docker/LXC/KernelSU

on:
  push:
    branches: [ main, master ]
    paths:
      - 'config.env'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
    inputs:
      model:
        description: '手机代号'
        required: false
        default: 'sagit'
      kernel:
        description: '内核源码地址'
        required: false
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      branch:
        description: '内核分支'
        required: false
        default: 'sagit-p-oss'
      kernelsu:
        description: '是否开启KernelSU'
        required: false
        type: boolean
        default: true
      kernelsu_version:
        description: 'KernelSU版本（非GKI必须用v0.9.5）'
        required: false
        default: 'v0.9.5'
      lxc_docker:
        description: '是否开启Docker/LXC支持'
        required: false
        type: boolean
        default: true
      llvm:
        description: '是否使用LLVM=1'
        required: false
        type: boolean
        default: false
      python2:
        description: '是否切换到Python2'
        required: false
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Load configuration
        run: |
          if [ -f config.env ]; then
            echo "=== Load local config.env ==="
            cat config.env
            source config.env
            echo "KERNEL_SOURCE=${KERNEL_SOURCE}" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=${KERNEL_BRANCH}" >> $GITHUB_ENV
            echo "ENABLE_KERNELSU=${ENABLE_KERNELSU}" >> $GITHUB_ENV
            echo "KSU_VERSION=${KSU_VERSION}" >> $GITHUB_ENV
            echo "ENABLE_DOCKER_LXC=${ENABLE_DOCKER_LXC}" >> $GITHUB_ENV
            echo "LLVM_CONFIG=${LLVM_CONFIG}" >> $GITHUB_ENV
            echo "SWITCH_PYTHON=${SWITCH_PYTHON}" >> $GITHUB_ENV
          else
            echo "=== Use default config ==="
            echo "KERNEL_SOURCE=https://github.com/MiCode/Xiaomi_Kernel_OpenSource" >> $GITHUB_ENV
            echo "KERNEL_BRANCH=sagit-p-oss" >> $GITHUB_ENV
            echo "ENABLE_KERNELSU=true" >> $GITHUB_ENV
            echo "KSU_VERSION=v0.9.5" >> $GITHUB_ENV
            echo "ENABLE_DOCKER_LXC=true" >> $GITHUB_ENV
            echo "LLVM_CONFIG=false" >> $GITHUB_ENV
            echo "SWITCH_PYTHON=true" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: |
          echo "=== Install build dependencies ==="
          sudo apt update -y
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip unzip python2 python3-pip device-tree-compiler cpio xz-utils gcc-arm-linux-gnueabi libssl-dev:i386
          sudo pip3 install backports.lzma
          if [ "${{ env.SWITCH_PYTHON }}" = "true" ]; then
            echo "=== Switch default python to python2.7 ==="
            sudo ln -sf /usr/bin/python2.7 /usr/bin/python
            python --version
          fi

      - name: Setup Clang toolchain cache
        uses: actions/cache@v3
        id: clang-cache
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang
          key: clang-proton-v1

      - name: Download Clang if not cached
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          echo "=== Download proton-clang 12 ==="
          mkdir -p ${{ github.workspace }}/kernel_workspace
          cd ${{ github.workspace }}/kernel_workspace
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O proton-clang.zip
          unzip -q proton-clang.zip
          mv proton-clang-master clang
          rm proton-clang.zip
          echo "[OK] Clang downloaded: $(./clang/bin/clang --version | head -1)"

      - name: Setup kernel source cache
        uses: actions/cache@v3
        id: kernel-cache
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-sagit-p-oss-v8

      - name: Clone kernel if not cached
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/kernel_workspace
          cd ${{ github.workspace }}/kernel_workspace
          echo "=== Clone kernel source from ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} ==="
          git clone --depth=1 ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} android-kernel

      - name: Clean build directory
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== Clean kernel build directory ==="
          rm -rf out
          mkdir -p out

      - name: Generate base defconfig
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== Generate base defconfig ==="
          make O=out ARCH=arm64 sagit_defconfig

      - name: Integrate official KernelSU v0.9.5
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== Integrate official KernelSU v0.9.5 (with auto-hooks) ==="
          rm -rf KernelSU-Next drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          echo "ccflags-y += -w -Wno-error" >> drivers/kernelsu/Makefile
          echo "[OK] KernelSU integrated successfully"

      - name: Add Docker and LXC config
        if: env.ENABLE_DOCKER_LXC == 'true'
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== Add Docker/LXC kernel config ==="
          CONFIGS=(
            "CONFIG_NAMESPACES=y" "CONFIG_NET_NS=y" "CONFIG_PID_NS=y"
            "CONFIG_IPC_NS=y" "CONFIG_UTS_NS=y" "CONFIG_USER_NS=y"
            "CONFIG_CGROUPS=y" "CONFIG_CGROUP_FREEZER=y" "CONFIG_CGROUP_PIDS=y"
            "CONFIG_CGROUP_DEVICE=y" "CONFIG_CGROUP_CPUACCT=y" "CONFIG_CGROUP_SCHED=y"
            "CONFIG_CPUSETS=y" "CONFIG_MEMCG=y" "CONFIG_KEYS=y"
            "CONFIG_VETH=y" "CONFIG_BRIDGE=y" "CONFIG_BRIDGE_NETFILTER=y"
            "CONFIG_IP_NF_FILTER=y" "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
            "CONFIG_NETFILTER_XT_MATCH_IPVS=y" "CONFIG_IP_NF_NAT=y" "CONFIG_NF_NAT=y"
            "CONFIG_POSIX_MQUEUE=y" "CONFIG_OVERLAY_FS=y" "CONFIG_OVERLAY_FS_REDIRECT_DIR=y"
            "CONFIG_OVERLAY_FS_INDEX=y" "CONFIG_NETFILTER=y" "CONFIG_NF_CONNTRACK=y"
            "CONFIG_NETFILTER_XT_MARK=y" "CONFIG_IP_VS=y" "CONFIG_IP_VS_PROTO_TCP=y"
            "CONFIG_IP_VS_PROTO_UDP=y" "CONFIG_IP_VS_RR=y" "CONFIG_NET_CLS_CGROUP=y"
            "CONFIG_BPF_SYSCALL=y" "CONFIG_BPF_JIT=y" "CONFIG_SECCOMP=y"
            "CONFIG_SECCOMP_FILTER=y" "CONFIG_CAPABILITIES=y" "CONFIG_FHANDLE=y"
            "CONFIG_EVENTFD=y" "CONFIG_EPOLL=y" "CONFIG_UNIX_DIAG=y"
            "CONFIG_INET_DIAG=y" "CONFIG_INET_UDP_DIAG=y" "CONFIG_PACKET_DIAG=y"
            "CONFIG_NETLINK_DIAG=y" "CONFIG_SIGNALFD=y" "CONFIG_TIMERFD=y"
            "CONFIG_MODULE_SIG=n" "CONFIG_CC_STACKPROTECTOR_REGULAR=y"
          )
          for cfg in "${CONFIGS[@]}"; do echo "$cfg" >> out/.config; done
          echo "# CONFIG_MODULE_SIG_FORCE is not set" >> out/.config
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> out/.config
          sed -i '/^CONFIG_CC_STACKPROTECTOR_STRONG=y/d' out/.config
          make O=out ARCH=arm64 olddefconfig
          echo "[OK] Docker/LXC config added"

      - name: Apply compatibility patches
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== Apply compiler compatibility patches ==="
          if grep -q "^YYLTYPE yylloc;" scripts/dtc/dtc-lexer.l 2>/dev/null; then
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l
            echo "[OK] Patched dtc-lexer yylloc"
          fi
          for makefile in $(find . -type f \( -name "Makefile" -o -name "Kbuild" \)); do
            sed -i 's/ -Werror\b/ -w/g' $makefile
            sed -i 's/^KBUILD_CFLAGS += -Werror$/KBUILD_CFLAGS += -w/g' $makefile
          done
          echo "[OK] Replaced all -Werror with -w (will not break -Werror-implicit-function-declaration)"
          sed -i 's/^HOSTCFLAGS\s*=/HOSTCFLAGS = -w -fcommon -Wno-deprecated-declarations/g' Makefile
          echo "[OK] Patched HOSTCFLAGS"
          for dir in drivers/staging/android drivers/media/platform/msm/camera_v2 drivers/firmware/qcom security/apparmor net/wireless drivers/kernelsu; do
            if [ -f $dir/Makefile ]; then
              grep -q "ccflags-y += -w" $dir/Makefile || echo "ccflags-y += -w" >> $dir/Makefile
            fi
          done
          echo "[OK] Added -w to problematic driver Makefiles"

      - name: Build kernel
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          CLANG_PATH=${{ github.workspace }}/kernel_workspace/clang/bin
          echo "=== Compiler version ==="
          $CLANG_PATH/clang --version | head -1
          gcc --version | head -1
          echo "=== Starting kernel build ==="
          export PATH=$CLANG_PATH:$PATH
          set +euo pipefail
          make \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            -j$(nproc) 2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: ${BUILD_EXIT} ==="
          if [ ${BUILD_EXIT} -ne 0 ]; then
            echo "❌ BUILD FAILED"
            echo "=== Error lines ==="
            grep -iE "error:|undefined reference|multiple definition|fatal error|Stop\.|\*\*\*" ../build.log | grep -v "may conflict with" | tail -60
            echo "=== Last 60 lines of log ==="
            tail -60 ../build.log
            exit ${BUILD_EXIT}
          else
            echo "✅ BUILD SUCCESS"
          fi

      - name: Check built images
        if: success()
        run: |
          cd ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot
          echo "=== Built kernel images ==="
          ls -la Image* 2>/dev/null || true
          ls -la *.dtb 2>/dev/null || true

      - name: Download AnyKernel3
        run: |
          cd ${{ github.workspace }}/kernel_workspace
          echo "=== Download AnyKernel3 ==="
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf zImage *-dtb* *.img dtb* *.zip
          echo 'do.devicecheck=1' > anykernel.sh
          echo 'do.modules=0' >> anykernel.sh
          echo 'do.systemless=1' >> anykernel.sh
          echo 'do.cleanup=1' >> anykernel.sh
          echo 'device.name1=sagit' >> anykernel.sh
          echo 'device.name2=MCE16' >> anykernel.sh
          echo 'device.name3=MCT1' >> anykernel.sh
          echo 'block=/dev/block/bootdevice/by-name/boot;' >> anykernel.sh
          echo 'is_slot_device=0;' >> anykernel.sh
          echo 'ramdisk_compression=auto;' >> anykernel.sh
          echo '. tools/ak3-core.sh;' >> anykernel.sh
          echo 'dump_boot;' >> anykernel.sh
          echo 'write_boot;' >> anykernel.sh
          echo "[OK] AnyKernel3 configured for Mi 6"

      - name: Package flashable zip
        if: success()
        run: |
          cd ${{ github.workspace }}/kernel_workspace
          AK=AnyKernel3
          BOOT=android-kernel/out/arch/arm64/boot
          if [ -f $BOOT/Image.gz-dtb ]; then
            cp $BOOT/Image.gz-dtb $AK/zImage
          elif [ -f $BOOT/Image.gz ]; then
            cp $BOOT/Image.gz $AK/zImage
          else
            echo "❌ No kernel image found"
            ls -la $BOOT/
            exit 1
          fi
          cd $AK
          ZIP=KernelSU-Docker-LXC-sagit-$(date +%Y%m%d-%H%M).zip
          zip -r9 ../$ZIP * -x "*.git*" "README.md"
          echo "[OK] Flashable zip created: $ZIP"
          ls -la ../$ZIP

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build-v18
          path: |
            ${{ github.workspace }}/kernel_workspace/*.zip
            ${{ github.workspace }}/kernel_workspace/build.log
          retention-days: 30
