name: Build Xiaomi Mi6 Kernel (KernelSU-Next + Docker + LXC)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        run: |
          echo "=== 安装依赖 ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 python3 python3-pip device-tree-compiler libssl-dev libelf-dev wget \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "[✓] 依赖安装完成"

      - name: Setup Toolchain
        id: toolchain
        run: |
          echo "=== 下载Clang工具链 ==="
          mkdir -p $HOME/toolchains/clang
          cd $HOME/toolchains/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz
          tar -xzf clang-${{ env.CLANG_VERSION }}.tar.gz
          rm clang-${{ env.CLANG_VERSION }}.tar.gz
          echo "[✓] Clang ${{ env.CLANG_VERSION }} 下载完成"

          echo "=== 下载GCC 64位工具链 ==="
          mkdir -p $HOME/toolchains/gcc64
          cd $HOME/toolchains/gcc64
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/${{ env.GCC_64_VERSION }}/+archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz
          rm master.tar.gz
          echo "[✓] GCC64 ${{ env.GCC_64_VERSION }} 下载完成"

          echo "=== 下载GCC 32位工具链 ==="
          mkdir -p $HOME/toolchains/gcc32
          cd $HOME/toolchains/gcc32
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/${{ env.GCC_32_VERSION }}/+archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz
          rm master.tar.gz
          echo "[✓] GCC32 ${{ env.GCC_32_VERSION }} 下载完成"

          echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV
          echo "GCC64_PATH=$HOME/toolchains/gcc64/bin" >> $GITHUB_ENV
          echo "GCC32_PATH=$HOME/toolchains/gcc32/bin" >> $GITHUB_ENV
          echo "[✓] 工具链路径已写入环境变量"

      - name: Clone Kernel Source
        run: |
          echo "=== 克隆小米6官方内核源码 ==="
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 --branch ${{ env.KERNEL_SOURCE_BRANCH }} ${{ env.KERNEL_SOURCE }} android-kernel
          cd android-kernel
          echo "[✓] 内核源码克隆完成，分支: $(git rev-parse --abbrev-ref HEAD)"

      - name: Load Kernel Config
        run: |
          echo "=== 加载内核配置 ${{ env.KERNEL_CONFIG }} ==="
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 内核配置加载完成"

      - name: Apply Clang Compatibility Patches
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== 应用Clang兼容补丁 ==="

          # 修复writeback.h __printf格式字符串错误
          echo "[1/6] 修复include/linux/writeback.h格式字符串错误"
          sed -i 's/__printf(2, 3)/__printf(3, 4)/g' include/linux/writeback.h

          # 修复apparmor变长数组零大小错误
          echo "[2/6] 修复security/apparmor/label.c变长数组错误"
          sed -i 's/\(char\s*buf\[STR\_VEC\_START\_LEN\)\s*\+\s*len\s*\(.*\)/\1 + 0\2/g' security/apparmor/label.c || true

          # 修复asm-generic/percpu.h栈溢出错误
          echo "[3/6] 修复include/asm-generic/percpu.h内联函数错误"
          sed -i '/#define __percpu_arg/,/}/c\#define __percpu_arg(x) __stringify(%x0)' include/asm-generic/percpu.h

          # 修复arch/arm64/include/asm/stack_pointer.h current_stack_pointer编译错误
          echo "[4/6] 修复arch/arm64/include/asm/stack_pointer.h寄存器错误"
          sed -i 's/"sp"/"x18"/g' arch/arm64/include/asm/stack_pointer.h

          # 修复include/linux/spinlock.h w9寄存器位宽错误
          echo "[5/6] 修复include/linux/spinlock.h汇编位宽错误"
          sed -i 's/w9/w19/g' include/linux/spinlock.h
          sed -i 's/w10/w20/g' include/linux/spinlock.h
          sed -i 's/w11/w21/g' include/linux/spinlock.h
          sed -i 's/w12/w22/g' include/linux/spinlock.h
          sed -i 's/w13/w23/g' include/linux/spinlock.h
          sed -i 's/w14/w24/g' include/linux/spinlock.h
          sed -i 's/w15/w25/g' include/linux/spinlock.h

          # 修复dtc yylloc多重定义错误
          echo "[6/6] 修复scripts/dtc yylloc多重定义链接错误"
          echo "HOSTCFLAGS += -fcommon -w" >> scripts/Makefile
          echo "HOSTLDFLAGS += -fcommon" >> scripts/Makefile

          # 全局递归关闭所有警告
          echo ""
          echo "=== 应用全局递归警告豁免 ==="
          echo "subdir-ccflags-y += -w -Wno-error" >> Makefile
          echo "KBUILD_CFLAGS += -w -Wno-error" >> Makefile
          echo "[✓] 全局警告豁免生效，所有Clang警告不会终止编译"

          echo ""
          echo "=== 重新生成内核配置 ==="
          make O=out ARCH=arm64 olddefconfig
          echo "[✓] Clang兼容补丁全部应用完成"

      - name: Apply Docker/LXC Feature Config
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== 配置Docker/LXC/KVM所需内核特性 ==="
          # 开启命名空间、cgroup、桥接、veth等容器依赖
          scripts/config --file out/.config -e CONFIG_NAMESPACES
          scripts/config --file out/.config -e CONFIG_NET_NS
          scripts/config --file out/.config -e CONFIG_PID_NS
          scripts/config --file out/.config -e CONFIG_IPC_NS
          scripts/config --file out/.config -e CONFIG_UTS_NS
          scripts/config --file out/.config -e CONFIG_CGROUPS
          scripts/config --file out/.config -e CONFIG_CGROUP_FREEZER
          scripts/config --file out/.config -e CONFIG_CGROUP_DEVICE
          scripts/config --file out/.config -e CONFIG_CGROUP_CPUACCT
          scripts/config --file out/.config -e CONFIG_CGROUP_SCHED
          scripts/config --file out/.config -e CONFIG_CPUSETS
          scripts/config --file out/.config -e CONFIG_MEMCG
          scripts/config --file out/.config -e CONFIG_KEYS
          scripts/config --file out/.config -e CONFIG_VETH
          scripts/config --file out/.config -e CONFIG_BRIDGE
          scripts/config --file out/.config -e CONFIG_BRIDGE_NETFILTER
          scripts/config --file out/.config -e CONFIG_NF_NAT
          scripts/config --file out/.config -e CONFIG_IP_NF_FILTER
          scripts/config --file out/.config -e CONFIG_IP_NF_TARGET_MASQUERADE
          scripts/config --file out/.config -e CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          scripts/config --file out/.config -e CONFIG_NETFILTER_XT_MATCH_IPVS
          scripts/config --file out/.config -e CONFIG_IP_NF_NAT
          scripts/config --file out/.config -e CONFIG_NF_NAT_NEEDED
          scripts/config --file out/.config -e CONFIG_POSIX_MQUEUE
          scripts/config --file out/.config -e CONFIG_DEVPTS_MULTIPLE_INSTANCES
          scripts/config --file out/.config -e CONFIG_OVERLAY_FS
          scripts/config --file out/.config -d CONFIG_STRICT_MEMORY_RWX
          # 开启KVM支持
          scripts/config --file out/.config -e CONFIG_KVM
          scripts/config --file out/.config -e CONFIG_KVM_ARM_HOST
          # 禁用模块签名避免OpenSSL 3.0错误
          scripts/config --file out/.config -d CONFIG_MODULE_SIG
          scripts/config --file out/.config -d CONFIG_MODULE_SIG_FORCE
          scripts/config --file out/.config -d CONFIG_MODULE_SIG_ALL
          # 重新生成配置
          make O=out ARCH=arm64 olddefconfig
          echo "[✓] Docker/LXC/KVM内核特性配置完成"

      - name: Integrate KernelSU-Next
        run: |
          chmod +x $GITHUB_WORKSPACE/ksu-legacy-setup.sh
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== 当前工作目录: $(pwd) ==="
          ls -la
          bash $GITHUB_WORKSPACE/ksu-legacy-setup.sh

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== 编译器版本信息 ==="
          ${{ env.CLANG_PATH }}/clang --version
          echo "====================="

          echo "=== 开始编译内核 ==="
          export PATH="${{ env.CLANG_PATH }}:${{ env.GCC64_PATH }}:${{ env.GCC32_PATH }}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=aarch64-linux-gnu-ld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc) 2>&1 | tee build.log

          if [ -f out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
            echo "✅ 内核编译成功！内核文件: out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}"
          else
            echo "❌ 内核编译失败，查看build.log获取错误信息"
            tail -n 200 build.log
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          echo "=== 下载AnyKernel3打包脚本 ==="
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          cp $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} .

          # 配置AnyKernel3
          echo "kernel.string=MI6 KernelSU-Next v3.4.0 + Docker + LXC (Clang14)" > anykernel.sh
          echo "do.devicecheck=1" >> anykernel.sh
          echo "do.modules=0" >> anykernel.sh
          echo "do.systemless=1" >> anykernel.sh
          echo "do.cleanup=1" >> anykernel.sh
          echo "do.cleanuponabort=0" >> anykernel.sh
          echo "device.name1=sagit" >> anykernel.sh
          echo "device.name2=MI6" >> anykernel.sh
          echo "supported.versions=9" >> anykernel.sh
          echo "supported.patchlevels=" >> anykernel.sh
          echo "block=/dev/block/bootdevice/by-name/boot;" >> anykernel.sh
          cat anykernel.sh

          echo "=== 生成刷机包 ==="
          zip -r9 ${{ env.KERNEL_ZIP_NAME }} * -x .git README.md *placeholder
          cp ${{ env.KERNEL_ZIP_NAME }} $GITHUB_WORKSPACE/
          echo "✅ 刷机包生成完成: ${{ env.KERNEL_ZIP_NAME }}"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: ${{ github.workspace }}/${{ env.KERNEL_ZIP_NAME }}
          retention-days: 30
