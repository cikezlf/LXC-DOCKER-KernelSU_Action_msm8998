name: 小米6 (sagit) 内核编译 - KernelSU + Docker/LXC v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 加载配置 config.env
        run: grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
            libssl-dev libelf-dev libncurses5-dev wget curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python2 python3 device-tree-compiler cpio xz-utils lz4
          if [ "${{ env.SWITCH_PYTHON }}" = "true" ]; then
            sudo ln -sf /usr/bin/python2 /usr/bin/python
          fi
          python --version

      - name: 准备工作目录 + 写入脚本/配置
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace/scripts
          python3 -c "import base64; open('$GITHUB_WORKSPACE/kernel_workspace/scripts/patch_kernel.sh','wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('$GITHUB_WORKSPACE/kernel_workspace/scripts/integrate_ksu.sh','wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('$GITHUB_WORKSPACE/kernel_workspace/scripts/merge_config.py','wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('$GITHUB_WORKSPACE/kernel_workspace/docker_lxc.config','wb').write(base64.b64decode(''))"
          python3 -c "import base64; open('$GITHUB_WORKSPACE/kernel_workspace/kvm.config','wb').write(base64.b64decode('Q09ORklHX1ZJUlRVQUxJWkFUSU9OPXkKQ09ORklHX0tWTT15CkNPTkZJR19LVk1fTVNNPXkK'))"
          chmod +x $GITHUB_WORKSPACE/kernel_workspace/scripts/*.sh
          echo ">>> 所有脚本/配置已就绪"
          ls -la $GITHUB_WORKSPACE/kernel_workspace/scripts/
          wc -l $GITHUB_WORKSPACE/kernel_workspace/docker_lxc.config

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          path: kernel_workspace/toolchains
          key: mi6-toolchains-aospgcc-proton-v3

      - name: 下载编译工具链
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          mkdir -p toolchains && cd toolchains
          if [ ! -d gcc64 ]; then
            echo ">>> 下载 aarch64 GCC 4.9..."
            wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android10-release.tar.gz -O gcc64.tar.gz
            mkdir -p gcc64 && tar -xzf gcc64.tar.gz -C gcc64 && rm gcc64.tar.gz
          fi
          if [ ! -d gcc32 ]; then
            echo ">>> 下载 arm GCC 4.9..."
            wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android10-release.tar.gz -O gcc32.tar.gz
            mkdir -p gcc32 && tar -xzf gcc32.tar.gz -C gcc32 && rm gcc32.tar.gz
          fi
          if [ ! -d clang-proton ]; then
            echo ">>> 下载 Proton Clang 13..."
            wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton-clang.tar.gz
            mkdir -p clang-proton
            tar -xzf proton-clang.tar.gz -C clang-proton --strip-components=1
            rm proton-clang.tar.gz
          fi
          echo ">>> 工具链就绪"

      - name: 缓存内核源码
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}-v4

      - name: 克隆内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            echo ">>> 克隆内核源码..."
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          fi
          echo ">>> 内核版本："
          head -5 android-kernel/Makefile

      - name: 应用编译前源码补丁
        run: bash $GITHUB_WORKSPACE/kernel_workspace/scripts/patch_kernel.sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel

      - name: 集成 KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: bash $GITHUB_WORKSPACE/kernel_workspace/scripts/integrate_ksu.sh $GITHUB_WORKSPACE/kernel_workspace/android-kernel ${{ env.KERNELSU_TAG }}

      - name: 追加 KVM 配置
        if: env.ENABLE_LXC_DOCKER == 'true' && env.ENABLE_KVM == 'true'
        run: cat $GITHUB_WORKSPACE/kernel_workspace/kvm.config >> $GITHUB_WORKSPACE/kernel_workspace/docker_lxc.config

      - name: 配置内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export ARCH=arm64 SUBARCH=arm64
          echo ">>> 清理..."
          rm -rf out
          make mrproper 2>/dev/null || true
          mkdir -p out
          echo ">>> 加载 defconfig..."
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo ">>> 合并额外配置..."
          cp $GITHUB_WORKSPACE/kernel_workspace/docker_lxc.config . 2>/dev/null || true
          python3 $GITHUB_WORKSPACE/kernel_workspace/scripts/merge_config.py
          echo ">>> 禁用 COMPAT_VDSO..."
          sed -i 's/^CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' out/.config
          echo ">>> olddefconfig 补齐依赖..."
          make O=out ARCH=arm64 olddefconfig
          echo ">>> 关键配置检查:"
          for c in CONFIG_KSU CONFIG_KPROBES CONFIG_OVERLAY_FS CONFIG_VETH CONFIG_CGROUPS CONFIG_USER_NS CONFIG_NF_NAT_IPV4 CONFIG_NAMESPACES; do
            printf "  %s = " "$c"
            grep "^${c}=" out/.config | head -1 || echo "(未设置)"
          done
          rm -f docker_lxc.config

      - name: 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          GCC64="$GITHUB_WORKSPACE/kernel_workspace/toolchains/gcc64/bin"
          GCC32="$GITHUB_WORKSPACE/kernel_workspace/toolchains/gcc32/bin"
          CLANG="$GITHUB_WORKSPACE/kernel_workspace/toolchains/clang-proton/bin"
          export PATH="$CLANG:$GCC64:$GCC32:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_HOST=CI KBUILD_BUILD_USER=MI6
          export HOSTCFLAGS="-fcommon -w"
          export HOSTCXXFLAGS="-fcommon -w"
          export KCFLAGS="-w -fcommon"
          echo ">>> 编译器版本："
          clang --version | head -2
          aarch64-linux-android-gcc --version | head -1
          arm-linux-androideabi-gcc --version | head -1
          echo ""
          echo ">>> 开始编译（-j$(nproc)）..."
          set +e
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo ""
          echo ">>> make 返回码: $BUILD_RC"
          if [ $BUILD_RC -ne 0 ]; then
            echo "========================================"
            echo "  编译失败！错误摘要（最后100条）："
            echo "========================================"
            grep -nE "error:|fatal error:|undefined reference|Stop\\.|Error [0-9]+" build.log | tail -100 || true
            echo "========================================"
            exit $BUILD_RC
          fi
          echo "">>> 编译成功！"
          ls -la out/arch/arm64/boot/

      - name: 打包 AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3 ]; then
            git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          fi
          cd AnyKernel3
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/' anykernel.sh
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/' anykernel.sh
          sed -i 's/patch_vbmeta_flag=auto;/patch_vbmeta_flag=0;/' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sagit/' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=MCE16/' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=MCT1/' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=MI6/' anykernel.sh
          for pat in init.tuna.rc fstab.tuna "replace_string init.rc" "insert_line init.tuna" "patch_fstab fstab.tuna" "append_file init.tuna" "append_file fstab.tuna" bootscript usbdisk; do
            sed -i "/${pat}/d" anykernel.sh
          done
          cd ..
          IMAGE_FILE="${{ env.KERNEL_IMAGE_NAME }}"
          [ -z "$IMAGE_FILE" ] && IMAGE_FILE="Image.gz-dtb"
          KERNEL_IMG="android-kernel/out/arch/arm64/boot/${IMAGE_FILE}"
          if [ ! -f "$KERNEL_IMG" ]; then
            for img in Image.gz-dtb Image.gz Image; do
              if [ -f "android-kernel/out/arch/arm64/boot/$img" ]; then
                KERNEL_IMG="android-kernel/out/arch/arm64/boot/$img"; IMAGE_FILE=$img; break
              fi
            done
          fi
          if [ ! -f "$KERNEL_IMG" ]; then
            echo "ERROR: 找不到内核镜像"; ls -la android-kernel/out/arch/arm64/boot/ || true; exit 1
          fi
          cp "$KERNEL_IMG" AnyKernel3/
          cd AnyKernel3
          rm -rf .git* README.md LICENSE modules patch
          [ ! -d ramdisk ] && mkdir -p ramdisk
          ZIP_NAME="${{ env.KERNEL_ZIP_NAME }}-$(date +%Y%m%d_%H%M).zip"
          zip -r9 "../$ZIP_NAME" . -x "*.zip"
          cd ..
          echo ">>> 打包完成: $ZIP_NAME"
          echo "ZIP_PATH=$GITHUB_WORKSPACE/kernel_workspace/$ZIP_NAME" >> $GITHUB_ENV

      - name: 上传内核刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: warn
