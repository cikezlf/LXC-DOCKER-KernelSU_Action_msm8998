name: 小米6内核编译CI (Docker/KernelSU支持)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # 全局设置：任何命令返回非0退出码立即终止任务，防止错误扩散
    defaults:
      run:
        shell: bash
        options: -eo pipefail

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 加载环境变量配置
        run: |
          # 加载 config.env 并过滤注释和空行
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV
          
          # 核心参数合法性预检
          echo "正在检查环境变量..."
          test -n "$KERNEL_SOURCE" || { echo "错误: KERNEL_SOURCE 为空"; exit 1; }
          test -n "$KERNEL_SOURCE_BRANCH" || { echo "错误: KERNEL_SOURCE_BRANCH 为空"; exit 1; }
          test -n "$KERNEL_CONFIG" || { echo "错误: KERNEL_CONFIG 为空"; exit 1; }
          test -n "$KERNEL_IMAGE_NAME" || { echo "错误: KERNEL_IMAGE_NAME 为空"; exit 1; }
          echo "环境变量加载成功。"

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
          libssl-dev libelf-dev wget curl python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          # 验证关键工具链是否安装成功
          command -v aarch64-linux-gnu-gcc > /dev/null
          command -v make > /dev/null
          command -v flex > /dev/null
          command -v bison > /dev/null
          echo "依赖安装并验证通过。"

      - name: 准备工作目录
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          test -d $GITHUB_WORKSPACE/kernel_workspace

      - name: 缓存 Clang 工具链
        uses: actions/cache@v4
        with:
          path: kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: 配置 Clang 编译器
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp ]; then
            echo "正在克隆 Clang 工具链..."
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          # 验证 Clang 路径
          CLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin"
          test -d "$CLANG_PATH" || { echo "错误: 未找到 Clang 目录"; exit 1; }
          echo "Clang 配置完成。"

      - name: 缓存内核源码
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}-${{ hashFiles('config.env') }}

      - name: 克隆内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            echo "正在从 $KERNEL_SOURCE 克隆分支 $KERNEL_SOURCE_BRANCH ..."
            git clone $KERNEL_SOURCE -b $KERNEL_SOURCE_BRANCH android-kernel --depth=1
          fi
          cd android-kernel
          git rev-parse --is-inside-work-tree
          
          # 【关键修复】验证 defconfig 文件是否存在，避免后续 make 报错
          CONFIG_FILE="arch/arm64/configs/${KERNEL_CONFIG}"
          test -f "$CONFIG_FILE" || { echo "错误: 配置文件 $CONFIG_FILE 不存在!"; ls arch/arm64/configs/; exit 1; }
          echo "内核源码准备就绪。"

      - name: 修复 DTC 编译兼容性 (Ubuntu 22.04)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          # 修复 Linux 4.4 在较新 flex/bison 版本下的 yylloc 多重定义问题
          echo "正在应用 dtc 兼容性修复..."
          # 确保只添加一次
          if ! grep -q "%option nounput" scripts/dtc/dtc-lexer.l; then
            sed -i '/^%option noyywrap/a%option nounput' scripts/dtc/dtc-lexer.l
            echo 'int yylloc;' >> scripts/dtc/dtc-lexer.l
          fi
          echo "DTC 修复应用完成。"

      - name: 清理构建环境
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper || true
          test ! -d out || { echo "错误: 输出目录清理失败"; exit 1; }

      - name: 生成 Docker/LXC/KernelSU 配置片段
        if: env.ENABLE_LXC_DOCKER == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat > docker_config.txt <<'TXT_EOF'
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_BLK_CGROUP=y
          CONFIG_OVERLAY_FS=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_VETH=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_NF_NAT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
          CONFIG_MEMCG_KMEM=y
          CONFIG_DEBUG_BLK_CGROUP=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_DISABLE_MANAGER is not set
          # CONFIG_KSU_DISABLE_POLICY is not set
          TXT_EOF
          test -f docker_config.txt
          echo "配置片段生成成功。"

      - name: 应用 KernelSU Legacy 补丁
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "正在为非 GKI 内核应用 KernelSU legacy 补丁..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s legacy
          # 验证 KernelSU 源码是否成功引入
          test -d KernelSU || { echo "错误: 补丁应用后未找到 KernelSU 目录"; exit 1; }
          echo "KernelSU 补丁应用成功。"

      - name: 配置内核选项
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export ARCH=arm64
          export O=out

          echo "加载基础 defconfig: $KERNEL_CONFIG"
          make O=out ARCH=arm64 $KERNEL_CONFIG
          test -f out/.config || { echo "错误: 未生成 .config 文件"; exit 1; }

          # 合并 Docker/LXC/KernelSU 配置片段
          if [ -f ../docker_config.txt ]; then
            echo "正在合并额外配置..."
            while read -r line; do
              # 跳过空行
              if [ -z "$line" ]; then continue; fi
              
              # 处理 "# CONFIG_XXX is not set"
              if [[ "$line" =~ ^#[[:space:]]CONFIG_ ]]; then
                config_name=$(echo "$line" | sed 's/^# *//;s/ *is not set//')
                sed -i "/^${config_name}=.*$/d" out/.config
                sed -i "/^# ${config_name} is not set$/d" out/.config
                echo "$line" >> out/.config
              # 跳过纯注释
              elif [[ "$line" =~ ^# ]]; then
                continue
              # 处理 "CONFIG_XXX=y"
              else
                config_name=$(echo "$line" | cut -d'=' -f1)
                sed -i "/^${config_name}=.*$/d" out/.config
                sed -i "/^# ${config_name} is not set$/d" out/.config
                echo "$line" >> out/.config
              fi
            done < ../docker_config.txt
          fi

          echo "正在运行 olddefconfig 解决依赖关系..."
          make O=out ARCH=arm64 olddefconfig
          
          # 最终校验配置文件
          test -s out/.config || { echo "错误: 最终 .config 为空或缺失"; exit 1; }
          echo "内核配置完成。"

      - name: 配置 Ccache 加速
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G

      - name: 编译内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH"
          export KBUILD_BUILD_HOST=CI
          export KBUILD_BUILD_USER=MI6

          echo "开始编译内核..."
          if [ "${{ env.LLVM_CONFIG }}" = "y" ]; then
            make -j$(nproc --all) O=out ARCH=arm64 \
              CC="ccache clang" \
              LLVM=1 LLVM_IAS=1 \
              CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" 2>&1 | tee build.log
          else
            make -j$(nproc --all) O=out ARCH=arm64 \
              CC="ccache clang" \
              CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="aarch64-linux-gnu-" \
              CROSS_COMPILE_ARM32="arm-linux-gnueabi-" 2>&1 | tee build.log
          fi

          # 关键校验：检查内核镜像是否生成
          IMAGE_PATH="out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}"
          if [ -s "$IMAGE_PATH" ]; then
            echo "编译成功: $IMAGE_PATH"
            ls -lh "$IMAGE_PATH"
          else
            echo "错误: 未在 $IMAGE_PATH 找到内核镜像"
            tail -n 50 build.log
            exit 1
          fi

      - name: 打包 AnyKernel3 刷机包
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # 克隆 AnyKernel3
          if [ ! -d AnyKernel3 ]; then
            git clone https://github.com/osm0sis/AnyKernel3
          fi
          test -d AnyKernel3

          cd AnyKernel3
          
          # 适配小米6 (sagit)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sagit/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=/g' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=/g' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=/g' anykernel.sh

          # 清理无关补丁脚本
          sed -i '/init.tuna.rc/d' anykernel.sh
          sed -i '/fstab.tuna/d' anykernel.sh
          sed -i '/replace_string init.rc/d' anykernel.sh
          sed -i '/insert_line init.tuna/d' anykernel.sh
          sed -i '/patch_fstab fstab.tuna/d' anykernel.sh
          sed -i '/append_file init.tuna/d' anykernel.sh
          sed -i '/append_file fstab.tuna/d' anykernel.sh
          sed -i '/bootscript/d' anykernel.sh
          sed -i '/usbdisk/d' anykernel.sh

          # 复制内核镜像
          cp ../android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} ./
          test -s ${{ env.KERNEL_IMAGE_NAME }} || { echo "错误: 复制内核镜像失败"; exit 1; }

          # 清理打包目录
          rm -rf .git* README.md
          rm -rf ramdisk modules patch
          
          echo "打包完成。"

      - name: 上传内核刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/*

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: warn
