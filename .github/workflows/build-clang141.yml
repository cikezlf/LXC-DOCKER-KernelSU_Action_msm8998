name: Build Custom Kernel for MI6 (sagit/msm8998)

on:
  push:
    branches: [ main ]
    paths:
      - 'config.env'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
    inputs:
      ksu_enable:
        description: 'Enable KernelSU (true/false)'
        required: false
        default: 'true'
      ksu_version:
        description: 'KernelSU version tag'
        required: false
        default: 'v0.9.5'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Load environment variables
      run: echo "加载配置环境..." && cp config.env $HOME/build_config.env && cat $HOME/build_config.env

    - name: Install dependencies
      run: |
        echo "安装编译依赖..."
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf lib32ncurses5-dev lib32z1-dev libelf-dev \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          openssl pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          ccache device-tree-compiler libfdt-dev python2 cpio xz-utils wget
        # 切换默认python到python2
        source $HOME/build_config.env
        if [ "$SWITCH_PYTHON" = "true" ]; then
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "Python默认版本已切换为python2"
        fi
        python --version
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace
        echo "KERNEL_WORKSPACE=$GITHUB_WORKSPACE/kernel_workspace" >> $GITHUB_ENV

    - name: Cache toolchains
      id: cache-toolchains
      uses: actions/cache@v4
      with:
        path: ${{ env.KERNEL_WORKSPACE }}/toolchains
        key: gcc-4.9-pie-${{ github.run_id }}
        restore-keys: |
          gcc-4.9-pie-

    - name: Download toolchains (纯GCC 4.9，Android Pie官方原生工具链)
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        source $HOME/build_config.env
        echo "下载aarch64 GCC 4.9工具链..."
        mkdir -p $TOOLCHAIN_DIR
        git clone --depth=1 -b $GCC_ARM64_BRANCH $GCC_ARM64_REPO $TOOLCHAIN_DIR/gcc-arm64
        echo "下载arm GCC 4.9工具链（编译32位部分）..."
        git clone --depth=1 -b $GCC_ARM32_BRANCH $GCC_ARM32_REPO $TOOLCHAIN_DIR/gcc-arm
        echo "GCC工具链下载完成"
        $TOOLCHAIN_DIR/gcc-arm64/bin/aarch64-linux-android-gcc --version
        $TOOLCHAIN_DIR/gcc-arm/bin/arm-linux-androideabi-gcc --version

    - name: Clone kernel source (小米6 sagit-p-oss官方开源内核)
      run: |
        source $HOME/build_config.env
        echo "克隆小米6官方开源内核源码($KERNEL_BRANCH)..."
        git clone --depth=1 -b $KERNEL_BRANCH $KERNEL_SOURCE $KERNEL_DIR
        echo "内核源码克隆完成"
        cd $KERNEL_DIR
        echo "内核源码版本: $(git log --oneline -1)"

    - name: Integrate KernelSU v0.9.5 (4.4内核专用版本)
      run: |
        source $HOME/build_config.env
        KSU_VERSION_ARG="${{ github.event.inputs.ksu_version || $KSU_VERSION }}"
        if [ "${{ github.event.inputs.ksu_enable || $KSU_ENABLE }}" = "true" ]; then
          echo "=== 集成 KernelSU $KSU_VERSION_ARG ==="
          cd $KERNEL_DIR
          # 下载KernelSU源码
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/$KSU_VERSION_ARG/kernel/setup.sh" | bash -s $KSU_VERSION_ARG
          echo "KernelSU 已集成到 drivers/kernelsu"
          # 给KernelSU的Makefile加-w关闭警告，防止GCC把警告当错误
          echo 'ccflags-y += -w' >> drivers/kernelsu/Makefile
          echo 'ccflags-y += -Wno-implicit-function-declaration' >> drivers/kernelsu/Makefile
          echo 'ccflags-y += -Wno-incompatible-pointer-types' >> drivers/kernelsu/Makefile
          # 4.4内核需要手动打开execveat钩子
          if grep -q "SYSCALL_DEFINE6(execveat" fs/exec.c; then
            echo "检测到4.4内核execveat，添加KSU钩子"
            sed -i 's/SYSCALL_DEFINE6(execveat/long __ksu_execveat(const char __user *filename, const char __user *const __user *argv, const char __user *const __user *envp, int flags);\nSYSCALL_DEFINE6(execveat/' fs/exec.c
          fi
        else
          echo "KernelSU已禁用"
        fi

    - name: Configure kernel with LXC/Docker/KSU support
      run: |
        source $HOME/build_config.env
        echo "=== 配置内核：合并Docker/LXC/KernelSU必需配置 ==="
        cd $KERNEL_DIR
        # 设置环境变量
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$TOOLCHAIN_DIR/gcc-arm64/bin:$TOOLCHAIN_DIR/gcc-arm/bin:$PATH"
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        # 先加载基础defconfig
        make O=$OUT_DIR $KERNEL_CONFIG
        echo "基础defconfig已加载"
        # 生成额外配置片段（仅4.4内核确实存在的选项）
        cat > $OUT_DIR/.config-fragment << 'EOF'
        #
        # Docker/LXC 容器支持配置 (kernel 4.4 valid options)
        #
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_PID_NS=y
        CONFIG_IPC_NS=y
        CONFIG_UTS_NS=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_KEYS=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_NETFILTER_XT_MARK=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_MATCH_BPF=n
        CONFIG_NF_NAT=y
        CONFIG_NF_NAT_NEEDED=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_NF_NAT_IPV4=y
        CONFIG_NF_NAT_NEEDED=y
        CONFIG_OVERLAY_FS=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_MEMCG_SWAP_ENABLED=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_SECCOMP=y
        CONFIG_SECCOMP_FILTER=y
        CONFIG_CAPABILITIES=y
        CONFIG_USER_NS=y
        CONFIG_SECURITY_APPARMOR=y
        CONFIG_SECURITY_PATH=y
        CONFIG_IKCONFIG=y
        CONFIG_IKCONFIG_PROC=y
        CONFIG_FANOTIFY=y
        CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_OWNER=y
        CONFIG_NETFILTER_ADVANCED=y
        CONFIG_NETFILTER_XTABLES=y
        CONFIG_NETFILTER_XT_TARGET_CT=y
        CONFIG_NETFILTER_XT_MATCH_COMMENT=y
        CONFIG_NETFILTER_XT_MATCH_LIMIT=y
        CONFIG_NETFILTER_XT_MATCH_MARK=y
        CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
        CONFIG_NETFILTER_XT_MATCH_STATE=y
        CONFIG_NETFILTER_XT_MATCH_TCPMSS=y
        CONFIG_IP_NF_IPTABLES=y
        CONFIG_IP_NF_NAT=y
        CONFIG_NF_CONNTRACK=y
        CONFIG_NF_CONNTRACK_MARK=y
        CONFIG_NF_CONNTRACK_IPV4=y
        CONFIG_NF_CONNTRACK_PROC_COMPAT=y
        CONFIG_IPVLAN=y
        CONFIG_MACVLAN=y
        CONFIG_NET_CLS_CGROUP=y
        CONFIG_CGROUP_NET_PRIO=y
        CONFIG_NETFILTER_XT_MATCH_CGROUP=y
        CONFIG_NET_SCH_INGRESS=y
        CONFIG_CFG80211_WEXT=y
        #
        # KernelSU 支持
        #
        CONFIG_KSU=y
        CONFIG_KSU_DEBUG=n
        EOF
        # 合并配置
        ARCH=arm64 scripts/kconfig/merge_config.sh -O $OUT_DIR -m $OUT_DIR/.config $OUT_DIR/.config-fragment
        # 确保配置同步
        make O=$OUT_DIR olddefconfig
        echo "内核配置完成，检查关键配置:"
        grep -E "CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_NS|CONFIG_CGROUP|CONFIG_VETH|CONFIG_BRIDGE" $OUT_DIR/.config | head -40

    - name: Apply GCC 4.9 compatibility patches
      run: |
        source $HOME/build_config.env
        echo "=== 应用GCC编译兼容补丁 ==="
        cd $KERNEL_DIR
        # 1. 修复scripts/dtc yylloc/yylval多重定义
        echo "修复dtc-lexer yylloc多重定义..."
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
        # 2. 全局替换-Werror为-Wno-error，防止警告终止编译
        echo "全局移除-Werror..."
        find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} \;
        # 3. 关闭-Werror-implicit-function-declaration
        find . -name "Makefile" -exec sed -i 's/-Werror-implicit-function-declaration/-Wno-error-implicit-function-declaration/g' {} \;
        # 4. 添加全局编译选项
        echo "添加全局HOSTCFLAGS/KBUILD_CFLAGS..."
        echo 'KBUILD_CFLAGS += -w -fcommon' >> Makefile
        echo 'HOSTCFLAGS += -w -fcommon' >> Makefile
        echo 'HOSTLDFLAGS += -fcommon' >> Makefile
        echo "兼容补丁应用完成"

    - name: Build kernel
      id: build-kernel
      run: |
        source $HOME/build_config.env
        echo "=== 开始编译内核（纯GCC 4.9） ==="
        cd $KERNEL_DIR
        # 工具链环境变量
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$TOOLCHAIN_DIR/gcc-arm64/bin:$TOOLCHAIN_DIR/gcc-arm/bin:$PATH"
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        # 开始编译
        make -j$(nproc) O=$OUT_DIR 2>&1 | tee build.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ 编译失败！错误摘要如下："
          echo "BUILD ERROR SUMMARY (last 120 error lines)"
          echo "========================================================"
          # 宽泛匹配所有可能的错误
          grep -n -E "(error:|Error [0-9]+|undefined reference|multiple definition|fatal error|cannot find|No such file|: \*\*\*)" build.log | tail -120
          echo "========================================================"
          # 如果上面没抓到，就显示最后200行
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "没有grep到明确错误，显示最后200行日志："
            tail -n 200 build.log
          fi
          echo ""
          echo "以下是可能的修复提示："
          echo "  - 若报 yylloc/yylval 多重定义：已添加extern补丁"
          echo "  - 若报 某个头文件找不到：检查defconfig合并"
          echo "  - 若报 某个函数未定义引用：检查KernelSU补丁是否完整"
          exit $EXIT_CODE
        fi
        echo "✅ 内核编译成功！"

    - name: Check kernel output files
      id: check-output
      run: |
        source $HOME/build_config.env
        echo "=== 检查编译输出文件 ==="
        # 检查Image.gz-dtb
        if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "找到Image.gz-dtb: $(ls -lh $OUT_DIR/arch/arm64/boot/Image.gz-dtb)"
          echo "IMAGE_PATH=$OUT_DIR/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then
          echo "找到Image.gz: $(ls -lh $OUT_DIR/arch/arm64/boot/Image.gz)"
          echo "IMAGE_PATH=$OUT_DIR/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
        else
          echo "❌ 未找到内核镜像文件！"
          ls -lh $OUT_DIR/arch/arm64/boot/
          exit 1
        fi
        # 检查dtb
        if [ -d "$OUT_DIR/arch/arm64/boot/dts" ]; then
          echo "找到DTB目录，数量: $(find $OUT_DIR/arch/arm64/boot/dts -name "*.dtb" | wc -l)"
        fi

    - name: Clone AnyKernel3
      run: |
        source $HOME/build_config.env
        echo "=== 下载AnyKernel3打包工具 ==="
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $ANYKERNEL3_DIR
        # 配置AnyKernel3为小米6非A/B设备
        cd $ANYKERNEL3_DIR
        # 设置设备名
        sed -i 's/device.name1=.*/device.name1=sagit/' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=MI6/' anykernel.sh
        sed -i 's/device.name3=.*/device.name3=MCE16/' anykernel.sh
        sed -i 's/device.name4=.*/device.name4=MCT1/' anykernel.sh
        # 非A/B分区
        sed -i 's/is_slot_device=.*/is_slot_device=0/' anykernel.sh
        sed -i 's/block=\/dev\/block\/.*/block=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
        # 移除不需要的文件
        rm -rf zImage dtbo.img
        echo "AnyKernel3配置完成"

    - name: Package flashable zip
      run: |
        source $HOME/build_config.env
        echo "=== 打包可刷入zip ==="
        cd $ANYKERNEL3_DIR
        cp $IMAGE_PATH ./zImage
        # 如果有dtb就复制
        if [ -f "$OUT_DIR/arch/arm64/boot/dt.img" ]; then
          cp $OUT_DIR/arch/arm64/boot/dt.img ./dtb
        fi
        zip -r9 "$ZIP_NAME" * -x .git "*.zip" README.md
        echo "打包完成: $ZIP_NAME"
        echo "ZIP_PATH=$ANYKERNEL3_DIR/$ZIP_NAME" >> $GITHUB_ENV

    - name: Upload kernel package
      uses: actions/upload-artifact@v4
      with:
        name: mi6-kernel-lxc-docker-ksu-v5
        path: ${{ env.ZIP_PATH }}

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-log-v5
        path: ${{ env.KERNEL_DIR }}/build.log
