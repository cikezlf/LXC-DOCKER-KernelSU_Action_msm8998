name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      - name: 加载全局配置
        run: |
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done < config.env
          echo "[ok] config loaded"

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev wget device-tree-compiler ca-certificates python2 python3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
          sudo ln -sf python2 /usr/bin/python
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[ok] deps installed"

      - name: 缓存Clang工具链
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-r450784d-v3

      - name: 缓存内核源码
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-v3-${{ env.KERNEL_SOURCE_BRANCH }}

      - name: 拉取Clang14
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[ok] clang ready"

      - name: 拉取内核源码
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[ok] kernel source ready"

      - name: 生成基础defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}

      - name: 添加Docker/LXC配置
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          CFG=out/.config
          for opt in \
            CONFIG_SYSVIPC=y CONFIG_POSIX_MQUEUE=y CONFIG_NAMESPACES=y CONFIG_PID_NS=y \
            CONFIG_UTS_NS=y CONFIG_IPC_NS=y CONFIG_USER_NS=y CONFIG_NET_NS=y \
            CONFIG_DEVPTS_MULTIPLE_INSTANCES=y CONFIG_SECCOMP=y CONFIG_SECCOMP_FILTER=y \
            CONFIG_CGROUPS=y CONFIG_CGROUP_CPUACCT=y CONFIG_CGROUP_DEVICE=y \
            CONFIG_CGROUP_FREEZER=y CONFIG_CGROUP_SCHED=y CONFIG_CPUSETS=y \
            CONFIG_MEMCG=y CONFIG_MEMCG_SWAP=y CONFIG_BLK_CGROUP=y CONFIG_CGROUP_PERF=y \
            CONFIG_CFS_BANDWIDTH=y CONFIG_FAIR_GROUP_SCHED=y CONFIG_CGROUP_NET_PRIO=y \
            CONFIG_NET_CLS_CGROUP=y CONFIG_BLK_DEV_THROTTLING=y \
            CONFIG_DEVTMPFS=y CONFIG_DEVTMPFS_MOUNT=y CONFIG_FW_LOADER=y \
            CONFIG_OVERLAY_FS=y CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y \
            CONFIG_EXT4_FS=y CONFIG_EXT4_FS_POSIX_ACL=y CONFIG_EXT4_FS_SECURITY=y \
            CONFIG_BTRFS_FS=y CONFIG_SQUASHFS=y CONFIG_SQUASHFS_XATTR=y CONFIG_FHANDLE=y \
            CONFIG_VETH=y CONFIG_BRIDGE=y CONFIG_BRIDGE_NETFILTER=y CONFIG_MACVLAN=y \
            CONFIG_VLAN_8021Q=y CONFIG_NETFILTER=y CONFIG_NETFILTER_ADVANCED=y \
            CONFIG_NF_CONNTRACK=y CONFIG_NF_NAT=y CONFIG_NF_NAT_REDIRECT=y \
            CONFIG_IP_NF_FILTER=y CONFIG_IP_NF_IPTABLES=y CONFIG_IP_NF_TARGET_MASQUERADE=y \
            CONFIG_IP_NF_NAT=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y \
            CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y CONFIG_NETFILTER_XT_MARK=y \
            CONFIG_NETFILTER_XT_TARGET_TCPMSS=y CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y \
            CONFIG_IP_VS=y CONFIG_IP_VS_NFCT=y CONFIG_IP_VS_PROTO_TCP=y \
            CONFIG_IP_VS_PROTO_UDP=y CONFIG_IP_VS_RR=y CONFIG_IPV6=y \
            CONFIG_IP6_NF_FILTER=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y \
            CONFIG_BPF=y CONFIG_BPF_SYSCALL=y CONFIG_BPF_JIT=y CONFIG_MODULES=y \
          ; do
            key="${opt%%=*}"
            val="${opt#*=}"
            if [ "$val" = "y" ]; then
              sed -i "s|^# ${key} is not set|${opt}|" "$CFG"
              if ! grep -q "^${key}=" "$CFG"; then echo "$opt" >> "$CFG"; fi
            fi
          done
          # 禁用模块签名（避免OpenSSL 3.0编译sign-file错误）
          sed -i 's|^CONFIG_MODULE_SIG=.*|# CONFIG_MODULE_SIG is not set|' "$CFG"
          sed -i 's|^CONFIG_MODULE_SIG_FORCE=.*|# CONFIG_MODULE_SIG_FORCE is not set|' "$CFG"
          sed -i 's|^CONFIG_MODULE_SIG_ALL=.*|# CONFIG_MODULE_SIG_ALL is not set|' "$CFG"
          # 栈保护降级
          sed -i 's|^CONFIG_CC_STACKPROTECTOR_STRONG=y|# CONFIG_CC_STACKPROTECTOR_STRONG is not set|' "$CFG"
          echo "CONFIG_CC_STACKPROTECTOR_REGULAR=y" >> "$CFG"
          # 禁用安卓偏执网络
          sed -i 's|^CONFIG_ANDROID_PARANOID_NETWORK=y|# CONFIG_ANDROID_PARANOID_NETWORK is not set|' "$CFG"
          echo "[ok] docker/lxc configs added"

      - name: 集成KernelSU
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "^CONFIG_KSU=y" out/.config || echo "CONFIG_KSU=y" >> out/.config
          # 给KSU驱动加-w，一劳永逸关闭所有警告
          echo 'ccflags-y += -w -Wno-error' >> drivers/kernelsu/Makefile
          echo "[ok] KernelSU integrated"

      - name: olddefconfig同步配置
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 olddefconfig

      - name: 应用Clang兼容性补丁
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          # 1. writeback.h补cgroup头
          grep -q '#include <linux/cgroup.h>' include/trace/events/writeback.h || \
            sed -i '\|^#undef TRACE_INCLUDE_PATH|a #include <linux/cgroup.h>' include/trace/events/writeback.h

          # 2. spinlock.h立即数约束修复（I代替r）
          sed -i 's/"r" (1 << TICKET_SHIFT)/"I" (1 << TICKET_SHIFT)/g' arch/arm64/include/asm/spinlock.h

          # 3. stack_pointer.h全局寄存器变量替换为内联函数（纯sed，不用python）
          # 直接在头文件里将register变量替换成内联函数
          sed -i 's|register unsigned long current_stack_pointer asm ("sp");|static inline unsigned long current_stack_pointer(void) { unsigned long sp; asm volatile("mov %0, sp" : "=r"(sp)); return sp; }|' arch/arm64/include/asm/stack_pointer.h
          # 修复调用点：变量名作为右值被使用时需要加()
          for f in arch/arm64/include/asm/perf_event.h arch/arm64/kernel/stacktrace.c arch/arm64/kernel/traps.c arch/arm64/kernel/return_address.c; do
            [ -f "$f" ] && sed -i 's/current_stack_pointer\s*;/current_stack_pointer();/g; s/= current_stack_pointer;/= current_stack_pointer();/g' "$f"
          done

          # 4. AppArmor domain.c冗余括号
          sed -i 's/} else if ((ns == profile->ns)) {/} else if (ns == profile->ns) {/' security/apparmor/domain.c

          # 5. 给易出警告的目录加 -w 彻底关闭警告（比改源码安全一万倍）
          echo 'ccflags-y += -w -Wno-error' >> security/apparmor/Makefile
          echo 'ccflags-y += -w -Wno-error' >> drivers/media/platform/msm/camera_v2/sensor/Makefile
          echo 'ccflags-y += -w -Wno-error' >> drivers/firmware/qcom/Makefile
          echo 'ccflags-y += -w -Wno-error' >> drivers/gpu/drm/msm/Makefile 2>/dev/null || true
          echo 'ccflags-y += -w -Wno-error' >> net/wireless/Makefile 2>/dev/null || true

          echo "[ok] clang compat patches applied"

      - name: 全局编译选项补丁（关键！修复所有已知编译错误）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          # 1. 修复KernelSU添加的非法无等号-Wno-error选项（GCC/Clang都需要等号）
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -print0 | xargs -0 sed -i \
            -e 's/-Wno-error-implicit-function-declaration\b/-Wno-error=implicit-function-declaration/g' \
            -e 's/-Wno-error-int-conversion\b/-Wno-error=int-conversion/g' \
            -e 's/-Wno-error-parentheses-equality\b/-Wno-error=parentheses-equality/g' \
            -e 's/-Wno-error-macro-redefined\b/-Wno-error=macro-redefined/g' \
            -e 's/-Wno-error-shift-negative-value\b/-Wno-error=shift-negative-value/g' \
            -e 's/-Wno-error-address-of-packed-member\b/-Wno-error=address-of-packed-member/g' \
            -e 's/-Wno-error-gnu-variable-sized-type-not-at-end\b/-Wno-error=gnu-variable-sized-type-not-at-end/g' \
            -e 's/-Wno-error-initializer-overrides\b/-Wno-error=initializer-overrides/g' \
            -e 's/-Wno-error-tautological-compare\b/-Wno-error=tautological-compare/g' \
            -e 's/-Wno-error-sign-compare\b/-Wno-error=sign-compare/g' \
            -e 's/-Wno-error-unused-const-variable\b/-Wno-error=unused-const-variable/g' \
            -e 's/-Wno-error-unused-function\b/-Wno-error=unused-function/g' \
            -e 's/-Wno-error-format\b/-Wno-error=format/g'

          # 2. dtc-lexer yylloc多重定义修复
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && \
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
          [ -f scripts/dtc/dtc-lexer.lex.c ] && \
            sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c

          # 3. 顶层Makefile：全局加 -w 关闭所有警告，HOSTCFLAGS加 -fcommon 和 OpenSSL 3.0兼容
          # 清空旧的KBUILD_CFLAGS追加（避免重复）
          sed -i '/KBUILD_CFLAGS += -w/d' Makefile
          sed -i '/KBUILD_CFLAGS += -Wno-error/d' Makefile
          sed -i '/HOSTCFLAGS += -w/d' Makefile
          sed -i '/HOSTCFLAGS += -fcommon/d' Makefile
          sed -i '/HOSTCFLAGS += -Wno-error/d' Makefile
          sed -i '/HOSTCFLAGS += -Wno-deprecated-declarations/d' Makefile
          # 在 -Wall 之后追加 -w（关闭所有警告，最暴力最有效）
          sed -i '/^KBUILD_CFLAGS   += -Wall$/a KBUILD_CFLAGS   += -w -Wno-error' Makefile
          # 在 HOSTCFLAGS 定义行追加主机工具选项（修复sign-file.c OpenSSL 3.0废弃警告）
          sed -i '/^HOSTCFLAGS       =/a HOSTCFLAGS      += -w -Wno-error -fcommon -Wno-deprecated-declarations -Wno-error=deprecated-declarations' Makefile

          # 4. 再次同步配置
          make O=out ARCH=arm64 olddefconfig
          echo "[ok] global build flags patched"

      - name: 全量编译内核
        id: build
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
          echo "=== CC version ==="
          clang --version | head -1
          echo "=== Starting build ==="
          set +e
          make O=out \
            ARCH=arm64 SUBARCH=arm64 \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM_IAS=0 \
            -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          echo "=== Build exit code: $RC ==="
          if [ $RC -ne 0 ]; then
            echo "=== Error summary ==="
            grep -in -E "error:|fatal error|undefined reference|multiple definition|Stop\." build.log | head -60
            echo "=== Last 150 lines ==="
            tail -150 build.log
            exit 1
          fi
          echo "[ok] kernel build success"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: ignore

      - name: 打包AnyKernel3
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!/dev/block/platform/omap/omap_hsmmc\.0!/dev/block/bootdevice!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh
          for img in Image.gz-dtb Image.gz Image; do
            [ -f android-kernel/out/arch/arm64/boot/$img ] && cp android-kernel/out/arch/arm64/boot/$img AnyKernel3/ && break
          done
          rm -rf AnyKernel3/.git* AnyKernel3/README.md AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/path
          echo "[ok] anykernel3 ready"

      - name: 上传刷机包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/*
