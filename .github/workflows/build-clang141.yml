name: Build Kernel

on:
  push:
    paths:
      - "config.env"
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug mode (set -x)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =================== 步骤0：加载环境变量 ===================
      - name: Load configuration
        id: config
        run: |
          set -e
          source ${{ github.workspace }}/config.env
          for var in KERNEL_SOURCE KERNEL_BRANCH DEVICE_DEFCONFIG LLVM_CONFIG ENABLE_KERNELSU KSU_VERSION; do
            if [ -z "${!var}" ]; then
              echo "❌ 缺失必要配置项: $var"
              exit 1
            fi
          done
          echo "KERNEL_SOURCE=$KERNEL_SOURCE" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=$KERNEL_BRANCH" >> $GITHUB_ENV
          echo "DEVICE_DEFCONFIG=$DEVICE_DEFCONFIG" >> $GITHUB_ENV
          echo "LLVM_CONFIG=$LLVM_CONFIG" >> $GITHUB_ENV
          echo "ENABLE_KERNELSU=$ENABLE_KERNELSU" >> $GITHUB_ENV
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          echo "TZ='Asia/Shanghai'" >> $GITHUB_ENV
          echo "✅ 配置加载完成"

      # =================== 步骤1：安装依赖 ===================
      - name: Install dependencies
        run: |
          set -e
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev unzip wget \
            cpio device-tree-compiler libfdt-dev python2 python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libc6-dev libssl3 openssl
          sudo rm -f /usr/bin/python
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          echo "[✓] Python 已切换为 Python 2"

      # =================== 步骤2：缓存工具链 ===================
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/clang
          key: clang-proton-v10-20260929

      # =================== 步骤3：下载Clang ===================
      - name: Download Clang
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/toolchains
          cd ${{ github.workspace }}/toolchains
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O proton-clang.zip
          unzip -q proton-clang.zip
          mv proton-clang-master clang
          rm proton-clang.zip
          echo "[✓] Clang 工具链下载完成"
          clang/bin/clang --version | head -2

      # =================== 步骤4：缓存内核源码 ===================
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/Xiaomi_Kernel_OpenSource
          key: kernel-${{ env.KERNEL_BRANCH }}-v10-20260929-${{ github.run_id }}
          restore-keys: |
            kernel-${{ env.KERNEL_BRANCH }}-v10-20260929-

      # =================== 步骤5：克隆内核源码 ===================
      - name: Clone kernel source
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/kernel_workspace
          cd ${{ github.workspace }}/kernel_workspace
          if [ ! -d Xiaomi_Kernel_OpenSource ]; then
            git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }}
          fi
          echo "[✓] 内核源码克隆完成"

      # =================== 步骤6：准备内核工作目录 ===================
      - name: Prepare kernel workspace
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/kernel_workspace/android-kernel
          if [ ! -f ${{ github.workspace }}/kernel_workspace/android-kernel/Makefile ]; then
            cp -r ${{ github.workspace }}/kernel_workspace/Xiaomi_Kernel_OpenSource/* ${{ github.workspace }}/kernel_workspace/android-kernel/
            cp -r ${{ github.workspace }}/kernel_workspace/Xiaomi_Kernel_OpenSource/.* ${{ github.workspace }}/kernel_workspace/android-kernel/ 2>/dev/null || true
          fi
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          echo "[✓] 内核工作目录准备完成"

      # =================== 步骤7：生成Docker/LXC/KVM配置 ===================
      - name: Generate kernel features config
        run: |
          set -e
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== 生成 Docker/LXC/KVM 额外配置 ==="
          CONFIGS=(
            "CONFIG_NAMESPACES=y"
            "CONFIG_NET_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_CGROUP_CPUACCT=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_SCHED=y"
            "CONFIG_CPUSETS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_KEYS=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_BRIDGE_NETFILTER=y"
            "CONFIG_IP_NF_FILTER=y"
            "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
            "CONFIG_NETFILTER_XT_MARK=y"
            "CONFIG_IP_NF_NAT=y"
            "CONFIG_NF_NAT=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_NF_NAT_IPV4=y"
            "CONFIG_USER_NS=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_CGROUP_PIDS=y"
            "CONFIG_MEMCG_SWAP=y"
            "CONFIG_BLK_CGROUP=y"
            "CONFIG_CGROUP_PERF=y"
            "CONFIG_NET_CLS_CGROUP=y"
            "CONFIG_CGROUP_NET_PRIO=y"
            "CONFIG_CFS_BANDWIDTH=y"
            "CONFIG_IP_VS=y"
            "CONFIG_IP_VS_NFCT=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_STRICT_DEVMEM=n"
            "CONFIG_DEVMEM=y"
            "CONFIG_SYN_COOKIES=y"
            "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=y"
            "CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y"
            "CONFIG_NETFILTER_XT_MATCH_OWNER=y"
            "CONFIG_NETFILTER_XT_MATCH_STATE=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_KPROBES=y"
            "CONFIG_KPROBE_EVENTS=y"
            "CONFIG_MODULES=y"
            "CONFIG_MODULE_UNLOAD=y"
            "CONFIG_KVM=y"
            "CONFIG_KVM_ARM_HOST=y"
            "CONFIG_VHOST_NET=y"
            "CONFIG_ASHMEM=y"
            "CONFIG_ANDROID=y"
            "CONFIG_ANDROID_BINDER_IPC=y"
            "CONFIG_ANDROID_BINDERFS=y"
            "CONFIG_ANDROID_BINDER_DEVICES=\"binder,hwbinder,vndbinder\""
            "CONFIG_KSU=y"
          )
          > kernel_features.txt
          for cfg in "${CONFIGS[@]}"; do
            echo "$cfg" >> kernel_features.txt
          done
          echo "[✓] 配置片段生成完成，共$(grep -c '^CONFIG' kernel_features.txt)项"

      # =================== 步骤8：合并defconfig ===================
      - name: Merge defconfig
        run: |
          set -e
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          export ARCH=arm64 SUBARCH=arm64
          CLANG_PATH=${{ github.workspace }}/toolchains/clang/bin
          export PATH=$CLANG_PATH:$PATH
          make O=out ARCH=arm64 ${{ env.DEVICE_DEFCONFIG }}
          cat kernel_features.txt >> out/.config
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> out/.config
          echo "CONFIG_CC_STACKPROTECTOR_REGULAR=y" >> out/.config
          echo "# CONFIG_MODULE_SIG is not set" >> out/.config
          echo "CONFIG_MODULE_SIG=n" >> out/.config
          echo "# CONFIG_DRM_TILCDC is not set" >> out/.config
          make O=out ARCH=arm64 olddefconfig
          echo "[✓] defconfig合并完成"

      # =================== 步骤9：集成KernelSU ===================
      - name: Integrate KernelSU
        if: ${{ env.ENABLE_KERNELSU == 'true' }}
        run: |
          set -e
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== 集成 KernelSU ${{ env.KSU_VERSION }} ==="
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${{ env.KSU_VERSION }}/kernel/setup.sh" | bash -s ${{ env.KSU_VERSION }}
          echo "[✓] KernelSU 集成完成"

      # =================== 步骤10：编译补丁 ===================
      - name: Apply compatibility patches
        run: |
          set -e
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          echo "=== 应用编译补丁 ==="
          # 修复dtc yylloc
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.lex.c; do
            if [ -f "$f" ]; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;\nYYLTYPE yylloc;/g' "$f" 2>/dev/null || true
            fi
          done
          echo "HOSTCFLAGS += -fcommon -w -Wno-deprecated-declarations" >> scripts/dtc/Makefile
          # 全局-Werror替换为-w
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/ -Werror\b/ -w/g' {} \;
          # 修复KSU非法编译选项
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i \
            -e 's/-Wno-error-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' \
            -e 's/-w-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' \
            -e 's/-Wno-error-int-conversion/-Wno-error=int-conversion/g' \
            {} \;
          # 顶层Makefile强制GNU ld，绝对不用ld.lld（LLVM=1的bug根源）
          sed -i '1i LD = aarch64-linux-gnu-ld' Makefile
          sed -i '2i CROSS_COMPILE = aarch64-linux-gnu-' Makefile
          # 问题目录加-w
          for dir in drivers/staging drivers/media drivers/gpu drivers/firmware/qcom security/apparmor drivers/kernelsu; do
            if [ -f "$dir/Makefile" ]; then
              echo "ccflags-y += -w" >> "$dir/Makefile"
            fi
          done
          # 六层Werror豁免
          for opt in "-Wno-implicit-function-declaration" "-Wno-error=implicit-function-declaration" "-Wno-parentheses-equality" "-Wno-error=parentheses-equality" "-Wno-int-conversion" "-Wno-error=int-conversion"; do
            echo "KBUILD_CFLAGS += $opt" >> Makefile
          done
          echo "KBUILD_HOSTCFLAGS += -fcommon -w -Wno-deprecated-declarations" >> Makefile
          echo "[✓] 所有补丁应用完成"

      # =================== 步骤11：编译内核（关键：绝对不加LLVM=1！！！） ===================
      - name: Compile kernel
        id: build
        run: |
          set +e
          cd ${{ github.workspace }}/kernel_workspace/android-kernel
          CLANG_PATH=${{ github.workspace }}/toolchains/clang/bin
          export PATH=$CLANG_PATH:/usr/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTCFLAGS="-fcommon -w -Wno-deprecated-declarations"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== 编译器信息 ==="
          clang --version | head -2
          echo "LD: $($LD --version | head -1)"
          echo "==================="
          echo "=== 开始编译 ==="
          # 绝对不要加LLVM=1！！！它会强制覆盖LD为ld.lld
          make O=out -j$(nproc) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "编译退出码: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== 错误摘要 ==="
            grep -inE "(error:|undefined reference|multiple definition|fatal error|Error [0-9]+)" build.log | head -40
            echo "=== 最后150行 ==="
            tail -n 150 build.log
            exit $BUILD_EXIT
          fi
          echo "✅ 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null

      # =================== 步骤12：AnyKernel3打包 ===================
      - name: Package with AnyKernel3
        if: steps.build.outcome == 'success'
        run: |
          set -e
          cd ${{ github.workspace }}/kernel_workspace
          if [ ! -d AnyKernel3 ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b sagit AnyKernel3
          fi
          cd AnyKernel3
          rm -rf zImage Image.gz* dtb* dtbo*
          KERNEL_DIR=${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot
          if [ -f "$KERNEL_DIR/Image.gz-dtb" ]; then
            cp $KERNEL_DIR/Image.gz-dtb .
          elif [ -f "$KERNEL_DIR/Image.gz" ]; then
            cp $KERNEL_DIR/Image.gz .
          fi
          # 用数组写入anykernel.sh，避免heredoc缩进问题
          AK3_LINES=(
            "# AnyKernel3 script for Mi6 sagit"
            "kernel.string=Custom Kernel for Xiaomi Mi6 (Docker/LXC/KernelSU)"
            "do.devicecheck=1"
            "do.modules=0"
            "do.systemless=1"
            "do.cleanup=1"
            "device.name1=sagit"
            "device.name2=MCE16"
            "device.name3=MI6"
            "block=/dev/block/bootdevice/by-name/boot;"
            "is_slot_device=0;"
            "ramdisk_compression=auto;"
            ". tools/ak3-core.sh;"
            "dump_boot;"
            "write_boot;"
          )
          > anykernel.sh
          for line in "${AK3_LINES[@]}"; do
            echo "$line" >> anykernel.sh
          done
          ZIP_NAME=Kernel-KSU-Docker-LXC-sagit-$(date +%Y%m%d-%H%M%S).zip
          zip -r9 $ZIP_NAME * -x .git README.md *placeholder
          mkdir -p ${{ github.workspace }}/output
          cp $ZIP_NAME ${{ github.workspace }}/output/
          echo "[✓] 刷机包生成完成: $ZIP_NAME"

      # =================== 步骤13：上传产物 ===================
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output-v10
          path: |
            ${{ github.workspace }}/output/*.zip
            ${{ github.workspace }}/kernel_workspace/android-kernel/build.log
            ${{ github.workspace }}/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz*
          retention-days: 30
