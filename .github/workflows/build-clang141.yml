name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-22.04
    #runs-on: [self-hosted, Linux, X64]
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      # ==================== 第一步：全局环境初始化 ====================
      - name: 【第一步】加载全局配置
        id: step1
        run: |
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
              echo "[✓] 已加载：$line"
            fi
          done < config.env
          echo "[✓] 全局配置加载完成"

      - name: 【校验·第一步】环境变量完整性
        run: |
          FAIL=0
          for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
            if [ -z "${!var}" ]; then
              echo "[✗] 缺失：${var}"
              FAIL=1
            else
              echo "[✓] ${var} = ${!var}"
            fi
          done
          if [ ! -f config.env ]; then
            echo "[✗] config.env 不存在"
            FAIL=1
          else
            echo "[✓] config.env 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第一步校验通过"

      # ==================== 第二步：安装编译依赖 ====================
      - name: 【第二步】安装编译依赖
        id: step2
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[✓] 编译依赖安装完成"

      - name: 【校验·第二步】依赖完整性
        run: |
          FAIL=0
          DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3")
          for dep in "${DEPS[@]}"; do
            if command -v "$dep" &> /dev/null; then
              echo "[✓] ${dep}"
            else
              echo "[✗] ${dep} 未安装"
              FAIL=1
            fi
          done
          if [ ! -d "$GITHUB_WORKSPACE/kernel_workspace" ]; then
            echo "[✗] kernel_workspace 目录未创建"
            FAIL=1
          else
            echo "[✓] kernel_workspace 已创建"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第二步校验通过"

      # ==================== 第三步：资源缓存 ====================
      - name: 【第三步】Clang 工具链缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d-v4

      - name: 【第三步】内核源码缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-${{ env.KERNEL_SOURCE_BRANCH }}-v4

      - name: 【校验·第三步】缓存路径可写
        run: |
          FAIL=0
          for dir in "kernel_workspace/clang-aosp" "kernel_workspace/android-kernel"; do
            mkdir -p $GITHUB_WORKSPACE/${dir}
            if [ -w $GITHUB_WORKSPACE/${dir} ]; then
              echo "[✓] ${dir} 可写"
            else
              echo "[✗] ${dir} 不可写"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第三步校验通过"

      # ==================== 第四步：拉取 Clang14 ====================
      - name: 【第四步】拉取 AOSP Clang14
        id: step4
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[✓] Clang14 工具链就绪"

      - name: 【校验·第四步】Clang 可执行文件
        run: |
          FAIL=0
          CLANG_BIN=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin
          for f in clang clang++ lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x ${CLANG_BIN}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第四步校验失败，终止"
            exit 1
          fi
          echo "✅ 第四步校验通过"



      # ==================== 第五步：拉取内核源码 ====================
      - name: 【第五步】拉取内核源码
        id: step5
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[✓] 内核源码就绪"

      - name: 【校验·第五步】源码完整性
        run: |
          FAIL=0
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel
          for f in "Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build"; do
            if [ -e ${KERNEL_DIR}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ ! -d ${KERNEL_DIR}/.git ]; then
            echo "[✗] .git 缺失"
            FAIL=1
          else
            echo "[✓] .git 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第五步校验通过"


      - name: 【第五步补充】还原源码到原始状态（清除缓存携带的旧补丁）
        id: step5b-restore
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          git checkout -- .
          DIRTY=$(git status --porcelain -uno)
          if [ -n "$DIRTY" ]; then
            echo "❌ 源码仍有未还原的已跟踪文件改动："
            echo "$DIRTY"
            exit 1
          fi
          echo "[✓] 全部已跟踪文件已还原为原始状态"
          echo "✅ 第五步补充校验通过"


      # ==================== 第六步：生成基础配置 ====================
      - name: 【第六步】生成基础内核配置
        id: step6
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 基础配置生成完成"

      - name: 【校验·第六步】.config 文件
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if [ ! -f "$CONFIG_FILE" ] || [ ! -s "$CONFIG_FILE" ]; then
            echo "[✗] .config 不存在或为空"
            FAIL=1
          else
            echo "[✓] .config 存在，$(wc -l < "$CONFIG_FILE") 行"
            grep -q ^CONFIG_ARM64=y "$CONFIG_FILE" && echo "[✓] CONFIG_ARM64=y"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第六步校验失败，终止"
            exit 1
          fi
          echo "✅ 第六步校验通过"




      # ==================== 第七步：Docker/LXC 全量配置 ====================
      - name: 【第七步】写入 Docker/LXC 全量配置 + Netfilter全量iptables支持 + 全量校验
        if: ${{ env.ENABLE_LXC_DOCKER == 'true' }}
        run: |
          DEFCONFIG="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config"
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
              sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
            else
              echo "$config" >> "$DEFCONFIG"
            fi
          }

          echo "===== 一、 基础核心内核配置选项‌ ====="
          echo "===== 1. IPC机制基础‌ ====="
          add_config "CONFIG_SYSCTL=y"
          add_config "CONFIG_SYSVIPC=y"
          add_config "CONFIG_POSIX_MQUEUE=y"

          echo "===== 2. 核心命名空间支持‌ ====="
          add_config "CONFIG_NAMESPACES=y"
          add_config "CONFIG_PID_NS=y"
          add_config "CONFIG_UTS_NS=y"
          add_config "CONFIG_IPC_NS=y"
          add_config "CONFIG_NET_NS=y"
          add_config "CONFIG_USER_NS=y"

          echo "===== 3. Seccomp安全隔离支持‌ ====="
          add_config "CONFIG_SECCOMP=y"
          add_config "CONFIG_SECCOMP_FILTER=y"


          echo "===== 4. 设备与文件系统基础支持‌ ====="
          add_config "CONFIG_DEVTMPFS=y"
          add_config "CONFIG_OVERLAY_FS=y"
          add_config "CONFIG_TMPFS_POSIX_ACL=y"
          add_config "CONFIG_TMPFS_XATTR=y"
 

          echo "===== 5. 固件加载支持‌ ====="
          add_config "CONFIG_FW_LOADER=y"
          add_config "CONFIG_FW_LOADER_USER_HELPER=y"
          add_config "CONFIG_FW_LOADER_COMPRESS=y"


          echo "===== 二、控制组（Cgroups）====="
          echo "===== 1.控制组（Cgroups）相关配置选项 ====="
          add_config "CONFIG_CGROUPS=y"
          add_config "CONFIG_CGROUP_DEVICE=y"
          add_config "CONFIG_CGROUP_PIDS=y"
          add_config "CONFIG_MEMCG=y"
          add_config "CONFIG_CGROUP_SCHED=y"
          add_config "CONFIG_FAIR_GROUP_SCHED=y"
          add_config "CONFIG_CGROUP_FREEZER=y"
          add_config "CONFIG_CGROUP_NET_PRIO=y"

          echo "===== 2.控制组（Cgroups）Docker场景额外要求的Cgroup扩展子功能 ====="
          add_config "CONFIG_CGROUP_CPUACCT=y"
          add_config "CONFIG_CPUSETS=y"
          add_config "CONFIG_CGROUP_PERF=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"
          add_config "CONFIG_NET_CLS_CGROUP=y"
          add_config "CONFIG_CFS_BANDWIDTH=y"
          add_config "CONFIG_MEMCG_SWAP=y"
          add_config "CONFIG_MEMCG_KMEM=y"
          add_config "CONFIG_BLK_CGROUP=y"
          add_config "CONFIG_BLK_DEV_THROTTLING=y"
          add_config "CONFIG_CFQ_GROUP_IOSCHED=y"


          echo "===== 三、网络隔离与NAT模式相关配置选项 ====="
          echo "===== 1. 基础网络组件 ====="
          add_config "CONFIG_VETH=y"
          add_config "CONFIG_BRIDGE=y"
          add_config "CONFIG_IP_ADVANCED_ROUTER=y"
          add_config "CONFIG_IP_MULTIPLE_TABLES=y"

          echo "===== 2. 全量Netfilter支持  ====="
          add_config "CONFIG_NETFILTER=y"
          add_config "CONFIG_BRIDGE_NETFILTER=y"
          add_config "CONFIG_NETFILTER_ADVANCED=y"
          add_config "CONFIG_NF_CONNTRACK=y"
          add_config "CONFIG_IP_NF_IPTABLES=y"
          add_config "CONFIG_IP_NF_FILTER=y"
          add_config "CONFIG_NF_NAT=y"
          add_config "CONFIG_NF_TABLES=y"
          add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          add_config "CONFIG_NF_CONNTRACK_NETLINK=y"
          add_config "CONFIG_NF_NAT_REDIRECT=y"

          echo "===== 3. 兼容旧内核的传统网络配置  ====="
          add_config "CONFIG_NF_CONNTRACK_IPV4=y"
          add_config "CONFIG_NF_NAT_IPV4=y"
          add_config "CONFIG_IP_NF_NAT=y"
          echo "===== 4. 适配Android特殊权限，旧内核上关闭该选项才能保证容器内网络正常工作   ====="
          add_config "CONFIG_ANDROID_PARANOID_NETWORK=n"

          echo "===== 四、 UFW与Fail2Ban核心依赖配置选项  ====="
          add_config "CONFIG_NETFILTER_XT_MATCH_COMMENT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_STATE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_HL=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
          add_config "CONFIG_IP_NF_TARGET_REJECT=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_LOG=y"
          add_config "CONFIG_IP_NF_TARGET_ULOG=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_LIMIT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_OWNER=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_MARK=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MARK=y"
          add_config "CONFIG_IP_SET=y"
          add_config "CONFIG_IP_SET_HASH_IP=y"
          add_config "CONFIG_IP_SET_HASH_NET=y"
          add_config "CONFIG_NETFILTER_XT_SET=y"
          add_config "CONFIG_NETFILTER_NETLINK_QUEUE=y"
          add_config "CONFIG_NETFILTER_NETLINK_LOG=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_NFLOG=y"
          echo "[✓] Docker/LXC 全量配置写入完成"

          # ===== 全量校验 新增全部Netfilter配置校验项 =====
          echo ""
          echo "===== 开始 Docker/LXC + Netfilter全量iptables配置校验 ====="
          FAIL=0
          TOTAL=0
          PASS=0
          ALL_CHECKS=(
            "CONFIG_SYSCTL=y"
            "CONFIG_SYSVIPC=y"
            "CONFIG_NAMESPACES=y"
            "CONFIG_PID_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_SECCOMP_FILTER=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
            "CONFIG_FW_LOADER=y"
            "CONFIG_FW_LOADER_USER_HELPER=y"
            "CONFIG_FW_LOADER_COMPRESS=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_PIDS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_CGROUP_SCHED=y"
            "CONFIG_FAIR_GROUP_SCHED=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_NET_PRIO=y"
            "CONFIG_CGROUP_CPUACCT=y"
            "CONFIG_CPUSETS=y"
            "CONFIG_CGROUP_PERF=y"
            "CONFIG_CGROUP_HUGETLB=y"
            "CONFIG_NET_CLS_CGROUP=y"
            "CONFIG_CFS_BANDWIDTH=y"
            "CONFIG_MEMCG_SWAP=y"
            "CONFIG_MEMCG_KMEM=y"
            "CONFIG_BLK_CGROUP=y"
            "CONFIG_BLK_DEV_THROTTLING=y"
            "CONFIG_CFQ_GROUP_IOSCHED=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_IP_ADVANCED_ROUTER=y"
            "CONFIG_IP_MULTIPLE_TABLES=y"
            "CONFIG_NETFILTER=y"
            "CONFIG_BRIDGE_NETFILTER=y"
            "CONFIG_NETFILTER_ADVANCED=y"
            "CONFIG_NF_CONNTRACK=y"
            "CONFIG_IP_NF_IPTABLES=y"
            "CONFIG_IP_NF_FILTER=y"
            "CONFIG_NF_NAT=y"
            "CONFIG_NF_TABLES=y"
            "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
            "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            "CONFIG_NF_CONNTRACK_NETLINK=y"
            "CONFIG_NF_NAT_REDIRECT=y"
            "CONFIG_NF_CONNTRACK_IPV4=y"
            "CONFIG_NF_NAT_IPV4=y"
            "CONFIG_IP_NF_NAT=y"
            "CONFIG_ANDROID_PARANOID_NETWORK=n"
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=y"
            "CONFIG_NETFILTER_XT_MATCH_STATE=y"
            "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
            "CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y"
            "CONFIG_NETFILTER_XT_MATCH_HL=y"
            "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            "CONFIG_IP_NF_TARGET_REJECT=y"
            "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            "CONFIG_IP_NF_TARGET_ULOG=y"
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            "CONFIG_NETFILTER_XT_MATCH_LIMIT=y"
            "CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y"
            "CONFIG_NETFILTER_XT_MATCH_OWNER=y"
            "CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y"
            "CONFIG_NETFILTER_XT_MATCH_MARK=y"
            "CONFIG_NETFILTER_XT_TARGET_MARK=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_IP_SET_HASH_NET=y"
            "CONFIG_NETFILTER_XT_SET=y"
            "CONFIG_NETFILTER_NETLINK_QUEUE=y"
            "CONFIG_NETFILTER_NETLINK_LOG=y"
            "CONFIG_NETFILTER_XT_TARGET_NFLOG=y"
          )

          for check in "${ALL_CHECKS[@]}"; do
            TOTAL=$((TOTAL + 1))
            if grep -q "^${check}$" "$DEFCONFIG" 2>/dev/null; then
              PASS=$((PASS + 1))
            else
              echo "  [✗] ${check} 校验失败，未生效"
              FAIL=1
            fi
          done

          echo ""
          echo "Docker/LXC + Netfilter全量iptables配置校验结果：${PASS}/${TOTAL} 通过"
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第七步校验未通过，存在Docker/LXC/iptables必需配置缺失，终止构建"
            exit 1
          fi
          echo "✅ 第七步校验通过，全部 ${TOTAL} 项配置已锁定生效"


      # ==================== 第九步：KernelSU-Next ====================
      - name: 【第九步】部署 KernelSU-Next Legacy
        if: ${{ env.ENABLE_KERNELSU == 'true' }}
        id: step9
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
          echo "[✓] KernelSU-Next 部署完成"

      - name: 【校验·第九步】KernelSU 配置确认
        if: ${{ env.ENABLE_KERNELSU == 'true' }}
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          grep -q "^CONFIG_KSU=y$" "$CONFIG_FILE" 2>/dev/null && echo "[✓] CONFIG_KSU=y" || { echo "[✗] CONFIG_KSU=y 缺失"; FAIL=1; }
          [ -d "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/kernelsu" ] && echo "[✓] KernelSU 驱动目录存在" || { echo "[✗] 驱动目录缺失"; FAIL=1; }
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第九步校验失败，终止"
            exit 1
          fi
          echo "✅ 第九步校验通过"

      - name: 【第十步前置】修复GCC11/Clang兼容性问题
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          # 修复dtc-lexer yylloc多重定义：必须修改预生成的.c文件（改.l没用，因为.c不会重新生成）
          sed -i "s/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g" scripts/dtc/dtc-lexer.l
          sed -i "s/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g" scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i "s/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g" scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
          # 给dtc的Makefile显式追加-fcommon，确保链接时生效
          echo "" >> scripts/dtc/Makefile
          echo "HOSTCFLAGS += -fcommon -w -Wno-deprecated-declarations" >> scripts/dtc/Makefile
          # 全局替换-Werror为-w，只替换独立的-Werror，不破坏其他Werror开头的选项
          find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i "s/ -Werror\b/ -w/g" {} \;
          # 修复所有非法无等号的Wno-error选项
          find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i "s/-w-implicit-function-declaration/-Wno-error=implicit-function-declaration/g" {} \;
          find . -type f \( -name Makefile -o -name Kbuild \) -exec sed -i "s/-Wno-error-implicit-function-declaration/-Wno-error=implicit-function-declaration/g" {} \;
          # 全局顶层Makefile预加HOSTCFLAGS，修复ld.lld空目录链接兼容性问题
          echo "" >> Makefile
          echo "HOSTCFLAGS += -fcommon -w -Wno-deprecated-declarations -Wno-error=deprecated-declarations" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -fcommon -w -Wno-deprecated-declarations -Wno-error=deprecated-declarations" >> Makefile
          echo "export HOSTCFLAGS KBUILD_HOSTCFLAGS" >> Makefile
