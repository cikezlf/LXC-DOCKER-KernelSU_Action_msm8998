#!/bin/bash
set -e

# 工作目录定义
WORKSPACE=$(pwd)
KERNEL_WORKSPACE=$WORKSPACE/kernel_workspace
CLANG_DIR=$KERNEL_WORKSPACE/clang-aosp
KERNEL_DIR=$KERNEL_WORKSPACE/android-kernel
ANYKERNEL_DIR=$KERNEL_WORKSPACE/AnyKernel3

echo "=============================================="
echo "  小米6(sagit)官方开源内核编译脚本"
echo "  基于LOS20内核编译模板，每步强制校验"
echo "  开始时间：$(date '+%Y-%m-%d %H:%M:%S')"
echo "=============================================="
echo ""

# ==================== 第一步：环境变量配置 ====================
echo "【第一步】配置全局环境变量"
KERNEL_SOURCE=https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
KERNEL_SOURCE_BRANCH=sagit-o-oss
KERNEL_CONFIG=sagit_defconfig
KERNEL_ZIP_NAME=Xiaomi6_Official_Kernel_KSU_Docker_$(date +%Y%m%d-%H%M%S).zip
KERNEL_IMAGE_NAME=Image.gz-dtb
echo "[✓] KERNEL_SOURCE = $KERNEL_SOURCE"
echo "[✓] KERNEL_SOURCE_BRANCH = $KERNEL_SOURCE_BRANCH"
echo "[✓] KERNEL_CONFIG = $KERNEL_CONFIG"
echo "[✓] KERNEL_IMAGE_NAME = $KERNEL_IMAGE_NAME"
echo "[✓] KERNEL_ZIP_NAME = $KERNEL_ZIP_NAME"

echo ""
echo "【校验·第一步】环境变量完整性"
FAIL=0
for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
  if [ -z "${!var}" ]; then
    echo "[✗] 缺失：${var}"
    FAIL=1
  else
    echo "[✓] ${var} = ${!var}"
  fi
done
mkdir -p $KERNEL_WORKSPACE
if [ ! -d "$KERNEL_WORKSPACE" ]; then
  echo "[✗] kernel_workspace 目录创建失败"
  FAIL=1
else
  echo "[✓] kernel_workspace 目录已创建"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第一步校验失败，终止"
  exit 1
fi
echo "✅ 第一步校验通过"
echo ""

# ==================== 第二步：安装编译依赖 ====================
echo "【第二步】安装编译依赖"
apt-get update
apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
echo "[✓] 编译依赖安装完成"

echo ""
echo "【校验·第二步】依赖完整性"
FAIL=0
DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3")
for dep in "${DEPS[@]}"; do
  if command -v "$dep" &> /dev/null; then
    echo "[✓] ${dep}"
  else
    echo "[✗] ${dep} 未安装"
    FAIL=1
  fi
done
if [ ! -d "$KERNEL_WORKSPACE" ]; then
  echo "[✗] kernel_workspace 目录不存在"
  FAIL=1
else
  echo "[✓] kernel_workspace 已存在"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第二步校验失败，终止"
  exit 1
fi
echo "✅ 第二步校验通过"
echo ""

# ==================== 第三步：拉取Clang14工具链 ====================
echo "【第三步】拉取AOSP Clang14工具链"
cd $KERNEL_WORKSPACE
if [ ! -d clang-aosp/.git ]; then
  git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
fi
echo "[✓] Clang14工具链拉取完成"

echo ""
echo "【校验·第三步】Clang可执行文件完整性"
FAIL=0
CLANG_BIN=$CLANG_DIR/clang-r450784d/bin
for f in clang clang++ lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
  if [ -x ${CLANG_BIN}/${f} ]; then
    echo "[✓] ${f}"
  else
    echo "[✗] ${f} 缺失"
    FAIL=1
  fi
done
if [ $FAIL -eq 1 ]; then
  echo "❌ 第三步校验失败，终止"
  exit 1
fi
echo "✅ 第三步校验通过"
echo ""

# ==================== 第四步：拉取小米6官方内核源码 ====================
echo "【第四步】拉取小米6官方开源内核源码"
cd $KERNEL_WORKSPACE
if [ ! -d android-kernel/.git ]; then
  git clone "${KERNEL_SOURCE}" -b "${KERNEL_SOURCE_BRANCH}" android-kernel --depth=1
fi
echo "[✓] 小米6官方内核源码拉取完成"

echo ""
echo "【校验·第四步】源码完整性"
FAIL=0
for f in "Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build"; do
  if [ -e ${KERNEL_DIR}/${f} ]; then
    echo "[✓] ${f}"
  else
    echo "[✗] ${f} 缺失"
    FAIL=1
  fi
done
if [ ! -d ${KERNEL_DIR}/.git ]; then
  echo "[✗] .git 缺失"
  FAIL=1
else
  echo "[✓] .git 存在"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第四步校验失败，终止"
  exit 1
fi
echo "✅ 第四步校验通过"
echo ""

# ==================== 第五步：写入KernelSU安装脚本 ====================
echo "【第五步】写入KernelSU-Next安装脚本"
cd $KERNEL_DIR
cat > ksu-legacy-setup.sh << 'KSU_EOF'
#!/bin/sh
set -eu
GKI_ROOT=$(pwd)
REPO="KernelSU-Next" 
OWNER="kaho97"

initialize_variables() {
    if test -d "$GKI_ROOT/common/drivers"; then
         DRIVER_DIR="$GKI_ROOT/common/drivers"
    elif test -d "$GKI_ROOT/drivers"; then
         DRIVER_DIR="$GKI_ROOT/drivers"
    else
         echo '[ERROR] "drivers/" directory not found.'
         exit 127
    fi
    DRIVER_MAKEFILE=$DRIVER_DIR/Makefile
    DRIVER_KCONFIG=$DRIVER_DIR/Kconfig
}

setup_kernelsu() {
    echo "[+] Setting up $REPO..."
    if [ ! -d "$GKI_ROOT/$REPO" ]; then 
        git clone -b legacy "https://github.com/$OWNER/$REPO" "$GKI_ROOT/$REPO"
        echo "[+] Repository cloned." 
    fi 
    
    cd "$GKI_ROOT/$REPO"
    git stash && echo "[-] Stashed current changes."
    git pull origin legacy && echo "[+] Repository updated." 
    git checkout legacy && echo "[-] Checked out legacy branch."

    cd "$DRIVER_DIR"
    ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$GKI_ROOT/$REPO/kernel")" "kernelsu" && echo "[+] Symlink created."

    grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE" && echo "[+] Modified Makefile."
    grep -q "source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG" && echo "[+] Modified Kconfig."
    echo '[+] Done.'
}

initialize_variables
setup_kernelsu
KSU_EOF
chmod 755 ksu-legacy-setup.sh
echo "[✓] KernelSU安装脚本写入完成"

echo ""
echo "【校验·第五步】KernelSU脚本完整性"
FAIL=0
if [ -f "$KERNEL_DIR/ksu-legacy-setup.sh" ] && [ -x "$KERNEL_DIR/ksu-legacy-setup.sh" ]; then
  echo "[✓] ksu-legacy-setup.sh 存在且可执行"
else
  echo "[✗] ksu-legacy-setup.sh 缺失或不可执行"
  FAIL=1
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第五步校验失败，终止"
  exit 1
fi
echo "✅ 第五步校验通过"
echo ""

# ==================== 第六步：生成基础内核配置 ====================
echo "【第六步】生成基础内核配置"
cd $KERNEL_DIR
make O=out ARCH=arm64 $KERNEL_CONFIG
echo "[✓] 基础配置生成完成"

echo ""
echo "【校验·第六步】.config文件完整性"
FAIL=0
CONFIG_FILE=$KERNEL_DIR/out/.config
if [ ! -f "$CONFIG_FILE" ] || [ ! -s "$CONFIG_FILE" ]; then
  echo "[✗] .config 不存在或为空"
  FAIL=1
else
  echo "[✓] .config 存在，$(wc -l < "$CONFIG_FILE") 行"
  grep -q ^CONFIG_ARM64=y "$CONFIG_FILE" && echo "[✓] CONFIG_ARM64=y"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第六步校验失败，终止"
  exit 1
fi
echo "✅ 第六步校验通过"
echo ""

# ==================== 第七步：禁用VDSO32和32位兼容层 ====================
echo "【第七步】禁用VDSO32，消除32位链接依赖"
cd $KERNEL_DIR
sed -i '/CONFIG_COMPAT_VDSO/d' out/.config
sed -i '/CONFIG_VDSO32/d' out/.config
sed -i '/CONFIG_COMPAT=y/d' out/.config
echo "# CONFIG_COMPAT is not set" >> out/.config
echo "# CONFIG_COMPAT_VDSO is not set" >> out/.config
echo "# CONFIG_VDSO32 is not set" >> out/.config
sed -i 's/CONFIG_64BIT_VDSO_COMPAT=y/# CONFIG_64BIT_VDSO_COMPAT is not set/g' out/.config
make O=out ARCH=arm64 olddefconfig
sed -i '/CONFIG_COMPAT_VDSO/d' out/.config
sed -i '/CONFIG_VDSO32/d' out/.config
sed -i '/CONFIG_COMPAT=y/d' out/.config
echo "# CONFIG_COMPAT is not set" >> out/.config
echo "# CONFIG_COMPAT_VDSO is not set" >> out/.config
echo "# CONFIG_VDSO32 is not set" >> out/.config
if grep -q "vdso32" arch/arm64/kernel/Makefile; then
  sed -i '/vdso32/d' arch/arm64/kernel/Makefile
fi
echo "[✓] VDSO32和32位兼容层全链路禁用完成"

echo ""
echo "【校验·第七步】32位兼容层禁用确认"
FAIL=0
if grep -q "^CONFIG_COMPAT_VDSO=y" "$CONFIG_FILE"; then
  echo "[✗] CONFIG_COMPAT_VDSO 被自动恢复为开启状态"
  FAIL=1
else
  echo "[✓] CONFIG_COMPAT_VDSO 已永久禁用"
fi
if grep -q "^CONFIG_VDSO32=y" "$CONFIG_FILE"; then
  echo "[✗] CONFIG_VDSO32 被自动恢复为开启状态"
  FAIL=1
else
  echo "[✓] CONFIG_VDSO32 已永久禁用"
fi
if grep -q "^CONFIG_COMPAT=y" "$CONFIG_FILE"; then
  echo "[✗] CONFIG_COMPAT 被自动恢复为开启状态"
  FAIL=1
else
  echo "[✓] CONFIG_COMPAT 已永久禁用"
fi
VDSO_MAKEFILE=$KERNEL_DIR/arch/arm64/kernel/Makefile
if grep -q "vdso32" "$VDSO_MAKEFILE"; then
  echo "[✗] Makefile中仍残留vdso32编译规则"
  FAIL=1
else
  echo "[✓] Makefile中已完全移除vdso32编译规则"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第七步校验失败，终止"
  exit 1
fi
echo "✅ 第七步校验通过，完全消除32位链接冲突"
echo ""

# ==================== 第八步：写入Docker/LXC全量配置 ====================
echo "【第八步】写入Docker/LXC全量配置"
DEFCONFIG=$KERNEL_DIR/out/.config
add_config() {
  local config="$1"
  local key="${config%%=*}"
  local clean_key="${key# }"
  if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
    sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
    sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
  else
    echo "$config" >> "$DEFCONFIG"
  fi
}
add_config "CONFIG_SYSVIPC=y"
add_config "CONFIG_POSIX_MQUEUE=y"
add_config "CONFIG_NAMESPACES=y"
add_config "CONFIG_PID_NS=y"
add_config "CONFIG_UTS_NS=y"
add_config "CONFIG_IPC_NS=y"
add_config "CONFIG_USER_NS=y"
add_config "CONFIG_NET_NS=y"
add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
add_config "CONFIG_SECCOMP=y"
add_config "CONFIG_SECCOMP_FILTER=y"
add_config "CONFIG_CGROUPS=y"
add_config "CONFIG_CGROUP_CPUACCT=y"
add_config "CONFIG_CGROUP_DEVICE=y"
add_config "CONFIG_CGROUP_FREEZER=y"
add_config "CONFIG_CGROUP_SCHED=y"
add_config "CONFIG_CPUSETS=y"
add_config "CONFIG_MEMCG=y"
add_config "CONFIG_MEMCG_SWAP=y"
add_config "CONFIG_MEMCG_KMEM=y"
add_config "CONFIG_BLK_CGROUP=y"
add_config "CONFIG_CGROUP_PIDS=y"
add_config "CONFIG_CGROUP_PERF=y"
add_config "CONFIG_CFS_BANDWIDTH=y"
add_config "CONFIG_FAIR_GROUP_SCHED=y"
add_config "CONFIG_CGROUP_NET_PRIO=y"
add_config "CONFIG_CGROUP_HUGETLB=y"
add_config "CONFIG_NET_CLS_CGROUP=y"
add_config "CONFIG_BLK_DEV_THROTTLING=y"
add_config "CONFIG_CGROUP_BPF=y"
add_config "CONFIG_DEVTMPFS=y"
add_config "CONFIG_DEVTMPFS_MOUNT=y"
add_config "CONFIG_FW_LOADER=y"
add_config "CONFIG_FW_LOADER_USER_HELPER=y"
add_config "CONFIG_OVERLAY_FS=y"
add_config "CONFIG_TMPFS_XATTR=y"
add_config "CONFIG_TMPFS_POSIX_ACL=y"
add_config "CONFIG_EXT4_FS=y"
add_config "CONFIG_EXT4_FS_POSIX_ACL=y"
add_config "CONFIG_EXT4_FS_SECURITY=y"
add_config "CONFIG_BTRFS_FS=y"
add_config "CONFIG_BTRFS_FS_POSIX_ACL=y"
add_config "CONFIG_SQUASHFS=y"
add_config "CONFIG_SQUASHFS_XATTR=y"
add_config "CONFIG_VETH=y"
add_config "CONFIG_BRIDGE=y"
add_config "CONFIG_BRIDGE_NETFILTER=y"
add_config "CONFIG_MACVLAN=y"
add_config "CONFIG_IPVLAN=y"
add_config "CONFIG_VXLAN=y"
add_config "CONFIG_VLAN_8021Q=y"
add_config "CONFIG_NETFILTER=y"
add_config "CONFIG_NETFILTER_ADVANCED=y"
add_config "CONFIG_NF_CONNTRACK=y"
add_config "CONFIG_NF_TABLES=y"
add_config "CONFIG_NF_TABLES_IPV4=y"
add_config "CONFIG_NF_TABLES_IPV6=y"
add_config "CONFIG_NFT_MASQ=y"
add_config "CONFIG_NFT_NAT=y"
add_config "CONFIG_NF_NAT=y"
add_config "CONFIG_NF_NAT_REDIRECT=y"
add_config "CONFIG_IP_NF_FILTER=y"
add_config "CONFIG_IP_NF_IPTABLES=y"
add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
add_config "CONFIG_IP_NF_NAT=y"
add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
add_config "CONFIG_NETFILTER_XT_MARK=y"
add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
add_config "CONFIG_IP_VS=y"
add_config "CONFIG_IP_VS_NFCT=y"
add_config "CONFIG_IP_VS_PROTO_TCP=y"
add_config "CONFIG_IP_VS_PROTO_UDP=y"
add_config "CONFIG_IP_VS_RR=y"
add_config "CONFIG_IPV6=y"
add_config "CONFIG_IP6_NF_FILTER=y"
add_config "CONFIG_IP6_NF_NAT=y"
add_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
add_config "CONFIG_SECURITY_APPARMOR=y"
add_config "CONFIG_FHANDLE=y"
add_config "CONFIG_CHECKPOINT_RESTORE=y"
add_config "CONFIG_BPF=y"
add_config "CONFIG_BPF_SYSCALL=y"
add_config "CONFIG_BPF_JIT=y"
add_config "CONFIG_MODULES=y"
add_config "# CONFIG_ANDROID_PARANOID_NETWORK is not set"
add_config "CONFIG_CGROUP_AUTOMOUNT=y"
add_config "CONFIG_TMPFS=y"
add_config "CONFIG_HUGETLBFS=y"
echo "[✓] Docker/LXC全量配置写入完成"

echo ""
echo "【校验·第八步】Docker/LXC核心配置验证"
FAIL=0
CORE=(
  "CONFIG_NAMESPACES=y" "CONFIG_CGROUPS=y" "CONFIG_MEMCG=y"
  "CONFIG_USER_NS=y" "CONFIG_NET_NS=y" "CONFIG_OVERLAY_FS=y"
  "CONFIG_VETH=y" "CONFIG_BRIDGE=y" "CONFIG_NETFILTER=y"
  "CONFIG_NF_NAT=y" "CONFIG_SECCOMP=y" "CONFIG_SECURITY_APPARMOR=y"
  "CONFIG_BPF=y" "CONFIG_MODULES=y" "CONFIG_CGROUP_AUTOMOUNT=y"
)
for cfg in "${CORE[@]}"; do
  if grep -q "^${cfg}$" "$CONFIG_FILE" 2>/dev/null; then
    echo "[✓] ${cfg}"
  else
    echo "[✗] ${cfg}"
    FAIL=1
  fi
done
if [ $FAIL -eq 1 ]; then
  echo "❌ 第八步校验失败，终止"
  exit 1
fi
echo "✅ 第八步校验通过"
echo ""

# ==================== 第九步：部署KernelSU-Next ====================
echo "【第九步】部署KernelSU-Next Legacy"
cd $KERNEL_DIR
./ksu-legacy-setup.sh
grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
make O=out ARCH=arm64 olddefconfig
echo "[✓] KernelSU-Next部署完成"

echo ""
echo "【校验·第九步】KernelSU配置确认"
FAIL=0
grep -q "^CONFIG_KSU=y$" "$CONFIG_FILE" 2>/dev/null && echo "[✓] CONFIG_KSU=y" || { echo "[✗] CONFIG_KSU=y 缺失"; FAIL=1; }
[ -d "$KERNEL_DIR/drivers/kernelsu" ] && echo "[✓] KernelSU驱动目录存在" || { echo "[✗] 驱动目录缺失"; FAIL=1; }
if [ $FAIL -eq 1 ]; then
  echo "❌ 第九步校验失败，终止"
  exit 1
fi
echo "✅ 第九步校验通过"
echo ""

# ==================== 第十步：Clang兼容性修复 ====================
echo "【第十步】应用Clang兼容性补丁修复"
cd $KERNEL_DIR

# 修复1：writeback.h添加cgroup头文件
if grep -q "#include <linux/cgroup.h>" include/trace/events/writeback.h; then
  echo "[!] writeback.h已包含cgroup头文件，跳过"
else
  sed -i '\|^#undef TRACE_INCLUDE_PATH|a #include <linux/cgroup.h>' include/trace/events/writeback.h
  echo "[✓] writeback.h头文件修复完成"
fi

# 修复2：stack_pointer.h全局寄存器变量替换为内联函数
if grep -q 'register unsigned long current_stack_pointer asm ("sp");' arch/arm64/include/asm/stack_pointer.h; then
  python3 << 'PYEOF'
content = open('arch/arm64/include/asm/stack_pointer.h', 'r').read()
old = 'register unsigned long current_stack_pointer asm ("sp");'
new = '''static __always_inline unsigned long current_stack_pointer(void)
{
    unsigned long sp;
    asm volatile("mov %0, sp" : "=r"(sp));
    return sp;
}'''
content = content.replace(old, new)
open('arch/arm64/include/asm/stack_pointer.h', 'w').write(content)
PYEOF
  # 适配所有调用点
  sed -i 's/(regs)->sp = current_stack_pointer;/(regs)->sp = (u64)current_stack_pointer();/g' arch/arm64/include/asm/perf_event.h
  sed -i 's/frame.sp = current_stack_pointer;/frame.sp = current_stack_pointer();/g' arch/arm64/kernel/stacktrace.c
  sed -i 's/frame.sp = current_stack_pointer;/frame.sp = current_stack_pointer();/g' arch/arm64/kernel/traps.c
  if grep -q "unsigned long sp = current_stack_pointer;" arch/arm64/kernel/return_address.c; then
    sed -i 's/unsigned long sp = current_stack_pointer;/unsigned long sp = current_stack_pointer();/' arch/arm64/kernel/return_address.c
  fi
  echo "[✓] stack_pointer.h及所有调用点修复完成"
else
  echo "[!] stack_pointer.h已修复，跳过"
fi

# 修复3：spinlock.h立即数约束恢复
sed -i 's/"r" (1 << TICKET_SHIFT)/"I" (1 << TICKET_SHIFT)/g' arch/arm64/include/asm/spinlock.h

# 修复4：写入Werror豁免规则
sed -i '/KBUILD_CFLAGS.*-Wno-error=int-conversion/d' Makefile
sed -i '/KBUILD_CFLAGS.*-Wno-int-conversion/d' Makefile
sed -i '/KBUILD_CFLAGS.*-Wno-error=parentheses-equality/d' Makefile
sed -i '/KBUILD_CFLAGS.*-Wno-parentheses-equality/d' Makefile
sed -i '/KBUILD_CFLAGS.*-Wno-error=implicit-function-declaration/d' Makefile
sed -i '/KBUILD_CFLAGS.*-Wno-implicit-function-declaration/d' Makefile
echo "KBUILD_CFLAGS   += -Wno-error=int-conversion" >> Makefile
echo "KBUILD_CFLAGS   += -Wno-int-conversion" >> Makefile
echo "KBUILD_CFLAGS   += -Wno-error=parentheses-equality" >> Makefile
echo "KBUILD_CFLAGS   += -Wno-parentheses-equality" >> Makefile
echo "KBUILD_CFLAGS   += -Wno-error=implicit-function-declaration" >> Makefile
echo "KBUILD_CFLAGS   += -Wno-implicit-function-declaration" >> Makefile
echo "[✓] Clang兼容性补丁全部应用完成"

echo ""
echo "【校验·第十步】Clang修复确认"
FAIL=0
if grep -q "#include <linux/cgroup.h>" include/trace/events/writeback.h; then
  echo "[✓] writeback.h cgroup头文件已添加"
else
  echo "[✗] writeback.h修复失败"
  FAIL=1
fi
if grep -q 'register unsigned long current_stack_pointer asm ("sp");' arch/arm64/include/asm/stack_pointer.h; then
  echo "[✗] stack_pointer.h全局寄存器变量未移除"
  FAIL=1
else
  echo "[✓] stack_pointer.h已改为内联函数"
fi
if grep -q '"I" (1 << TICKET_SHIFT)' arch/arm64/include/asm/spinlock.h; then
  echo "[✓] spinlock.h立即数约束已恢复"
else
  echo "[✗] spinlock.h修复失败"
  FAIL=1
fi
if grep -q "KBUILD_CFLAGS   += -Wno-error=int-conversion" Makefile; then
  echo "[✓] Werror豁免规则已写入"
else
  echo "[✗] Werror豁免规则写入失败"
  FAIL=1
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十步校验失败，终止"
  exit 1
fi
echo "✅ 第十步校验通过"
echo ""

# ==================== 第十一步：全量内核编译 ====================
echo "【第十一步】启动Clang全量内核编译"
export PATH=$CLANG_DIR/clang-r450784d/bin:/usr/bin:$PATH
export ARCH=arm64
export SUBARCH=arm64
export CLANG_TRIPLE=aarch64-linux-gnu-
export CROSS_COMPILE=aarch64-linux-gnu-
export CROSS_COMPILE_ARM32=/usr/bin/arm-linux-gnueabi-

cd $KERNEL_DIR
make O=out \
  CC=clang \
  LD=ld.lld \
  AR=llvm-ar \
  NM=llvm-nm \
  OBJCOPY=llvm-objcopy \
  OBJDUMP=llvm-objdump \
  STRIP=llvm-strip \
  -j$(nproc) 2>&1 | tee full_build_detail.log
BUILD_EXIT_CODE=${PIPESTATUS[0]}

echo ""
echo "【校验·第十一步】编译结果验证"
FAIL=0
if [ $BUILD_EXIT_CODE -ne 0 ]; then
  echo "❌ 内核编译失败，退出码：${BUILD_EXIT_CODE}"
  echo "=== 最后100行编译日志 ==="
  tail -100 full_build_detail.log
  exit 1
fi
echo "[✓] make进程退出码为0"

if grep -qi "error:" full_build_detail.log; then
  echo "[✗] 编译日志中存在error关键字"
  grep -i "error:" full_build_detail.log | tail -20
  FAIL=1
fi
KERNEL_IMAGE=$KERNEL_DIR/out/arch/arm64/boot/Image
if [ ! -f "$KERNEL_IMAGE" ]; then
  echo "[✗] 内核Image镜像缺失"
  FAIL=1
else
  echo "[✓] 内核Image已生成：$(ls -lh $KERNEL_IMAGE | awk '{print $5}')"
fi
VMLINUX=$KERNEL_DIR/out/vmlinux
if [ ! -f "$VMLINUX" ]; then
  echo "[✗] vmlinux缺失"
  FAIL=1
else
  echo "[✓] vmlinux已生成：$(ls -lh $VMLINUX | awk '{print $5}')"
fi
DTB_OUT_DIR=$KERNEL_DIR/out/arch/arm64/boot/dts/qcom
if [ ! -f $DTB_OUT_DIR/msm8998-xiaomi-sagit.dtb ]; then
  find $DTB_OUT_DIR -name "*sagit*.dtb" -exec cp {} $DTB_OUT_DIR/msm8998-xiaomi-sagit.dtb \; 2>/dev/null || true
fi
DTB_FILE=$DTB_OUT_DIR/msm8998-xiaomi-sagit.dtb
if [ ! -f "$DTB_FILE" ] || [ ! -s "$DTB_FILE" ]; then
  echo "[✗] 小米6专属DTB文件缺失"
  FAIL=1
else
  echo "[✓] 小米6专属DTB已生成：$(ls -lh $DTB_FILE | awk '{print $5}')"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十一步校验失败，终止"
  exit 1
fi
echo "✅ 第十一步校验通过，内核编译成功"
echo ""

# ==================== 第十二步：生成Image.gz-dtb ====================
echo "【第十二步】生成Image.gz-dtb"
cd $KERNEL_DIR/out/arch/arm64/boot
gzip -9 -c Image > Image.gz
cat Image.gz dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
echo "[✓] Image.gz-dtb拼接完成"

echo ""
echo "【校验·第十二步】Image.gz-dtb完整性"
FAIL=0
BOOT_DIR=$KERNEL_DIR/out/arch/arm64/boot
if [ ! -f "$BOOT_DIR/Image.gz" ]; then
  echo "[✗] Image.gz缺失"
  FAIL=1
else
  echo "[✓] Image.gz存在：$(ls -lh $BOOT_DIR/Image.gz | awk '{print $5}')"
fi
if [ ! -f "$BOOT_DIR/Image.gz-dtb" ]; then
  echo "[✗] Image.gz-dtb缺失"
  FAIL=1
else
  echo "[✓] Image.gz-dtb存在：$(ls -lh $BOOT_DIR/Image.gz-dtb | awk '{print $5}')"
fi
if [ ! -s "$BOOT_DIR/Image.gz-dtb" ]; then
  echo "[✗] Image.gz-dtb为空文件"
  FAIL=1
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十二步校验失败，终止"
  exit 1
fi
echo "✅ 第十二步校验通过"
echo ""

# ==================== 第十三步：拉取AnyKernel3打包模板 ====================
echo "【第十三步】拉取AnyKernel3打包模板"
cd $KERNEL_WORKSPACE
if [ ! -d AnyKernel3/.git ]; then
  git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3.git
fi
cd AnyKernel3
rm -f Image* dtb* dtbo* *.zip 2>/dev/null || true
cp $KERNEL_DIR/out/arch/arm64/boot/Image.gz-dtb ./
echo "[✓] AnyKernel3模板就绪，内核镜像已复制"

echo ""
echo "【校验·第十三步】AnyKernel3文件确认"
FAIL=0
for f in "anykernel.sh" "META-INF/com/google/android/update-binary" "tools/ak3-core.sh"; do
  if [ -f "$ANYKERNEL_DIR/$f" ]; then
    echo "[✓] $f"
  else
    echo "[✗] $f 缺失"
    FAIL=1
  fi
done
if [ ! -f "$ANYKERNEL_DIR/Image.gz-dtb" ]; then
  echo "[✗] Image.gz-dtb未复制到AnyKernel3"
  FAIL=1
else
  echo "[✓] Image.gz-dtb已就位：$(ls -lh $ANYKERNEL_DIR/Image.gz-dtb | awk '{print $5}')"
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十三步校验失败，终止"
  exit 1
fi
echo "✅ 第十三步校验通过"
echo ""

# ==================== 第十四步：配置anykernel.sh ====================
echo "【第十四步】配置AnyKernel3刷机脚本"
cd $ANYKERNEL_DIR
sed -i 's|^kernel.string=.*|kernel.string=小米6官方开源内核·Docker/LXC/KernelSU|' anykernel.sh
sed -i 's|^device.name1=.*|device.name1=sagit|' anykernel.sh
sed -i 's|^device.name2=.*|device.name2=MI 6|' anykernel.sh
sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
sed -i 's|^device.name5=.*|device.name5=|' anykernel.sh
sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
sed -i 's|^is_slot_device=.*|is_slot_device=0;|' anykernel.sh
sed -i 's|^ramdisk_compression=.*|ramdisk_compression=auto;|' anykernel.sh

# 自动补全缺失配置
declare -A DEFAULTS=(
  ["block"]="/dev/block/bootdevice/by-name/boot"
  ["is_slot_device"]="0"
  ["ramdisk_compression"]="auto"
)
for key in "${!DEFAULTS[@]}"; do
  val="${DEFAULTS[$key]}"
  if ! grep -q "^${key}=" anykernel.sh 2>/dev/null; then
    sed -i "/^device.name1=/a\\${key}=${val};" anykernel.sh
  fi
done
echo "[✓] anykernel.sh配置完成"

echo ""
echo "【校验·第十四步】anykernel.sh关键参数确认"
FAIL=0
CHECKS=(
  "device.name1=sagit"
  "block=/dev/block/bootdevice/by-name/boot"
  "is_slot_device=0"
  "ramdisk_compression=auto"
)
for check in "${CHECKS[@]}"; do
  if grep -qE "^${check};?\s*$" anykernel.sh 2>/dev/null; then
    echo "[✓] ${check}"
  else
    echo "[✗] ${check}"
    FAIL=1
  fi
done
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十四步校验失败，终止"
  exit 1
fi
echo "✅ 第十四步校验通过"
echo ""

# ==================== 第十五步：打包ZIP刷机包 ====================
echo "【第十五步】打包AnyKernel3 ZIP刷机包"
cd $ANYKERNEL_DIR
zip -r9 "../${KERNEL_ZIP_NAME}" ./* -x ".git/*" ".github/*" "*.md" "LICENSE"
echo "[✓] ZIP打包完成：${KERNEL_ZIP_NAME}"

echo ""
echo "【校验·第十五步】ZIP文件完整性"
FAIL=0
ZIP_FILE=$KERNEL_WORKSPACE/$KERNEL_ZIP_NAME
if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
  echo "[✗] 未找到ZIP文件"
  FAIL=1
else
  echo "[✓] ZIP文件：$(basename $ZIP_FILE)"
  echo "[✓] 大小：$(ls -lh $ZIP_FILE | awk '{print $5}')"
  if ! unzip -t "$ZIP_FILE" > /dev/null 2>&1; then
    echo "[✗] ZIP文件损坏（unzip -t测试失败）"
    FAIL=1
  else
    echo "[✓] ZIP完整性校验通过"
  fi
  if ! unzip -l "$ZIP_FILE" | grep -q "Image.gz-dtb"; then
    echo "[✗] ZIP中缺少Image.gz-dtb"
    FAIL=1
  else
    echo "[✓] ZIP包含Image.gz-dtb"
  fi
  if ! unzip -l "$ZIP_FILE" | grep -q "anykernel.sh"; then
    echo "[✗] ZIP中缺少anykernel.sh"
    FAIL=1
  else
    echo "[✓] ZIP包含anykernel.sh"
  fi
fi
if [ $FAIL -eq 1 ]; then
  echo "❌ 第十五步校验失败，终止"
  exit 1
fi
echo "✅ 第十五步校验通过"
echo ""

