        id: step11
        run: |
          # -------------------------- 第一层：清理历史遗留规则 --------------------------
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== 清理历史遗留Werror配置 ==="
          sed -i '/KBUILD_CFLAGS.*-Wno-error=int-conversion/d' Makefile
          sed -i '/KBUILD_CFLAGS.*-Wno-int-conversion/d' Makefile
          sed -i '/KBUILD_CFLAGS.*-Wno-parentheses-equality/d' Makefile
          sed -i '/KBUILD_CFLAGS.*-Wno-implicit-function-declaration/d' Makefile
          echo "[✓] 已清空所有旧的告警豁免规则，避免重复写入冲突"

          # -------------------------- 第二层：写入六层强制豁免规则 --------------------------
          echo ""
          echo "=== 写入六层Werror豁免规则 ==="
          echo "KBUILD_CFLAGS   += -Wno-error=int-conversion" >> Makefile
          echo "KBUILD_CFLAGS   += -Wno-int-conversion" >> Makefile
          echo "KBUILD_CFLAGS   += -Wno-error=parentheses-equality" >> Makefile
          echo "KBUILD_CFLAGS   += -Wno-parentheses-equality" >> Makefile
          echo "KBUILD_CFLAGS   += -Wno-error=implicit-function-declaration" >> Makefile
          echo "KBUILD_CFLAGS   += -Wno-implicit-function-declaration" >> Makefile
          echo "KBUILD_CFLAGS   += -w" >> Makefile
          # 全局递归应用-w到所有子目录，彻底解决子目录警告当错误终止
          echo "subdir-ccflags-y += -w -Wno-error" >> Makefile
          echo "export HOSTCFLAGS=-fcommon -w -Wno-deprecated-declarations" >> Makefile
          echo "[✓] 所有告警豁免规则写入完成，含全局递归子目录豁免"

          # -------------------------- 第三层：校验所有豁免规则写入有效性 --------------------------
          echo ""
          echo "=== 校验豁免规则写入结果 ==="
          FAIL=0
          for flag in "-Wno-error=int-conversion" "-Wno-int-conversion" "-Wno-error=parentheses-equality" "-Wno-parentheses-equality" "-Wno-error=implicit-function-declaration" "-Wno-implicit-function-declaration"; do
            if grep -q "KBUILD_CFLAGS.*$flag" Makefile; then
              echo "[✓] $flag 规则已生效"
            else
              echo "[✗] $flag 规则写入失败"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 豁免规则校验失败，终止"
            exit 1
          fi
          echo "✅ 六层Werror豁免配置全部校验通过，从根源规避所有已知Clang告警升级为致命错误"

      
          # -------------------------- 第四层：定义编译全局环境变量 --------------------------
          echo ""
          echo "=== 初始化编译全局环境变量 ==="
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:/usr/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          echo "[✓] 全量编译环境变量初始化完成"
      
          # -------------------------- 第五层：启动全量内核编译 --------------------------
          echo ""
          echo "=== 启动Clang全量内核编译 ==="
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTCFLAGS="-fcommon -w -Wno-deprecated-declarations -Wno-error=deprecated-declarations"
          export KCFLAGS="-w -Wno-error"
          export KBUILD_HOSTCFLAGS="-fcommon -w -Wno-deprecated-declarations"
          make O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc) 2>&1 | tee full_build_detail.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
      
          # -------------------------- 第六层：全量编译错误日志抓取 --------------------------
          echo ""
          echo "=== 全量错误日志分析 ==="
          grep -n -i "error:" full_build_detail.log || echo "[!] 日志中无显性error标记"
          grep -n -i "undefined reference" full_build_detail.log || echo "[!] 日志中无未定义符号错误"
          grep -n -i "fatal error" full_build_detail.log || echo "[!] 日志中无致命编译错误"

      
          # -------------------------- 第七层：编译结果状态判定 --------------------------
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ 内核编译失败，退出码：${BUILD_EXIT_CODE}"
            echo "=== 最后150行完整编译日志 ==="
            tail -150 full_build_detail.log
            exit 1
          fi
          echo "[✓] 内核编译完全成功"


  
      # ==================== 第十三步：原生A风格打包流程 ====================
      - name: 【打包前置】内核镜像存在性与大小硬校验
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          IMG=out/arch/arm64/boot/Image.gz-dtb
          if [ ! -s "$IMG" ]; then
            echo "[✗] 未产出 $IMG（默认目标没构建出拼接镜像），终止"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi
          SZ=$(stat -c%s "$IMG")
          echo "[✓] $IMG 存在，大小 ${SZ} 字节"
          if [ "$SZ" -lt 3000000 ]; then
            echo "[✗] 镜像小于 3MB，疑似未拼接 DTB，终止"
            exit 1
          fi
          echo "✅ 内核镜像校验通过"

      - name: 准备打包内核
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ -d AnyKernel3 ]; then
            rm -rf AnyKernel3
          fi
          git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!/dev/block/platform/omap/omap_hsmmc\.0!/dev/block/bootdevice!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' AnyKernel3/anykernel.sh
          SRC_IMG=android-kernel/out/arch/arm64/boot/Image.gz-dtb
          if [ ! -s "$SRC_IMG" ]; then
            echo "[✗] 源镜像不存在，终止"
            exit 1
          fi
          cp "$SRC_IMG" AnyKernel3/
          if [ ! -s "AnyKernel3/Image.gz-dtb" ]; then
            echo "[✗] 拷贝后镜像为空，终止"
            exit 1
          fi
          echo "[✓] 镜像已放入AnyKernel3，大小 $(stat -c%s AnyKernel3/Image.gz-dtb) 字节"
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch

      - name: 打包并上传
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/*
