name: 小米6 Kernel CI（Docker + LXC + KernelSU 最终修复版v9）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 1️⃣ 加载环境变量
      # =========================
      - name: Load config
        run: |
          set +euo pipefail
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV || true

      # =========================
      # 2️⃣ 安装编译依赖
      # =========================
      - name: Install deps
        run: |
          set +euo pipefail
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
          libssl-dev libelf-dev wget curl python3 python2 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          device-tree-compiler libstdc++-10-dev \
          build-essential libncurses5-dev \
          xz-utils cpio unzip

      # =========================
      # 3️⃣ 准备工作目录
      # =========================
      - name: Prepare workspace
        run: |
          set +euo pipefail
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      # =========================
      # 4️⃣ 缓存内核源码
      # =========================
      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}-v9
          restore-keys: |
            kernel-${{ env.KERNEL_SOURCE_BRANCH }}-

      - name: Clone kernel
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          fi

      # =========================
      # 5️⃣ 集成 KernelSU v0.9.5
      # =========================
      - name: Integrate KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::KernelSU Integration"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5 || true
          # 给KernelSU驱动单独关警告
          if [ -f drivers/kernelsu/Makefile ]; then
            echo 'ccflags-y += -w -fcommon' >> drivers/kernelsu/Makefile
            echo "已给KernelSU驱动添加-w关闭警告"
          fi
          ls -la drivers/kernelsu/ 2>/dev/null || echo "⚠️  kernelsu 目录位置检查"
          echo "::endgroup::"

      # =========================
      # 6️⃣ 预修复补丁（一次性打全所有兼容问题）
      # =========================
      - name: Patch kernel for GCC 11 compatibility
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::Applying compatibility patches"

          # ---- 补丁1：dtc-lexer yylloc extern 修复 ----
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            if [ -f "$f" ]; then
              if ! grep -q "extern YYLTYPE yylloc" "$f"; then
                sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
                echo "✅ $f yylloc extern 补丁已打"
              fi
            fi
          done

          # ---- 补丁2：HOSTCFLAGS 加 -fcommon 解决主机程序多重定义 ----
          if ! grep -q "HOSTCFLAGS.*-fcommon" Makefile; then
            sed -i '/^HOSTCFLAGS/s/$/ -fcommon -w/' Makefile
          fi

          # ---- 补丁3：【关键】全局移除 -Werror，GCC11比GCC4.9严格 ----
          echo "正在移除所有 -Werror..."
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec \
            sed -i 's/-Werror/-Wno-error/g' {} + || true
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec \
            sed -i 's/-Werror=[^ ]*//g' {} + || true
          echo "✅ -Werror 已全局移除"

          # ---- 补丁4：【关键】真正切换python2为默认python ----
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          echo "✅ python 已指向 python2"

          echo "::endgroup::"

      # =========================
      # 6.5️⃣ 清理构建目录
      # =========================
      - name: Clean kernel build
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper 2>/dev/null || true
          make clean 2>/dev/null || true

      # =========================
      # 7️⃣ 生成配置（绝对不能有缩进！）
      # =========================
      - name: Generate feature config
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat > kernel_features.txt <<'EOF'
          # ========== Docker/LXC/KernelSU 核心配置 ==========
          # Namespaces
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          # Cgroups
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CGROUP_PIDS=y
          # 容器网络
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_IP_VS_SH=y
          CONFIG_IP_VS_WRR=y
          # 文件系统
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_KEYS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FANOTIFY=y
          CONFIG_FHANDLE=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_MACVLAN=y
          CONFIG_VLAN_8021Q=y
          CONFIG_BRIDGE_VLAN_FILTERING=y
          # 安全
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_SECURITY_SELINUX_AVC_STATS=y
          CONFIG_CC_STACKPROTECTOR=y
          # KernelSU 依赖
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # 其他基础
          CONFIG_MMU=y
          CONFIG_SWAP=y
          CONFIG_FREEZER=y
          CONFIG_EVENTFD=y
          CONFIG_EPOLL=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_PACKET=y
          CONFIG_UNIX_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_PACKET_DIAG=y
          CONFIG_NETLINK_DIAG=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IPV6_SUBTREES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
          CONFIG_NETFILTER_XT_MATCH_STRING=y
          CONFIG_TASKSTATS=y
          CONFIG_TASK_DELAY_ACCT=y
          CONFIG_TASK_IO_ACCOUNTING=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_PRINTK_TIME=y
          CONFIG_NET_SCHED=y
          # 关闭冲突项
          CONFIG_STRICT_MEMORY_RWX=n
          EOF
          wc -l kernel_features.txt

      # =========================
      # 8️⃣ 内核配置合并
      # =========================
      - name: Configure kernel
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export ARCH=arm64
          export O=out
          export SUBARCH=arm64

          echo "::group::Loading defconfig"
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "::endgroup::"

          if [ -f ../kernel_features.txt ]; then
            echo "::group::Merging feature configs"
            sort ../kernel_features.txt | uniq > /tmp/feature_fragment.txt
            if [ -f scripts/kconfig/merge_config.sh ]; then
              scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/feature_fragment.txt || true
            else
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                [[ "$line" =~ ^[[:space:]]*# ]] && continue
                config_name=$(echo "$line" | cut -d'=' -f1)
                sed -i "/^${config_name}=/d" out/.config || true
                sed -i "/^# ${config_name} is not set$/d" out/.config || true
                echo "$line" >> out/.config
              done < /tmp/feature_fragment.txt
            fi
            echo "::endgroup::"
          fi

          echo "::group::Finalize config"
          make O=out ARCH=arm64 olddefconfig
          echo "::endgroup::"

          echo "::group::Config verification"
          echo "KERNELSU:"
          grep "CONFIG_KSU=" out/.config || echo "⚠️ KSU not found"
          echo "DOCKER:"
          grep -E "CONFIG_(NAMESPACES|CGROUPS|OVERLAY_FS|VETH|BRIDGE|NAMESPACES|SECCOMP)=" out/.config | head -10
          echo "::endgroup::"

      # =========================
      # 9️⃣ 编译内核（使用Ubuntu自带GCC，100%兼容）
      # =========================
      - name: Build kernel
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          echo "::group::Compiler info"
          aarch64-linux-gnu-gcc --version | head -2
          python --version
          echo "::endgroup::"

          export KBUILD_BUILD_HOST=CI
          export KBUILD_BUILD_USER=MI6
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export O=out
          export HOSTCFLAGS="-fcommon -w -O2"
          export HOSTLDFLAGS=""
          export KCFLAGS="-w -fcommon"
          export KPATCHFLAGS="-w"

          echo "::group::Start kernel build"
          make -j$(nproc) O=out 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ 编译失败！错误摘要如下："
            echo "::group::BUILD ERROR SUMMARY (last 120 lines)"
            # 1. 先尝试抓带error关键字的行
            grep -n -i -E "(error:|fatal error|undefined reference|multiple definition|cannot find|no such file|bad instruction|invalid operand)" build.log | grep -v "ccache" | tail -60 || true
            echo ""
            echo "--- 最后 120 行完整日志（兜底） ---"
            tail -120 build.log || true
            echo "::endgroup::"
            exit $BUILD_RC
          fi

          echo "✅ 内核编译成功！"
          echo "::group::Built artifacts"
          ls -lh out/arch/arm64/boot/ 2>/dev/null || true
          echo "::endgroup::"

      # =========================
      # 1️⃣0️⃣ 上传完整构建日志（失败也能下载）
      # =========================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log-v9
          path: kernel_workspace/android-kernel/build.log
          retention-days: 7

      # =========================
      # 1️⃣1️⃣ 下载 AnyKernel3 打包
      # =========================
      - name: Download AnyKernel3
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3 ]; then
            git clone -b master --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

      - name: Package kernel zip
        run: |
          set +euo pipefail
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          rm -f *.zip
          rm -rf dtb* zImage Image* *-dtb 2>/dev/null || true

          # 拷贝编译出的内核
          if [ -f ../android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz-dtb ./
          elif [ -f ../android-kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image.gz ./
            echo "⚠️ 使用 Image.gz，未包含dtb"
          elif [ -f ../android-kernel/out/arch/arm64/boot/Image ]; then
            cp ../android-kernel/out/arch/arm64/boot/Image ./
            echo "⚠️ 使用 Image"
          fi

          # 小米6(sagit)配置：非A/B分区
          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ### Properties
          properties() {
          kernel.string=MI6 (sagit) Kernel with Docker/LXC + KernelSU
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sagit
          device.name2=MCE16
          device.name3=MCT1
          device.name4=MI6
          device.name5=
          supported.versions=
          supported.patchlevels=
          ; }
          
          ### shell Variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          . tools/ak3-core.sh;
          
          ### AnyKernel install
          dump_boot;
          write_boot;
          ## end install
          EOF

          zip -r9 "../MI6-sagit-KernelSU-Docker-LXC.zip" . -x "*.git*" -x "README.md"
          echo "✅ 打包完成"
          ls -lh "../MI6-sagit-KernelSU-Docker-LXC.zip"

      # =========================
      # 1️⃣2️⃣ 上传产物
      # =========================
      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MI6-sagit-Kernel-Package
          path: kernel_workspace/MI6-sagit-KernelSU-Docker-LXC.zip
