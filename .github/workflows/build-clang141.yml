name: 小米6 Kernel CI（Docker + LXC + KernelSU 全量支持修复版）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 1️⃣ 加载环境变量
      # =========================
      - name: Load config
        run: |
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV

      # =========================
      # 2️⃣ 安装编译依赖（含旧内核兼容补丁所需）
      # =========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
          libssl-dev libelf-dev wget curl python3 python2 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          device-tree-compiler libstdc++-10-dev \
          build-essential libncurses5-dev \
          xz-utils cpio unzip

          # 设置 python2 为可选调用
          sudo ln -sf /usr/bin/python2 /usr/bin/python2.7 || true

      # =========================
      # 3️⃣ 准备工作目录
      # =========================
      - name: Prepare workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      # =========================
      # 4️⃣ 缓存 Clang（使用 r383902，对4.4内核兼容性好）
      # =========================
      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: kernel_workspace/clang-proton
          key: clang-proton-12

      - name: Setup Clang
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-proton ]; then
            # 使用稳定版 Clang，兼容4.4内核编译
            wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton-clang.tar.gz
            mkdir -p clang-proton
            tar -xzf proton-clang.tar.gz -C clang-proton --strip-components=1
            rm proton-clang.tar.gz
          fi
          ls clang-proton/bin/

      # =========================
      # 5️⃣ 缓存内核源码
      # =========================
      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-${{ env.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ env.KERNEL_SOURCE_BRANCH }}-

      - name: Clone kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          fi

      # =========================
      # 5.5️⃣ 集成 KernelSU v0.9.5（非GKI 4.4内核专用）
      # =========================
      - name: Integrate KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::KernelSU Integration"
          set -e

          # 非GKI内核必须使用 v0.9.5，v1.0+ 不再支持非GKI
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

          echo "KernelSU 集成完成"
          ls -la drivers/kernelsu/ 2>/dev/null || echo "⚠️  kernelsu 目录不在 drivers/ 下，可能在其他位置"
          echo "::endgroup::"

      # =========================
      # 6️⃣ 预修复：GCC10+ yylloc multiple definition 错误
      # 老内核 DTC 代码与新GCC的 -fno-common 默认冲突，添加 -fcommon 到主机编译标志
      # =========================
      - name: Patch old kernel GCC10+ compatibility
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::Patch yylloc multiple definition"

          # 方法1：向 scripts/dtc/dtc-lexer.lex.c_shipped 添加 extern YYLTYPE yylloc
          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            # 检查是否已经修改过
            if ! grep -q "extern YYLTYPE yylloc" scripts/dtc/dtc-lexer.lex.c_shipped; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
              echo "已修复 scripts/dtc/dtc-lexer.lex.c_shipped 的 yylloc 定义"
            fi
          fi

          # 方法2：同样检查生成的 .l 文件
          if [ -f scripts/dtc/dtc-lexer.l ]; then
            if ! grep -q "extern YYLTYPE yylloc" scripts/dtc/dtc-lexer.l; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l 2>/dev/null || true
            fi
          fi

          # 方法3：确保顶层 Makefile 给 HOSTCFLAGS 添加 -fcommon
          if ! grep -q "HOSTCFLAGS.*-fcommon" Makefile; then
            sed -i '/^HOSTCFLAGS/s/$/ -fcommon/' Makefile
            echo "已在 Makefile 中为 HOSTCFLAGS 添加 -fcommon"
          fi

          echo "::endgroup::"

      # =========================
      # 6.5️⃣ 清理构建目录
      # =========================
      - name: Clean kernel build
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper || true
          make clean || true

      # =========================
      # 7️⃣ 生成完整的 Docker/LXC + KernelSU 配置
      # =========================
      - name: Generate feature config
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat > kernel_features.txt <<'EOF'
          # ==================================================
          # Docker / LXC 容器必需内核配置（基于 Moby check-config）
          # 以及 KernelSU 依赖配置
          # ==================================================

          # ---------- Namespaces 命名空间（容器隔离基础） ----------
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y

          # ---------- Cgroups 控制组（资源限制） ----------
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CGROUP_BPF=y
          CONFIG_CGROUP_PIDS=y

          # ---------- 网络支持（容器网络） ----------
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_NETFILTER_ADVANCED=y

          # ---------- 文件系统 ----------
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_KEYS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FANOTIFY=y
          CONFIG_FHANDLE=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y

          # ---------- 安全相关 ----------
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CC_STACKPROTECTOR=y
          CONFIG_CC_STACKPROTECTOR_STRONG=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_SECURITY_SELINUX_AVC_STATS=y

          # ---------- Netfilter / iptables ----------
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_IP_NF_NAT_NEEDED=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y

          # ---------- KernelSU 依赖 ----------
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # ---------- 其他 Docker 必需项 ----------
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_MMU=y
          CONFIG_SWAP=y
          CONFIG_FREEZER=y
          CONFIG_EVENTFD=y
          CONFIG_EPOLL=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_VSOCKETS=y
          CONFIG_VIRTIO_VSOCKETS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_EVENTS=y

          # ---------- 禁用冲突项 ----------
          CONFIG_STRICT_MEMORY_RWX=n
          # CONFIG_DM_REQ_CRYPT is not set

          # ---------- LXC 额外需要 ----------
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_KEYS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_OVERLAY_FS=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_MARK=y
          CONFIG_NF_CONNTRACK_ZONES=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IPV6_SUBTREES=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y
          CONFIG_IP_VS_SH=y
          CONFIG_IP_VS_WRR=y
          CONFIG_NETFILTER_XT_MATCH_L2TP=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
          CONFIG_NETFILTER_XT_MATCH_STRING=y
          CONFIG_NETFILTER_XT_MATCH_TIME=y
          CONFIG_NETFILTER_XT_MATCH_U32=y
          CONFIG_TASKSTATS=y
          CONFIG_TASK_DELAY_ACCT=y
          CONFIG_TASK_IO_ACCOUNTING=y
          CONFIG_VETH=y
          CONFIG_MACVLAN=y
          CONFIG_VLAN_8021Q=y
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_PPP=y
          CONFIG_PPP_ASYNC=y
          CONFIG_PPP_SYNC_TTY=y
          CONFIG_PPP_DEFLATE=y
          CONFIG_PPP_BSDCOMP=y
          CONFIG_PPP_MPPE=y
          CONFIG_PPPOE=y
          CONFIG_PPTP=y
          CONFIG_PPPOL2TP=y
          CONFIG_NET_PPP=y
          CONFIG_NET_KEY=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_PACKET_DIAG=y
          CONFIG_NETLINK_DIAG=y
          CONFIG_UNIX_DIAG=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_PRINTK_TIME=y
          CONFIG_DEBUG_INFO=n
          EOF

          echo "Kernel features config generated:"
          wc -l kernel_features.txt

      # =========================
      # 8️⃣ 内核配置合并（使用更可靠的 merge_config.sh 方式）
      # =========================
      - name: Configure kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export ARCH=arm64
          export O=out
          export SUBARCH=arm64

          echo "::group::Loading defconfig"
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "::endgroup::"

          # 使用 scripts/kconfig/merge_config.sh 来可靠合并片段，
          # 这比手动sed追加要可靠得多，能自动处理依赖关系
          if [ -f ../kernel_features.txt ]; then
            echo "::group::Merging Docker/LXC/KernelSU configs via merge_config.sh"
            # 去重后合并
            sort ../kernel_features.txt | uniq > /tmp/feature_fragment.txt
            if [ -f scripts/kconfig/merge_config.sh ]; then
              scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/feature_fragment.txt
            else
              # 没有merge_config.sh时采用逐行追加方式
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                [[ "$line" =~ ^[[:space:]]*# ]] && continue
                config_name=$(echo "$line" | cut -d'=' -f1)
                # 移除同名旧配置
                sed -i "/^${config_name}=/d" out/.config
                sed -i "/^# ${config_name} is not set$/d" out/.config
                echo "$line" >> out/.config
              done < /tmp/feature_fragment.txt
            fi
            echo "::endgroup::"
          fi

          echo "::group::Finalize config with olddefconfig"
          # 让Kconfig自动解析并补齐所有依赖，对交互式选项使用默认值
          yes "" | make O=out ARCH=arm64 oldconfig 2>&1 || \
          make O=out ARCH=arm64 olddefconfig
          echo "::endgroup::"

          # 确认关键选项已开启
          echo "::group::Verify critical configs"
          echo "--- Namespaces ---"
          grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS)=" out/.config
          echo "--- Cgroups ---"
          grep -E "CONFIG_(CGROUPS|MEMCG|CGROUP_DEVICE|CPUSETS|CGROUP_BPF)=" out/.config
          echo "--- Network ---"
          grep -E "CONFIG_(VETH|BRIDGE|BRIDGE_NETFILTER|OVERLAY_FS)=" out/.config
          echo "--- KernelSU ---"
          grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config || echo "⚠️ KernelSU config not found, this may be normal if Kconfig isn't yet processed"
          echo "::endgroup::"

      # =========================
      # 9️⃣ 设置 ccache 加速
      # =========================
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3G

      # =========================
      # 🔟 编译内核（关键错误处理 + 错误日志输出）
      # =========================
      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang-proton"
          export PATH="${CLANG_DIR}/bin:$PATH"

          # 验证clang可用
          echo "::group::Compiler info"
          clang --version | head -2
          aarch64-linux-gnu-gcc --version | head -2
          echo "::endgroup::"

          export KBUILD_BUILD_HOST=CI
          export KBUILD_BUILD_USER=MI6
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export O=out

          # HOSTCFLAGS 增加 -fcommon 彻底解决 yylloc 问题
          export HOSTCFLAGS="-fcommon -O2"
          export HOSTLDFLAGS=""

          echo "::group::Start kernel build"
          set +e
          if [ "${{ env.LLVM_CONFIG }}" = "y" ]; then
            # LLVM=1 完整模式（4.4内核可能不兼容）
            make -j$(nproc) O=out \
              CC="ccache clang" \
              LLVM=1 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              2>&1 | tee build.log
            BUILD_RC=${PIPESTATUS[0]}
          else
            # 使用 Clang 编译内核 + GNU as 汇编器（更稳定，推荐4.4内核使用）
            make -j$(nproc) O=out \
              CC="ccache clang" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              2>&1 | tee build.log
            BUILD_RC=${PIPESTATUS[0]}
          fi
          echo "::endgroup::"

          # 编译失败时输出关键错误
          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ 编译失败！错误摘要如下："
            echo "::group::BUILD ERROR SUMMARY (last 100 error lines)"
            grep -E "^(.*error:|make\[.*\]: \*\*\*)" build.log | tail -100
            echo "::endgroup::"
            echo ""
            echo "以下是可能的修复提示："
            echo "  - 若报 yylloc/yylval 多重定义：HOSTCFLAGS -fcommon 已添加，检查 scripts/dtc 补丁是否生效"
            echo "  - 若报 assembler 不识别指令：关闭 LLVM=1/LLVM_IAS，使用GNU as"
            echo "  - 若报 某个 CONFIG 相关错误：检查 defconfig 合并是否正确"
            exit $BUILD_RC
          fi

          echo "✅ 内核编译成功！"
          echo "::group::Built artifacts"
          ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "⚠️ boot目录不存在"
          echo "::endgroup::"

      # =========================
      # 1️⃣1️⃣ 打包内核（AnyKernel3）
      # =========================
      - name: Pack kernel
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          # ---- 小米6 (sagit) 专用适配 ----
          cd AnyKernel3
          # 关闭设备检查（允许刷入）
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # 小米6 boot 分区路径（A/B 单分区，非slot设备）
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sagit/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=sagit/g' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=MCE16/g' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=MCT1/g' anykernel.sh
          sed -i 's/device.name5=/device.name5=MI6/g' anykernel.sh

          # 移除不相关的 ramdisk 补丁
          for pat in "init.tuna.rc" "fstab.tuna" "replace_string init.rc" \
                     "insert_line init.tuna" "patch_fstab fstab.tuna" \
                     "append_file init.tuna" "append_file fstab.tuna" \
                     "bootscript" "usbdisk" "do.ui_print.*Note"; do
            sed -i "/${pat}/d" anykernel.sh 2>/dev/null
          done

          # 确保打包时不包含 modules/vendor（小米6单镜像内核）
          echo "" >> anykernel.sh
          echo "# MI6: do not patch ramdisk to avoid bootloop" >> anykernel.sh
          echo "do.modules=0" >> anykernel.sh
          echo "do.systemless=0" >> anykernel.sh
          echo "do.cleanup=1" >> anykernel.sh
          echo "do.patch_vbmeta=0" >> anykernel.sh

          cd ..

          # 复制内核镜像
          IMAGE_FILE="${{ env.KERNEL_IMAGE_NAME }}"
          if [ -z "$IMAGE_FILE" ]; then
            IMAGE_FILE="Image.gz-dtb"
          fi
          if [ ! -f "android-kernel/out/arch/arm64/boot/${IMAGE_FILE}" ]; then
            echo "⚠️ ${IMAGE_FILE} 不存在，尝试检测可用镜像..."
            ls -la android-kernel/out/arch/arm64/boot/
            # 回退尝试 Image.gz / Image
            for f in Image.gz-dtb Image.gz Image; do
              if [ -f "android-kernel/out/arch/arm64/boot/$f" ]; then
                IMAGE_FILE="$f"
                echo "使用 ${IMAGE_FILE} 作为回退"
                break
              fi
            done
          fi

          cp android-kernel/out/arch/arm64/boot/${IMAGE_FILE} AnyKernel3/

          # 清理 AnyKernel3 仓库文件
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          rm -f AnyKernel3/*.img AnyKernel3/zImage AnyKernel3/zImage-dtb

          # 查看最终包内容
          echo "::group::AnyKernel3 final content"
          ls -la AnyKernel3/
          head -30 AnyKernel3/anykernel.sh
          echo "::endgroup::"

          # 打包成zip
          cd AnyKernel3
          zip -r ../${{ env.KERNEL_ZIP_NAME }}.zip . -x "*.zip"
          cd ..
          echo "✅ 内核包已打包: ${{ env.KERNEL_ZIP_NAME }}.zip"
          ls -lh ${{ env.KERNEL_ZIP_NAME }}.zip

      # =========================
      # 1️⃣2️⃣ 上传内核包
      # =========================
      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: |
            kernel_workspace/*.zip
            kernel_workspace/AnyKernel3/*

      # =========================
      # 1️⃣3️⃣ 上传编译日志（不论成功失败都上传）
      # =========================
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: warn
