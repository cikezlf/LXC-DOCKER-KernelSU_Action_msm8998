name: 小米6 Kernel CI（Docker + LXC + KernelSU 全量支持修复版 v4）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 1️⃣ 加载环境变量
      # =========================
      - name: Load config
        run: |
          grep -v '^#' config.env | grep -v '^$' >> $GITHUB_ENV

      # =========================
      # 2️⃣ 安装编译依赖
      # =========================
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex zip ccache \
            libssl-dev libelf-dev wget curl python3 python2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler libstdc++-10-dev \
            build-essential libncurses5-dev \
            xz-utils cpio unzip

          # 关键：把 python2 设为默认 python（老内核脚本依赖）
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      # =========================
      # 3️⃣ 准备工作目录
      # =========================
      - name: Prepare workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      # =========================
      # 4️⃣ 准备 Clang（使用 proton-clang，自带全套兼容 binutils）
      # proton-clang 专门为Android内核定制，binutils版本匹配老内核
      # =========================
      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: kernel_workspace/clang-proton
          key: clang-proton-v4

      - name: Setup Clang
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-proton/bin ]; then
            wget -q https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O proton-clang.tar.gz
            mkdir -p clang-proton
            tar -xzf proton-clang.tar.gz -C clang-proton --strip-components=1
            rm proton-clang.tar.gz
          fi
          echo "=== Clang 版本 ==="
          clang-proton/bin/clang --version | head -2
          echo "=== 自带 binutils ==="
          ls clang-proton/bin/ | grep -E "ld|as|ar|nm" | head -10

      # =========================
      # 5️⃣ 缓存内核源码（cache key 加 v4 强制重新拉取，避免旧状态）
      # =========================
      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: kernel_workspace/android-kernel
          key: kernel-v4-${{ env.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            kernel-v4-${{ env.KERNEL_SOURCE_BRANCH }}-

      - name: Clone kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel ]; then
            git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
          fi
          cd android-kernel
          echo "内核源码版本："
          head -5 Makefile

      # =========================
      # 5.5️⃣ 集成 KernelSU v0.9.5（非GKI 4.4内核专用）
      # =========================
      - name: Integrate KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::KernelSU Integration"
          set -e
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5
          echo "KernelSU 集成完成"
          ls -la drivers/kernelsu/ 2>/dev/null || echo "⚠️ kernelsu 目录位置："
          find . -maxdepth 3 -name "kernelsu" -type d
          echo "::endgroup::"

      # =========================
      # 6️⃣ 关键预修复补丁（GCC/Clang 兼容老内核）
      # =========================
      - name: Apply compatibility patches
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "::group::Patch 1: dtc-lexer yylloc multiple definition"

          # 修复 yylloc/yylval 多重定义（GCC10+ 默认 -fno-common）
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            if [ -f "$f" ]; then
              if ! grep -q "extern YYLTYPE yylloc" "$f"; then
                sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
                sed -i 's/^YYSTYPE yylval;/extern YYSTYPE yylval;/' "$f"
              fi
            fi
          done

          # HOSTCFLAGS 加 -fcommon
          if ! grep -q "HOSTCFLAGS.*-fcommon" Makefile; then
            sed -i '/^HOSTCFLAGS/s/$/ -fcommon/' Makefile
          fi
          echo "✅ yylloc 补丁完成"
          echo "::endgroup::"

          echo "::group::Patch 2: 全局关闭 -Werror（警告不终止编译）"
          # 把所有 -Werror 替换为空，clang 对老内核代码会产生各种新警告
          find . -name "Makefile*" -exec sed -i 's/-Werror/-Wno-error/g' {} +
          # 再追加 -w（关闭所有警告）到 KBUILD_CFLAGS 和 KBUILD_AFLAGS
          if ! grep -q "KBUILD_CFLAGS += -w" Makefile; then
            sed -i '/^KBUILD_CFLAGS/a KBUILD_CFLAGS += -w -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration -Wno-incompatible-pointer-types' Makefile
          fi
          echo "✅ -Werror 已关闭"
          echo "::endgroup::"

          echo "::group::Patch 3: 禁用 VDSO32（避免32位兼容工具链链接问题）"
          # 小米6是arm64，我们不需要兼容32位VDSO，避免交叉工具链版本问题
          sed -i 's/CONFIG_VDSO32=y/# CONFIG_VDSO32 is not set/g' arch/arm64/configs/${{ env.KERNEL_CONFIG }} 2>/dev/null || true
          echo "✅ VDSO32 已禁用"
          echo "::endgroup::"

          echo "::group::Patch 4: KernelSU 源码加 -w，避免警告被当成错误"
          # KernelSU 代码在老 clang 下会有警告，强制关闭
          if [ -d drivers/kernelsu ]; then
            echo 'ccflags-y += -w -Wno-error' >> drivers/kernelsu/Makefile
            echo "✅ KernelSU ccflags 已添加"
          fi
          echo "::endgroup::"

      # =========================
      # 6.5️⃣ 清理构建目录（干净构建）
      # =========================
      - name: Clean kernel build
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          rm -rf out
          make mrproper 2>/dev/null || true

      # =========================
      # 7️⃣ 生成 Docker/LXC/KernelSU 配置片段
      # 注意：仅包含4.4内核真实存在的配置项
      # =========================
      - name: Generate feature config
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          cat > kernel_features.txt <<'EOF'
          # ========== Namespaces（容器隔离基础） ==========
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_USER_NS=y
          
          # ========== Cgroups（资源限制） ==========
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CGROUP_PIDS=y
          
          # ========== 网络（容器网络） ==========
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_NAT=y
          CONFIG_NF_NAT=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_NF_NAT_NEEDED=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_CONNTRACK_MARK=y
          
          # ========== 文件系统 ==========
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_KEYS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FANOTIFY=y
          CONFIG_FHANDLE=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          
          # ========== 安全 ==========
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_NETWORK=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITY_SELINUX_BOOTPARAM=y
          CONFIG_SECURITY_SELINUX_DISABLE=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_SECURITY_SELINUX_AVC_STATS=y
          
          # ========== Netfilter / iptables ==========
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_XTABLES=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_MANGLE=y
          CONFIG_IP_VS=y
          CONFIG_IP_VS_NFCT=y
          CONFIG_IP_VS_PROTO_TCP=y
          CONFIG_IP_VS_PROTO_UDP=y
          CONFIG_IP_VS_RR=y
          CONFIG_IP_VS_SH=y
          CONFIG_IP_VS_WRR=y
          
          # ========== KernelSU 依赖 ==========
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          
          # ========== 其他容器/系统必需项 ==========
          CONFIG_MMU=y
          CONFIG_SWAP=y
          CONFIG_FREEZER=y
          CONFIG_EVENTFD=y
          CONFIG_EPOLL=y
          CONFIG_UNIX=y
          CONFIG_INET=y
          CONFIG_IPV6=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          CONFIG_BINFMT_MISC=y
          CONFIG_CHECKPOINT_RESTORE=y
          CONFIG_MACVLAN=y
          CONFIG_VLAN_8021Q=y
          CONFIG_BRIDGE_VLAN_FILTERING=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IPV6_SUBTREES=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_NETFILTER_XT_MATCH_PHYSDEV=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_STATISTIC=y
          CONFIG_NETFILTER_XT_MATCH_STRING=y
          CONFIG_TASKSTATS=y
          CONFIG_TASK_DELAY_ACCT=y
          CONFIG_TASK_IO_ACCOUNTING=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_UNIX_DIAG=y
          CONFIG_MAGIC_SYSRQ=y
          CONFIG_PRINTK_TIME=y
          CONFIG_PACKET=y
          CONFIG_NETFILTER_XT_TARGET_TPROXY=y
          
          # ========== 禁用冲突项 ==========
          CONFIG_STRICT_MEMORY_RWX=n
          # CONFIG_DEBUG_INFO is not set
          EOF
          echo "Kernel features config generated:"
          wc -l kernel_features.txt

      # =========================
      # 8️⃣ 内核配置合并
      # =========================
      - name: Configure kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export O=out

          echo "::group::Loading defconfig"
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "::endgroup::"

          if [ -f ../kernel_features.txt ]; then
            echo "::group::Merging feature configs"
            sort -u ../kernel_features.txt > /tmp/feature_fragment.txt
            if [ -f scripts/kconfig/merge_config.sh ]; then
              scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/feature_fragment.txt
            else
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                [[ "$line" =~ ^[[:space:]]*# ]] && continue
                config_name=$(echo "$line" | cut -d'=' -f1)
                sed -i "/^${config_name}=/d; /^# ${config_name} is not set$/d" out/.config
                echo "$line" >> out/.config
              done < /tmp/feature_fragment.txt
            fi
            echo "::endgroup::"
          fi

          echo "::group::Finalize config"
          # 让Kconfig自动补齐依赖
          make O=out ARCH=arm64 olddefconfig
          echo "::endgroup::"

          echo "::group::Verify critical configs"
          echo "--- Namespaces ---"
          grep -E "CONFIG_(NAMESPACES|NET_NS|PID_NS|IPC_NS|UTS_NS|USER_NS)=" out/.config || echo "❌ 缺失"
          echo "--- Cgroups ---"
          grep -E "CONFIG_(CGROUPS|MEMCG|CGROUP_DEVICE|CPUSETS)=" out/.config || echo "❌ 缺失"
          echo "--- Network ---"
          grep -E "CONFIG_(VETH|BRIDGE|BRIDGE_NETFILTER|OVERLAY_FS)=" out/.config || echo "❌ 缺失"
          echo "--- KernelSU ---"
          grep -E "^CONFIG_KSU=|^CONFIG_KPROBES=" out/.config || echo "⚠️ KernelSU 配置状态需检查"
          echo "::endgroup::"

      # =========================
      # 9️⃣ 编译内核（彻底的错误日志输出）
      # =========================
      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

          CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang-proton"
          # 关键：把 proton-clang 的 bin 放在 PATH 最前面，
          # 让其自带的 ld.lld/llvm-ar/llvm-nm 优先于系统binutils
          export PATH="${CLANG_DIR}/bin:$PATH"

          echo "::group::Compiler info"
          echo "Clang: $CLANG_DIR/bin/clang"
          clang --version | head -2
          echo "LD = $(which ld.lld || which ld)"
          echo "AR = $(which llvm-ar || which ar)"
          echo "Python = $(which python) $(python --version 2>&1)"
          echo "::endgroup::"

          export KBUILD_BUILD_HOST=CI
          export KBUILD_BUILD_USER=MI6
          export ARCH=arm64
          export SUBARCH=arm64
          export O=out
          # HOSTCFLAGS/HOSTLDFLAGS 兜底
          export HOSTCFLAGS="-fcommon -O2 -w"
          export HOSTLDFLAGS=""

          echo "::group::Start kernel build (V=0, errors only via tee)"
          set +o pipefail
          set +e

          # 使用 Clang 编译 + GNU as 汇编（最稳定的4.4内核编译模式）
          # 关键：LD=ld.lld 使用LLVM链接器避免GNU ld 2.38 section对齐问题
          # 不加 LLVM=1 让汇编器走aarch64-linux-gnu-as
          time make -j$(nproc) O=out \
            CC="ccache clang" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ $BUILD_RC -ne 0 ]; then
            echo "❌ 编译失败！(exit code: $BUILD_RC)"
            echo ""
            echo "::group::🔴 错误行（所有含 error/undefined/Error/No such 的行）"
            # 抓取所有真正的错误行，不仅是行首的 error:
            grep -nE "(error:|undefined reference|Error [0-9]|No such file|fatal error|cannot find|ld:.*error|multiple definition)" build.log | grep -v " CC " | grep -v " HOSTCC " | tail -200
            echo "::endgroup::"
            echo ""
            echo "::group::🔴 make 报错前 50 行上下文"
            # 找到最后一个 *** 的位置，向前打印80行
            ERROR_LINE=$(grep -n "make.*\*\*\*" build.log | tail -1 | cut -d: -f1)
            if [ -n "$ERROR_LINE" ]; then
              echo "最后错误在第 $ERROR_LINE 行"
              START=$(( ERROR_LINE - 80 ))
              [ $START -lt 1 ] && START=1
              sed -n "${START},${ERROR_LINE}p" build.log
            else
              echo "（未找到 make 终止标记，打印最后 120 行）"
              tail -120 build.log
            fi
            echo "::endgroup::"
            exit $BUILD_RC
          fi

          echo "✅ 内核编译成功！"
          echo "::group::Built artifacts"
          ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "⚠️ boot目录不存在"
          echo "::endgroup::"

      # =========================
      # 1️⃣1️⃣ 打包内核（AnyKernel3）
      # =========================
      - name: Pack kernel
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          cd AnyKernel3
          # 小米6 (sagit) 专用适配
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=/dev/block/bootdevice/by-name/boot;!g' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=sagit/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=MCE16/g' anykernel.sh
          sed -i 's/device.name3=toroplus/device.name3=MCT1/g' anykernel.sh
          sed -i 's/device.name4=tuna/device.name4=MI6/g' anykernel.sh
          sed -i '/device.name5=/d' anykernel.sh

          for pat in "init.tuna.rc" "fstab.tuna" "replace_string init.rc" \
                     "insert_line init.tuna" "patch_fstab fstab.tuna" \
                     "append_file init.tuna" "append_file fstab.tuna" \
                     "bootscript" "usbdisk"; do
            sed -i "/${pat}/d" anykernel.sh 2>/dev/null
          done

          cat >> anykernel.sh <<'AKEOF'

          # MI6 custom
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.patch_vbmeta=0
          AKEOF

          cd ..

          IMAGE_FILE="${{ env.KERNEL_IMAGE_NAME }}"
          [ -z "$IMAGE_FILE" ] && IMAGE_FILE="Image.gz-dtb"
          if [ ! -f "android-kernel/out/arch/arm64/boot/${IMAGE_FILE}" ]; then
            echo "⚠️ ${IMAGE_FILE} 不存在，检测可用镜像..."
            ls -la android-kernel/out/arch/arm64/boot/
            for f in Image.gz-dtb Image.gz Image; do
              if [ -f "android-kernel/out/arch/arm64/boot/$f" ]; then
                IMAGE_FILE="$f"
                echo "使用 ${IMAGE_FILE}"
                break
              fi
            done
          fi

          cp android-kernel/out/arch/arm64/boot/${IMAGE_FILE} AnyKernel3/

          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          rm -f AnyKernel3/*.img AnyKernel3/zImage AnyKernel3/zImage-dtb

          echo "::group::AnyKernel3 content"
          ls -la AnyKernel3/
          echo "::endgroup::"

          cd AnyKernel3
          zip -r ../${{ env.KERNEL_ZIP_NAME }}.zip . -x "*.zip"
          cd ..
          echo "✅ 内核包已打包: ${{ env.KERNEL_ZIP_NAME }}.zip"
          ls -lh ${{ env.KERNEL_ZIP_NAME }}.zip

      # =========================
      # 1️⃣2️⃣ 上传内核包
      # =========================
      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/*.zip

      # =========================
      # 1️⃣3️⃣ 上传编译日志（不论成功失败都上传）
      # =========================
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-build-log
          path: kernel_workspace/android-kernel/build.log
          if-no-files-found: warn
