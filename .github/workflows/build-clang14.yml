      - name: 【兜底修复6-最终版】修复lsm_hook.c的hlist/list_head兼容问题（perl跨行处理）
        id: fix-lsm-hook-compat-final
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          LSM_FILE=drivers/kernelsu/hook/lsm_hook.c
      
          echo "========== 修复前状态 =========="
          echo "--- hlist_for_each_entry 残留 ---"
          grep -c "hlist_for_each_entry" $LSM_FILE || echo "0处"
          echo "--- ->lsm 残留 ---"
          grep -c "\->lsm" $LSM_FILE || echo "0处"
          echo "--- ->pprev 残留 ---"
          grep -c "\->pprev" $LSM_FILE || echo "0处"
          echo "========== 开始修复 =========="
      
          # 1. 使用 perl -0777 跨行替换 hlist_for_each_entry → list_for_each_entry
          perl -0777 -i -pe 's/hlist_for_each_entry\s*\(/list_for_each_entry(/g' $LSM_FILE
          perl -0777 -i -pe 's/hlist_for_each_entry_safe\s*\(/list_for_each_entry_safe(/g' $LSM_FILE
          echo "[✓] hlist_for_each_entry → list_for_each_entry（含跨行）"
      
          # 2. 替换 hlist 操作函数
          perl -0777 -i -pe 's/hlist_add_head_rcu/list_add_rcu/g' $LSM_FILE
          perl -0777 -i -pe 's/hlist_del_rcu/list_del_rcu/g' $LSM_FILE
          echo "[✓] hlist_add_head_rcu/hlist_del_rcu → list版本"
      
          # 3. 替换类型声明
          sed -i 's/struct hlist_head/struct list_head/g' $LSM_FILE
          sed -i 's/struct hlist_node/struct list_head/g' $LSM_FILE
          echo "[✓] 类型声明 hlist_head/hlist_node → list_head"
      
          # 4. 替换成员名
          sed -i 's/->pprev/->prev/g' $LSM_FILE
          sed -i 's/->first/->next/g' $LSM_FILE
          echo "[✓] pprev→prev, first→next"
      
          # 5. 处理 lsm 成员（4.4内核security_hook_list无此字段）
          # 先删除赋值语句
          sed -i '/->lsm\s*=/d' $LSM_FILE
          # 再将引用替换为 NULL
          sed -i 's/->lsm/NULL/g' $LSM_FILE
          echo "[✓] lsm成员引用已清除（赋值行删除，引用替换为NULL）"
      
          echo ""
