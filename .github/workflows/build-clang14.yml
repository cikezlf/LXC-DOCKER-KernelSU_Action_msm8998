            echo "[✓] ${{ env.KERNEL_IMAGE_NAME }} 已生成，大小：$(ls -lh "$IMAGE_PATH" | awk '{print $5}')"
          else
            echo "[✗] ${{ env.KERNEL_IMAGE_NAME }} 未生成"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十步校验通过"

      # ==================== 第十一步：打包 AnyKernel3 ====================
      - name: 【第十一步】打包 AnyKernel3 刷入包
        id: step11
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -d AnyKernel3 ]; then
            git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3.git
          fi
          cp "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}" AnyKernel3/
          cd AnyKernel3
          zip -r9 "${{ env.KERNEL_ZIP_NAME }}" . -x ".git/*" "README.md" "*.zip"
          mv "${{ env.KERNEL_ZIP_NAME }}" "$GITHUB_WORKSPACE/"
          echo "[✓] AnyKernel3 刷入包打包完成"

