name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      # ==================== 第一步：全局环境初始化 ====================
      - name: 【第一步】加载全局配置（逐行解析+格式清洗）
        id: step1
        run: |
          echo "=== 开始加载 config.env 全局配置 ==="
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
              echo "[✓] 已加载配置：$line"
            else
              echo "[⚠️ 跳过无效行：$line"
            fi
          done < config.env
          echo "[✓] 全局配置加载完成"
          echo "=== config.env 原始内容校验 ==="
          cat -A config.env

      - name: 【校验·第一步】确认环境变量完整性
        run: |
          echo "=== 第一步校验：环境变量完整性 ==="
          FAIL=0
          for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "[✗] 缺失环境变量：${var}"
              FAIL=1
            else
              echo "[✓] ${var} = ${val}"
            fi
          done
          if [ ! -f config.env ]; then
            echo "[✗] config.env 文件不存在"
            FAIL=1
          else
            echo "[✓] config.env 文件存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第一步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第一步校验通过，进入第二步"

      # ==================== 第二步：安装编译依赖 ====================
      - name: 【第二步】安装编译依赖
        id: step2
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[✓] 编译依赖安装完成"

      - name: 【校验·第二步】确认依赖安装成功
        run: |
          echo "=== 第二步校验：编译依赖完整性 ==="
          FAIL=0
          DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3")
          for dep in "${DEPS[@]}"; do
            if command -v "$dep" &> /dev/null; then
              echo "[✓] ${dep} 已安装"
            else
              echo "[✗] ${dep} 未安装"
              FAIL=1
            fi
          done
          # 条件检查：LLVM_CONFIG=y 时跳过 GCC 交叉编译器
          if [ "${{ env.LLVM_CONFIG }}" = "y" ]; then
            echo "[i] LLVM_CONFIG=y，使用 Clang 编译，跳过 GCC 交叉编译器检查"
          else
            for gcc in "aarch64-linux-gnu-gcc" "arm-linux-gnueabi-gcc"; do
              if command -v "$gcc" &> /dev/null; then
                echo "[✓] ${gcc} 已安装"
              else
                echo "[✗] ${gcc} 未安装"
                FAIL=1
              fi
            done
          fi
          if [ ! -d "$GITHUB_WORKSPACE/kernel_workspace" ]; then
            echo "[✗] kernel_workspace 目录未创建"
            FAIL=1
          else
            echo "[✓] kernel_workspace 目录已创建"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第二步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第二步校验通过，进入第三步"


      # ==================== 第三步：编译资源缓存 ====================
      - name: 【第三步】设置 Clang14 工具链缓存
        id: step3a
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: 【第三步】设置内核源码缓存
        id: step3b
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-${{ env.KERNEL_SOURCE_BRANCH }}

      - name: 【校验·第三步】确认缓存路径可写
        run: |
          echo "=== 第三步校验：缓存路径可写性 ==="
          FAIL=0
          for dir in "kernel_workspace/clang-aosp" "kernel_workspace/android-kernel"; do
            mkdir -p $GITHUB_WORKSPACE/${dir}
            if [ -w $GITHUB_WORKSPACE/${dir} ]; then
              echo "[✓] ${dir} 路径存在且可写"
            else
              echo "[✗] ${dir} 路径不可写"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第三步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第三步校验通过，进入第四步"

      # ==================== 第四步：拉取 AOSP Clang14 编译器 ====================
      - name: 【第四步】拉取 AOSP Clang14 编译器
        id: step4
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[✓] Clang14 工具链就绪"

      - name: 【校验·第四步】确认 Clang 可执行文件存在
        run: |
          echo "=== 第四步校验：Clang 编译器完整性 ==="
          FAIL=0
          CLANG_BIN=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin
          CLANG_FILES=("clang" "clang++" "lld" "llvm-ar" "llvm-nm" "llvm-objcopy" "llvm-objdump" "llvm-strip")
          if [ ! -d "$CLANG_BIN" ]; then
            echo "[✗] Clang bin 目录不存在：${CLANG_BIN}"
            FAIL=1
          else
            for f in "${CLANG_FILES[@]}"; do
              if [ -x ${CLANG_BIN}/${f} ]; then
                echo "[✓] ${f} 可执行"
              else
                echo "[✗] ${f} 缺失或不可执行"
                FAIL=1
              fi
            done
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第四步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第四步校验通过，进入第五步"

      # ==================== 第五步：拉取内核源码 ====================
      - name: 【第五步】拉取内核源码
        id: step5
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[✓] 内核源码就绪"

      - name: 【校验·第五步】确认内核源码关键文件存在
        run: |
          echo "=== 第五步校验：内核源码完整性 ==="
          FAIL=0
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel
          KEY_FILES=("Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build")
          for f in "${KEY_FILES[@]}"; do
            if [ -e ${KERNEL_DIR}/${f} ]; then
              echo "[✓] ${f} 存在"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ ! -d ${KERNEL_DIR}/.git ]; then
            echo "[✗] .git 目录缺失，源码可能未正确克隆"
            FAIL=1
          else
            echo "[✓] .git 目录存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第五步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第五步校验通过，进入第六步"

      # ==================== 第六步：生成基础内核配置 ====================
      - name: 【第六步】生成基础内核默认配置
        id: step6
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 基础内核配置生成完成"

      - name: 【校验·第六步】确认 .config 文件已生成且非空
        run: |
          echo "=== 第六步校验：基础内核配置 ==="
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "[✗] .config 文件不存在"
            FAIL=1
          elif [ ! -s "$CONFIG_FILE" ]; then
            echo "[✗] .config 文件为空"
            FAIL=1
          else
            LINE_COUNT=$(wc -l < "$CONFIG_FILE")
            echo "[✓] .config 文件存在，共 ${LINE_COUNT} 行"
            for cfg in "CONFIG_ARM64" "CONFIG_ARCH_SAGIT"; do
              if grep -q ^${cfg}=y "$CONFIG_FILE" 2>/dev/null; then
                echo "[✓] ${cfg}=y 已确认"
              fi
            done
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第六步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第六步校验通过，进入第七步"

      # ==================== 第七步：Docker/LXC 全量配置写入 ====================
      - name: 【第七步】写入 Docker/LXC 全量内核配置
        id: step7
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=kernel_workspace/android-kernel/out/.config
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q ^${clean_key}= "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
              sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
            else
              echo "$config" >> "$DEFCONFIG"
            fi
          }

          # ---------- IPC 进程间通信机制 ----------
          add_config "CONFIG_SYSCTL=y"
          add_config "CONFIG_SYSVIPC=y"
          add_config "CONFIG_POSIX_MQUEUE=y"

          # ---------- 核心命名空间支持 ----------
          add_config "CONFIG_NAMESPACES=y"
          add_config "CONFIG_PID_NS=y"
          add_config "CONFIG_UTS_NS=y"
          add_config "CONFIG_IPC_NS=y"
          add_config "CONFIG_USER_NS=y"
          add_config "CONFIG_NET_NS=y"
          add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"

          # ---------- Seccomp 安全计算模式 ----------
          add_config "CONFIG_SECCOMP=y"
          add_config "CONFIG_SECCOMP_FILTER=y"

          # ---------- Cgroup v1 全子系统支持 ----------
          add_config "CONFIG_CGROUPS=y"
          add_config "CONFIG_CGROUP_CPUACCT=y"
          add_config "CONFIG_CGROUP_DEVICE=y"
          add_config "CONFIG_CGROUP_FREEZER=y"
          add_config "CONFIG_CGROUP_SCHED=y"
          add_config "CONFIG_CPUSETS=y"
          add_config "CONFIG_MEMCG=y"
          add_config "CONFIG_MEMCG_SWAP=y"
          add_config "CONFIG_MEMCG_KMEM=y"
          add_config "CONFIG_BLK_CGROUP=y"
          add_config "CONFIG_CGROUP_PIDS=y"
          add_config "CONFIG_CGROUP_PERF=y"
          add_config "CONFIG_CFS_BANDWIDTH=y"
          add_config "CONFIG_FAIR_GROUP_SCHED=y"
          add_config "CONFIG_CGROUP_NET_PRIO=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"
          add_config "CONFIG_NET_CLS_CGROUP=y"
          add_config "CONFIG_BLK_DEV_THROTTLING=y"
          add_config "CONFIG_CGROUP_BPF=y"

          # ---------- 设备文件系统与固件加载 ----------
          add_config "CONFIG_DEVTMPFS=y"
          add_config "CONFIG_DEVTMPFS_MOUNT=y"
          add_config "CONFIG_FW_LOADER=y"
          add_config "CONFIG_FW_LOADER_USER_HELPER=y"
          add_config "CONFIG_FW_LOADER_COMPRESS=y"

          # ---------- Overlay 文件系统 ----------
          add_config "CONFIG_OVERLAY_FS=y"

          # ---------- Tmpfs 扩展属性 ----------
          add_config "CONFIG_TMPFS_XATTR=y"
          add_config "CONFIG_TMPFS_POSIX_ACL=y"

          # ---------- 容器文件系统全面支持 ----------
          add_config "CONFIG_EXT4_FS=y"
          add_config "CONFIG_EXT4_FS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS_SECURITY=y"
          add_config "CONFIG_BTRFS_FS=y"
          add_config "CONFIG_BTRFS_FS_POSIX_ACL=y"
          add_config "CONFIG_SQUASHFS=y"
          add_config "CONFIG_SQUASHFS_XATTR=y"

          # ---------- Docker 网络虚拟化 ----------
          add_config "CONFIG_VETH=y"
          add_config "CONFIG_BRIDGE=y"
          add_config "CONFIG_BRIDGE_NETFILTER=y"
          add_config "CONFIG_BRIDGE_VLAN_FILTERING=y"
          add_config "CONFIG_MACVLAN=y"
          add_config "CONFIG_IPVLAN=y"
          add_config "CONFIG_VXLAN=y"
          add_config "CONFIG_VLAN_8021Q=y"

          # ---------- 完整 NAT / Netfilter 框架 ----------
          add_config "CONFIG_NETFILTER=y"
          add_config "CONFIG_NETFILTER_ADVANCED=y"
          add_config "CONFIG_NF_CONNTRACK=y"
          add_config "CONFIG_NF_CONNTRACK_PROCFS=y"
          add_config "CONFIG_NF_CONNTRACK_NETLINK=y"
          add_config "CONFIG_NF_TABLES=y"
          add_config "CONFIG_NF_TABLES_IPV4=y"
          add_config "CONFIG_NF_TABLES_IPV6=y"
          add_config "CONFIG_NFT_CT=y"
          add_config "CONFIG_NFT_FIB=y"
          add_config "CONFIG_NFT_FIB_IPV4=y"
          add_config "CONFIG_NFT_FIB_IPV6=y"
          add_config "CONFIG_NFT_MASQ=y"
          add_config "CONFIG_NFT_NAT=y"
          add_config "CONFIG_NF_NAT=y"
          add_config "CONFIG_NF_NAT_NEEDED=y"
          add_config "CONFIG_NF_NAT_REDIRECT=y"
          add_config "CONFIG_IP_NF_FILTER=y"
          add_config "CONFIG_IP_NF_IPTABLES=y"
          add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_NF_TARGET_REDIRECT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_IPVS=y"
          add_config "CONFIG_NETFILTER_XT_MARK=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"

          # ---------- IPVS 负载均衡 ----------
          add_config "CONFIG_IP_VS=y"
          add_config "CONFIG_IP_VS_NFCT=y"
          add_config "CONFIG_IP_VS_PROTO_TCP=y"
          add_config "CONFIG_IP_VS_PROTO_UDP=y"
          add_config "CONFIG_IP_VS_RR=y"

          # ---------- IPv6 支持 ----------
          add_config "CONFIG_IPV6=y"
          add_config "CONFIG_IP6_NF_FILTER=y"
          add_config "CONFIG_IP6_NF_NAT=y"
          add_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"

          # ---------- 高级路由与多路由表 ----------
          add_config "CONFIG_IP_ADVANCED_ROUTER=y"
          add_config "CONFIG_IP_MULTIPLE_TABLES=y"

          # ---------- 传统兼容层 ----------
          add_config "CONFIG_NF_CONNTRACK_IPV4=y"
          add_config "CONFIG_NF_NAT_IPV4=y"
          add_config "CONFIG_IP_NF_NAT=y"

          # ---------- Unix 域套接字诊断 ----------
          add_config "CONFIG_UNIX_DIAG=y"
          add_config "CONFIG_PACKET_DIAG=y"
          add_config "CONFIG_NETLINK_DIAG=y"
          add_config "CONFIG_UNIX98_PTYS=y"

          # ---------- SCTP 协议 ----------
          add_config "CONFIG_IP_SCTP=y"

          # ---------- 透明大页 ----------
          add_config "CONFIG_HUGETLB_PAGE=y"
          add_config "CONFIG_HUGETLBFS=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"

          # ---------- 安全模块 ----------
          add_config "CONFIG_SECURITY=y"
          add_config "CONFIG_SECURITY_APPARMOR=y"
          add_config "CONFIG_FHANDLE=y"
          add_config "CONFIG_CHECKPOINT_RESTORE=y"

          # ---------- BPF ----------
          add_config "CONFIG_BPF=y"
          add_config "CONFIG_BPF_SYSCALL=y"
          add_config "CONFIG_BPF_JIT=y"

          # ---------- 内核模块支持 ----------
          add_config "CONFIG_MODULES=y"

          # ---------- 关闭 Android 网络限制 ----------
          add_config "# CONFIG_ANDROID_PARANOID_NETWORK is not set"

          echo "[✓] Docker/LXC 全量配置已写入最终编译配置文件"

      - name: 【校验·第七步】确认核心配置已写入 .config
        run: |
          echo "=== 第七步校验：Docker/LXC 核心配置写入验证 ==="
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          CORE_CONFIGS=(
            "CONFIG_NAMESPACES=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_USER_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_NETFILTER=y"
            "CONFIG_NF_NAT=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_SECURITY_APPARMOR=y"
            "CONFIG_BPF=y"
            "CONFIG_HUGETLB_PAGE=y"
            "CONFIG_HUGETLBFS=y"
            "CONFIG_CGROUP_HUGETLB=y"
          )
          for cfg in "${CORE_CONFIGS[@]}"; do
            if grep -q ^${cfg}$ "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg} 未写入"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第七步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第七步校验通过，进入第八步"

      # ==================== 第八步：cgroup 内核级自动挂载 ====================
      - name: 【第八步】写入 cgroup 内核自动挂载配置
        id: step8
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cat >> out/.config << 'EOF'
          CONFIG_CGROUP_AUTOMOUNT=y
          CONFIG_TMPFS=y
          CONFIG_HUGETLBFS=y
          CONFIG_CGROUP_HUGETLB=y
          EOF
          echo "[✓] 内核原生自动挂载开关已开启"

      - name: 【校验·第八步】确认 cgroup 自动挂载配置已追加
        run: |
          echo "=== 第八步校验：cgroup 自动挂载配置 ==="
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          for cfg in "CONFIG_CGROUP_AUTOMOUNT=y" "CONFIG_TMPFS=y" "CONFIG_HUGETLBFS=y" "CONFIG_CGROUP_HUGETLB=y"; do
            if grep -q ^${cfg}$ "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg} 未追加"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第八步校验通过，进入第八步续"

      - name: 【第八步续】写入 ramdisk 自动挂载脚本（含重试机制）
        id: step8b
        run: |
          cd $GITHUB_WORKSPACE
          INIT_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d
          RCS_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d
          mkdir -p "$INIT_DIR" "$RCS_DIR"
          cat > $INIT_DIR/auto-mount-cgroups.sh << 'MOUNT_SCRIPT'
          #!/bin/sh
          set -e
          MAX_RETRY=10
          RETRY_INTERVAL=10
          CGROUP_ROOT="/sys/fs/cgroup"

          check_subsystem_mounted() {
              mount | grep -q "cgroup on $CGROUP_ROOT/$1 type cgroup"
          }

          do_mount_cgroups() {
              mount -t tmpfs -o mode=755 tmpfs "$CGROUP_ROOT" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/devices"
              mount -t cgroup -o devices cgroup "$CGROUP_ROOT/devices" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/systemd"
              mount -t cgroup -o none,name=systemd cgroup "$CGROUP_ROOT/systemd" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/freezer"
              mount -t cgroup -o freezer cgroup "$CGROUP_ROOT/freezer" 2>/dev/null || true
          }

          retry=0
          while [ $retry -lt $MAX_RETRY ]; do
              do_mount_cgroups
              if check_subsystem_mounted devices && check_subsystem_mounted systemd && check_subsystem_mounted freezer; then
                  echo "[OK] cgroup 子系统自动挂载成功（尝试次数：$((retry+1))）"
                  exit 0
              fi
              retry=$((retry+1))
              sleep $RETRY_INTERVAL
          done
          echo "[FAIL] cgroup 挂载失败，已重试 $MAX_RETRY 次"
          exit 1
          MOUNT_SCRIPT
          chmod 755 $INIT_DIR/auto-mount-cgroups.sh
          ln -sf ../init.d/auto-mount-cgroups.sh $RCS_DIR/S99-auto-mount-cgroups.sh
          echo "[✓] ramdisk 自动挂载脚本（含 10 次重试）已就绪"

      - name: 【校验·第八步续】确认 ramdisk 脚本已正确部署
        run: |
          echo "=== 第八步续校验：ramdisk 挂载脚本 ==="
          FAIL=0
          SCRIPT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d/auto-mount-cgroups.sh
          SYMLINK=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d/S99-auto-mount-cgroups.sh
          if [ -f "$SCRIPT" ]; then
            echo "[✓] auto-mount-cgroups.sh 存在"
            if [ -x "$SCRIPT" ]; then
              echo "[✓] auto-mount-cgroups.sh 可执行"
            else
              echo "[✗] auto-mount-cgroups.sh 不可执行"
              FAIL=1
            fi
          else
            echo "[✗] auto-mount-cgroups.sh 不存在"
            FAIL=1
          fi
          if [ -L "$SYMLINK" ]; then
            echo "[✓] S99-auto-mount-cgroups.sh 符号链接存在"
          else
            echo "[✗] 符号链接缺失"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步续校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第八步续校验通过，进入第九步"

      # ==================== 第九步：KernelSU-Next 集成 ====================
      - name: 【第九步】部署 KernelSU-Next Legacy 驱动
        id: step9
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
          echo "[✓] KernelSU-Next Legacy 驱动部署完成"

      - name: 【校验·第九步】确认 KernelSU 配置已写入
        run: |
          echo "=== 第九步校验：KernelSU 配置 ==="
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if grep -q ^CONFIG_KSU=y "$CONFIG_FILE" 2>/dev/null; then
            echo "[✓] CONFIG_KSU=y 已写入"
          else
            echo "[✗] CONFIG_KSU=y 未写入"
            FAIL=1
          fi
          KSU_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/kernelsu
          if [ -d "$KSU_DIR" ]; then
            echo "[✓] KernelSU 驱动目录存在"
          else
            echo "[✗] KernelSU 驱动目录缺失"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第九步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第九步校验通过，进入第十步"

      # ==================== 第十步：内核配置同步 ====================
      - name: 【第十步】最终同步内核配置（olddefconfig）
        id: step10
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 olddefconfig
          echo "[✓] 最终内核配置同步完成"

      # ==================== 修复步骤：兼容Clang修复AppArmor变长数组 ====================
      - name: 【修复Clang兼容】处理AppArmor crypto.c变长数组编译错误
        id: clang-fix
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          # 备份
          cp security/apparmor/crypto.c security/apparmor/crypto.c.bak
          
          # 用 heredoc 传入 Python 代码
          python3 << 'PYEOF'
          import re
          with open('security/apparmor/crypto.c', 'r') as f:
              content = f.read()
          new_func = '''int aa_calc_sha256(const void *data, size_t len, u8 *hash)
          {
              struct shash_desc *desc;
              char *ctx;
              int err;
              ctx = kzalloc(crypto_shash_descsize(apparmor_tfm), GFP_KERNEL);
              if (!ctx)
                  return -ENOMEM;
              desc = (struct shash_desc *)ctx;
              desc->tfm = apparmor_tfm;
              err = crypto_shash_init(desc);
              if (err)
                  goto free_ctx;
              err = crypto_shash_update(desc, data, len);
              if (err)
                  goto free_ctx;
              err = crypto_shash_final(desc, hash);
          free_ctx:
              kfree(ctx);
              return err;
          }'''
          content = re.sub(r'int aa_calc_sha256.*?\n}', new_func, content, flags=re.DOTALL)
          with open('security/apparmor/crypto.c', 'w') as f:
              f.write(content)
          PYEOF
          
          # 校验修复结果
          if grep -q "char ctx\[crypto_shash_descsize" security/apparmor/crypto.c; then
            echo "[✗] 变长数组行仍然存在，修复失败"
            exit 1
          else
            echo "[✓] AppArmor Clang 兼容修复完成"
          fi


      - name: 【校验·第十步】确认 olddefconfig 后关键配置未被回退
        run: |
          echo "=== 第十步校验：olddefconfig 后关键配置留存 ==="
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          MUST_HAVE=(
            "CONFIG_NAMESPACES=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_USER_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_NETFILTER=y"
            "CONFIG_NF_NAT=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_SECURITY_APPARMOR=y"
            "CONFIG_BPF=y"
            "CONFIG_BPF_SYSCALL=y"
            "CONFIG_CGROUP_HUGETLB=y"
            "CONFIG_HUGETLBFS=y"
            "CONFIG_KSU=y"
          )
          for cfg in "${MUST_HAVE[@]}"; do
            if grep -q ^${cfg}$ "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg} 留存"
            else
              echo "[✗] ${cfg} 被回退"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十步校验失败：关键配置被 olddefconfig 回退，终止后续步骤"
            exit 1
          fi
          echo "✅ 第十步校验通过，进入第十一步"

      # ==================== 第十一步：LXC/Docker 配置完整性校验 ====================
      - name: 【第十一步】LXC/Docker 内核配置完整性校验
        id: step11
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "=== LXC/Docker 内核配置校验结果 ==="
          FAIL_COUNT=0
          for cfg in \
            CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS \
            CONFIG_USER_NS CONFIG_NET_NS CONFIG_CGROUPS CONFIG_MEMCG \
            CONFIG_BLK_CGROUP CONFIG_CGROUP_PIDS CONFIG_CGROUP_HUGETLB \
            CONFIG_NET_CLS_CGROUP CONFIG_CGROUP_NET_PRIO \
            CONFIG_BLK_DEV_THROTTLING CONFIG_OVERLAY_FS \
            CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NETFILTER \
            CONFIG_BRIDGE_VLAN_FILTERING CONFIG_MACVLAN CONFIG_VXLAN \
            CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_NF_NAT \
            CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_TARGET_MASQUERADE \
            CONFIG_NETFILTER_XT_MATCH_IPVS CONFIG_IP_VS \
            CONFIG_IP_VS_NFCT CONFIG_IP_VS_PROTO_UDP \
            CONFIG_SECCOMP CONFIG_SECCOMP_FILTER \
            CONFIG_SECURITY_APPARMOR CONFIG_IP_SCTP \
            CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_CHECKPOINT_RESTORE; do
            if grep -q ^${cfg}=y out/.config; then
              echo "[✓] 已启用 ${cfg}"
            else
              echo "[⚠️ 已丢失] ${cfg} —— 被 olddefconfig 自动关闭，需检查内核源码依赖"
              FAIL_COUNT=$((FAIL_COUNT+1))
            fi
          done
          echo ""
          if [ $FAIL_COUNT -gt 0 ]; then
            echo "❌ 校验失败：共 ${FAIL_COUNT} 个 LXC/Docker 必需选项被关闭，编译将终止"
            exit 1
          else
            echo "✅ 校验通过：所有 LXC/Docker 必需选项均已正确开启"
          fi



      # ==================== 第十二步：编译内核 ====================
      - name: 【第十二步】编译内核
        id: step12
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/lib:$LD_LIBRARY_PATH
          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) 2>&1 | tee build.log
          if [ ${PIPESTATUS} -ne 0 ]; then
            echo "❌ 内核编译失败，输出最后30行日志："
            tail -30 build.log
            exit 1
          fi
          echo "[✓] 内核编译完成"

      - name: 【校验·第十二步】确认内核镜像已生成
        run: |
          echo "=== 第十二步校验：内核镜像产物 ==="
          FAIL=0
          IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}
          if [ -f "$IMAGE_PATH" ]; then
            echo "[✓] 内核镜像已生成：$IMAGE_PATH"
            ls -lh "$IMAGE_PATH"
          else
            echo "[✗] 内核镜像未生成：$IMAGE_PATH"
            echo "=== 检查 out 目录产物 ==="
            find $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot -type f 2>/dev/null
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十二步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第十二步校验通过，进入第十三步"

      # ==================== 第十三步：打包内核ZIP ====================
      - name: 【第十三步】打包内核ZIP
        id: step13
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p kernel_workspace/release
          cp kernel_workspace/android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} kernel_workspace/release/
          cd kernel_workspace/release
          zip -r9 ${{ env.KERNEL_ZIP_NAME }} ${{ env.KERNEL_IMAGE_NAME }}
          echo "[✓] 内核ZIP打包完成：${{ env.KERNEL_ZIP_NAME }}"

      - name: 【校验·第十三步】确认ZIP包已生成
        run: |
          echo "=== 第十三步校验：ZIP打包产物 ==="
          FAIL=0
          ZIP_PATH=$GITHUB_WORKSPACE/kernel_workspace/release/${{ env.KERNEL_ZIP_NAME }}
          if [ -f "$ZIP_PATH" ]; then
            echo "[✓] ZIP包已生成：$ZIP_PATH"
            ls -lh "$ZIP_PATH"
          else
            echo "[✗] ZIP包未生成"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十三步校验失败，终止后续步骤"
            exit 1
          fi
          echo "✅ 第十三步校验通过，进入第十四步"

      # ==================== 第十四步：上传产物 ====================
      - name: 【第十四步】上传内核ZIP到Artifacts
        id: step14
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: ${{ github.workspace }}/kernel_workspace/release/${{ env.KERNEL_ZIP_NAME }}
          retention-days: 30

      - name: 【第十四步】上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/kernel_workspace/android-kernel/build.log
          retention-days: 30

      - name: 【校验·第十四步】确认上传完成
        run: |
          echo "=== 第十四步校验：产物上传 ==="
          echo "[✓] 内核ZIP已上传至 Actions Artifacts"
          echo "[✓] 编译日志已上传至 Actions Artifacts"
          echo "✅ 第十四步校验通过"

      # ==================== 第十五步：构建完成摘要 ====================
      - name: 【第十五步】构建完成摘要
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║     🎉 小米6内核构建全部完成！       ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📋 构建摘要："
          echo "  内核源码：${{ env.KERNEL_SOURCE }}"
          echo "  分支：${{ env.KERNEL_SOURCE_BRANCH }}"
          echo "  内核镜像：${{ env.KERNEL_IMAGE_NAME }}"
          echo "  产物名称：${{ env.KERNEL_ZIP_NAME }}"
          echo "  编译器：AOSP Clang 14 (r450784d)"
          echo "  功能特性："
          echo "    ✅ Docker 全量支持"
          echo "    ✅ LXC 容器支持"
          echo "    ✅ KernelSU 集成"
          echo "    ✅ AppArmor 安全模块"
          echo "    ✅ cgroup v1 全子系统"
          echo "    ✅ OverlayFS / VXLAN / IPVS"
          echo "    ✅ Seccomp + BPF"
          echo ""
          echo "📦 产物下载位置：Actions Artifacts"
          echo "   保留期限：30 天"
