              VERIFY_TOTAL=0
              VERIFY_PASS=0
              VERIFY_FAIL=0
      
              for cfg in "${MISS_LIST[@]}"; do
                  VERIFY_TOTAL=$((VERIFY_TOTAL + 1))
                  case "$cfg" in
                      "CONFIG_SECURITY_APPARMOR_BOOTPARAM_VALUE")
                          grep -qF "$macro_sabv" "$AUTOCONF" 2>/dev/null && VERIFY_PASS=$((VERIFY_PASS + 1)) && echo "  [✓] ${cfg} 注入成功" || { VERIFY_FAIL=$((VERIFY_FAIL + 1)); echo "  [✗] ${cfg} 注入失败！"; }
                          ;;
                      "CONFIG_LSM")
                          grep -qF '#define CONFIG_LSM' "$AUTOCONF" 2>/dev/null && VERIFY_PASS=$((VERIFY_PASS + 1)) && echo "  [✓] ${cfg} 注入成功" || { VERIFY_FAIL=$((VERIFY_FAIL + 1)); echo "  [✗] ${cfg} 注入失败！"; }
                          ;;
                      "CONFIG_ANDROID_PARANOID_NETWORK（反向修复）")
                          if ! grep -qF '#define CONFIG_ANDROID_PARANOID_NETWORK' "$AUTOCONF" 2>/dev/null; then
                              VERIFY_PASS=$((VERIFY_PASS + 1))
                              echo "  [✓] CONFIG_ANDROID_PARANOID_NETWORK 已正确移除"
                          else
                              VERIFY_FAIL=$((VERIFY_FAIL + 1))
                              echo "  [✗] CONFIG_ANDROID_PARANOID_NETWORK 移除失败！"
                          fi
                          ;;
                      *)
                          macro="#define ${cfg} 1"
                          if grep -qF "$macro" "$AUTOCONF" 2>/dev/null; then
                              VERIFY_PASS=$((VERIFY_PASS + 1))
                              echo "  [✓] ${cfg} 注入成功"
                          else
                              VERIFY_FAIL=$((VERIFY_FAIL + 1))
                              echo "  [✗] ${cfg} 注入失败！请检查写入权限"
                          fi
                          ;;
                  esac
              done
      
              echo ""
              echo "=============================================================="
              echo "第二轮注入校验结果：${VERIFY_PASS}/${VERIFY_TOTAL} 注入成功"
              if [ ${VERIFY_FAIL} -gt 0 ]; then
                  echo "⚠️  ${VERIFY_FAIL} 项注入失败！"
                  exit 1
              else
                  echo "✅ 所有缺失项注入成功，${PASS}/${TOTAL} → ${TOTAL}/${TOTAL} 全部通过"
              fi
              echo "=============================================================="
          else
              echo "✅ 无可注入项，${TOTAL}/${TOTAL} 全部通过，跳过第二轮校验"
          fi



          

      # ==================== 模块七：编译执行层 ====================
      - name: 【7-1】设置Clang编译环境变量
        id: setup-clang-env
        run: |
          CLANG_DIR=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d
          echo "CLANG_DIR=${CLANG_DIR}" >> $GITHUB_ENV
          echo "PATH=${CLANG_DIR}/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${CLANG_DIR}/lib:${CLANG_DIR}/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "[✓] Clang编译环境变量已设置"

      - name: 【7-2】执行内核编译（使用Clang14 + LLD）
        id: build-kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          CLANG_DIR=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d
          make O=out ARCH=arm64 \
            CC=${CLANG_DIR}/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=${CLANG_DIR}/bin/ld.lld \
            AR=${CLANG_DIR}/bin/llvm-ar \
            NM=${CLANG_DIR}/bin/llvm-nm \
            OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy \
            OBJDUMP=${CLANG_DIR}/bin/llvm-objdump \
            STRIP=${CLANG_DIR}/bin/llvm-strip \
            -j$(nproc --all) 2>&1 | tee build.log
          echo "[✓] 内核编译完成"

      - name: 【7-3】编译结果快速校验
        id: check-build-result
        run: |
          BUILD_LOG=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/build.log
          # 检查编译是否成功
          if grep -q "Kernel: arch/arm64/boot/Image.gz is ready" "$BUILD_LOG" 2>/dev/null || \
             grep -q "Kernel: arch/arm64/boot/Image.gz-dtb is ready" "$BUILD_LOG" 2>/dev/null; then
            echo "[✓] 内核编译成功，Image.gz-dtb 已生成"
          else
            echo "[✗] 编译失败，检查错误日志"
            tail -50 "$BUILD_LOG"
            exit 1
          fi
          # 检查是否有严重错误
          if grep -qi "error:" "$BUILD_LOG" 2>/dev/null; then
            echo "[!] 编译日志中存在错误信息，输出最后20行："
            grep -i "error:" "$BUILD_LOG" | tail -20
          fi
          # 检查是否有警告
          WARN_COUNT=$(grep -ci "warning:" "$BUILD_LOG" 2>/dev/null || echo 0)
          echo "[!] 编译警告总数：${WARN_COUNT}"

      - name: 【7-4】编译产物完整性校验
        id: verify-artifacts
        run: |
          OUT_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out
          FAIL=0
          # 检查内核镜像
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ] && [ -s "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" ]; then
            IMAGE_SIZE=$(du -h "$OUT_DIR/arch/arm64/boot/Image.gz-dtb" | cut -f1)
            echo "[✓] Image.gz-dtb 存在，大小：${IMAGE_SIZE}"
          else
            echo "[✗] Image.gz-dtb 缺失或为空"
            FAIL=1
          fi
          # 检查vmlinux（调试用）
          if [ -f "$OUT_DIR/vmlinux" ]; then
            echo "[✓] vmlinux 存在"
          else
            echo "[!] vmlinux 缺失（不影响刷机）"
          fi
          # 检查Device Tree Blob
          DTB_COUNT=$(find "$OUT_DIR/arch/arm64/boot/dts" -name "*.dtb" 2>/dev/null | wc -l)
          echo "[✓] 生成 ${DTB_COUNT} 个dtb文件"
          if [ $FAIL -eq 1 ]; then
            echo "❌ 编译产物校验失败"
            exit 1
          fi
          echo "✅ 编译产物完整性校验通过"

      - name: 【7-5】导出所有编译生成的内核模块
        id: export-modules
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 \
            INSTALL_MOD_PATH=./modules_install \
            INSTALL_MOD_STRIP=1 \
            modules_install
          MODULE_COUNT=$(find out/modules_install/lib/modules -name "*.ko" 2>/dev/null | wc -l)
          echo "[✓] 成功导出 ${MODULE_COUNT} 个内核ko模块"

      # ==================== 模块八：产物输出层 · 打包上传 ====================
      - name: 【8-1】拉取最新官方AnyKernel3模板
        id: pull-anykernel3
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3/.git ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
            echo "[✓] AnyKernel3官方模板拉取完成"
          else
            cd AnyKernel3 && git pull && echo "[✓] AnyKernel3已更新到最新版本"
          fi

      - name: 【8-2】适配小米6设备刷机配置
        id: adapt-anykernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          # 关闭设备强制校验，兼容所有小米6 LineageOS 20.0固件版本
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # 替换为小米6标准bootdevice分区路径
          sed -i 's!/dev/block/platform/omap/omap_hsmmc\.0!/dev/block/bootdevice!g' anykernel.sh
          # 关闭A/B插槽设备自动检测
          sed -i 's/is_slot_device=1;/is_slot_device=0;/g' anykernel.sh
          echo "[✓] 小米6设备刷机适配完成"

      - name: 【8-3】拷贝内核镜像与模块到打包目录
        id: copy-artifacts
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          KERNEL_SRC=android-kernel/out/arch/arm64/boot/Image.gz-dtb
          if [ -f "$KERNEL_SRC" ]; then
            cp "$KERNEL_SRC" AnyKernel3/
            echo "[✓] 内核镜像已拷贝到打包目录"
          else
            echo "[✗] 内核镜像不存在，无法完成打包"
            exit 1
          fi
          # 拷贝内核模块
          if [ -d "android-kernel/out/modules_install/lib/modules" ]; then
            mkdir -p AnyKernel3/modules
            cp -r android-kernel/out/modules_install/lib/modules/* AnyKernel3/modules/ 2>/dev/null
            echo "[✓] 内核模块已拷贝到打包目录"
          fi
          # 清理冗余文件
          rm -rf AnyKernel3/.git* AnyKernel3/README.md AnyKernel3/*.md
          rm -rf AnyKernel3/ramdisk AnyKernel3/path
          echo "[✓] 打包目录冗余文件清理完成"

      - name: 【8-4】生成最终可刷入zip包
        id: generate-flashable-zip
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          zip -r9 ${{ env.KERNEL_ZIP_NAME }} * -x .git .git/*
          ZIP_SIZE=$(du -h ${{ env.KERNEL_ZIP_NAME }} | cut -f1)
          echo "[✓] 最终可刷入内核zip包生成成功，大小：${ZIP_SIZE}"

      - name: 【8-5】将刷机包作为工作流产物上传
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_ZIP_NAME }}
          path: kernel_workspace/AnyKernel3/${{ env.KERNEL_ZIP_NAME }}
          retention-days: 30
          compression-level: 0

      - name: 【构建完成】全流程执行完成
        run: |
          echo "=============================================="
          echo "✅ 小米6全功能Docker/LXC/KernelSU内核构建完成"
          echo "构建产物可直接在小米6上通过TWRP刷入"
          echo "完美兼容LineageOS 20.0，刷入后Docker/LXC全功能激活"
          echo "=============================================="
  
