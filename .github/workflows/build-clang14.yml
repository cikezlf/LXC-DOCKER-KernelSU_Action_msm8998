name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, Linux, X64]
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      # ==================== 第一步：全局环境初始化 ====================
      - name: 【第一步】加载全局配置
        id: step1
        run: |
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
              echo "[✓] 已加载：$line"
            fi
          done < config.env
          echo "[✓] 全局配置加载完成"

      - name: 【校验·第一步】环境变量完整性
        run: |
          FAIL=0
          for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
            if [ -z "${!var}" ]; then
              echo "[✗] 缺失：${var}"
              FAIL=1
            else
              echo "[✓] ${var} = ${!var}"
            fi
          done
          if [ ! -f config.env ]; then
            echo "[✗] config.env 不存在"
            FAIL=1
          else
            echo "[✓] config.env 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第一步校验通过"

      # ==================== 第二步：安装编译依赖 新增ZFS用户态工具预装 ====================
      - name: 【第二步】安装编译依赖+ZFS全量预装
        id: step2
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi zfsutils-linux zfs-dkms
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[✓] 编译依赖 + ZFS用户态工具链(zfs/zpool命令)预装完成"

      - name: 【校验·第二步】依赖完整性 新增ZFS命令校验
        run: |
          FAIL=0
          DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3" "zfs" "zpool")
          for dep in "${DEPS[@]}"; do
            if command -v "$dep" &> /dev/null; then
              echo "[✓] ${dep}"
            else
              echo "[✗] ${dep} 未安装"
              FAIL=1
            fi
          done
          if [ ! -d "$GITHUB_WORKSPACE/kernel_workspace" ]; then
            echo "[✗] kernel_workspace 目录未创建"
            FAIL=1
          else
            echo "[✓] kernel_workspace 已创建"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第二步校验通过，zfs、zpool命令已预装就绪"

      # ==================== 第三步：资源缓存 ====================
      - name: 【第三步】Clang 工具链缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: 【第三步】内核源码缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-${{ env.KERNEL_SOURCE_BRANCH }}

      - name: 【校验·第三步】缓存路径可写
        run: |
          FAIL=0
          for dir in "kernel_workspace/clang-aosp" "kernel_workspace/android-kernel"; do
            mkdir -p $GITHUB_WORKSPACE/${dir}
            if [ -w $GITHUB_WORKSPACE/${dir} ]; then
              echo "[✓] ${dir} 可写"
            else
              echo "[✗] ${dir} 不可写"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第三步校验通过"

      # ==================== 第四步：拉取 Clang14 ====================
      - name: 【第四步】拉取 AOSP Clang14
        id: step4
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[✓] Clang14 工具链就绪"

      - name: 【校验·第四步】Clang 可执行文件
        run: |
          FAIL=0
          CLANG_BIN=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin
          for f in clang clang++ lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x ${CLANG_BIN}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第四步校验失败，终止"
            exit 1
          fi
          echo "✅ 第四步校验通过"



      # ==================== 第五步：拉取内核源码 ====================
      - name: 【第五步】拉取内核源码
        id: step5
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[✓] 内核源码就绪"

      - name: 【校验·第五步】源码完整性
        run: |
          FAIL=0
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel
          for f in "Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build"; do
            if [ -e ${KERNEL_DIR}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ ! -d ${KERNEL_DIR}/.git ]; then
            echo "[✗] .git 缺失"
            FAIL=1
          else
            echo "[✓] .git 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第五步校验通过"

      # ==================== 第六步：生成基础配置 ====================
      - name: 【第六步】生成基础内核配置
        id: step6
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 基础配置生成完成"

      - name: 【校验·第六步】.config 文件
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if [ ! -f "$CONFIG_FILE" ] || [ ! -s "$CONFIG_FILE" ]; then
            echo "[✗] .config 不存在或为空"
            FAIL=1
          else
            echo "[✓] .config 存在，$(wc -l < "$CONFIG_FILE") 行"
            grep -q ^CONFIG_ARM64=y "$CONFIG_FILE" && echo "[✓] CONFIG_ARM64=y"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第六步校验失败，终止"
            exit 1
          fi
          echo "✅ 第六步校验通过"




# ============================================================
# 第七步：写入 Docker/LXC 全量配置 + 全量校验
# 新增ZFS完整依赖 + 6项重点缺失项强制写入
# ============================================================
      - name: 【第七步】写入Docker/LXC/ZFS全量配置+全量校验
        run: |
          DEFCONFIG="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config"
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
              sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
            else
              echo "$config" >> "$DEFCONFIG"
            fi
          }

          echo "===== 1. 核心依赖与架构 ====="
          add_config "CONFIG_MMU=y"
          add_config "CONFIG_MODULES=y"
          add_config "CONFIG_BLK_DEV=y"
          add_config "CONFIG_BLOCK=y"
          add_config "CONFIG_CRYPTO=y"
          add_config "CONFIG_CRYPTO_SHA256=y"
          add_config "CONFIG_CRYPTO_SHA512=y"
          add_config "CONFIG_CRYPTO_AES=y"
          add_config "CONFIG_KALLSYMS=y"

          echo "===== 2. 命名空间（全量）====="
          add_config "CONFIG_NAMESPACES=y"
          add_config "CONFIG_PID_NS=y"
          add_config "CONFIG_UTS_NS=y"
          add_config "CONFIG_IPC_NS=y"
          add_config "CONFIG_USER_NS=y"
          add_config "CONFIG_NET_NS=y"

          echo "===== 3. 控制组（全量）重点修复缺失CONFIG_CGROUP_HUGETLB ====="
          add_config "CONFIG_CGROUPS=y"
          add_config "CONFIG_CGROUP_CPUACCT=y"
          add_config "CONFIG_CGROUP_DEVICE=y"
          add_config "CONFIG_CGROUP_FREEZER=y"
          add_config "CONFIG_CGROUP_SCHED=y"
          add_config "CONFIG_CPUSETS=y"
          add_config "CONFIG_MEMCG=y"
          add_config "CONFIG_MEMCG_SWAP=y"
          add_config "CONFIG_MEMCG_KMEM=y"
          add_config "CONFIG_BLK_CGROUP=y"
          add_config "CONFIG_CGROUP_PIDS=y"
          add_config "CONFIG_CGROUP_PERF=y"
          add_config "CONFIG_CFS_BANDWIDTH=y"
          add_config "CONFIG_FAIR_GROUP_SCHED=y"
          add_config "CONFIG_CGROUP_NET_PRIO=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"
          add_config "CONFIG_NET_CLS_CGROUP=y"
          add_config "CONFIG_BLK_DEV_THROTTLING=y"
          add_config "CONFIG_CGROUP_BPF=y"

          echo "===== 4. 网络驱动与过滤（全量）重点修复Nft Fib全系列缺失 ====="
          add_config "CONFIG_VETH=y"
          add_config "CONFIG_BRIDGE=y"
          add_config "CONFIG_BRIDGE_NETFILTER=y"
          add_config "CONFIG_MACVLAN=y"
          add_config "CONFIG_IPVLAN=y"
          add_config "CONFIG_VXLAN=y"
          add_config "CONFIG_VLAN_8021Q=y"
          add_config "CONFIG_NETFILTER=y"
          add_config "CONFIG_NETFILTER_ADVANCED=y"
          add_config "CONFIG_NF_CONNTRACK=y"
          add_config "CONFIG_NF_TABLES=y"
          add_config "CONFIG_NF_TABLES_IPV4=y"
          add_config "CONFIG_NF_TABLES_IPV6=y"
          add_config "CONFIG_NFT_MASQ=y"
          add_config "CONFIG_NFT_NAT=y"
          add_config "CONFIG_NF_NAT=y"
          add_config "CONFIG_NF_NAT_REDIRECT=y"
          add_config "CONFIG_IP_NF_FILTER=y"
          add_config "CONFIG_IP_NF_IPTABLES=y"
          add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_NF_NAT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
          add_config "CONFIG_NETFILTER_XT_MARK=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_VS=y"
          add_config "CONFIG_IP_VS_NFCT=y"
          add_config "CONFIG_IP_VS_PROTO_TCP=y"
          add_config "CONFIG_IP_VS_PROTO_UDP=y"
          add_config "CONFIG_IP_VS_RR=y"
          add_config "CONFIG_IPV6=y"
          add_config "CONFIG_IP6_NF_FILTER=y"
          add_config "CONFIG_IP6_NF_NAT=y"
          add_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_IPVS=y"
          add_config "CONFIG_IP_SCTP=y"
          add_config "CONFIG_NFT_CT=y"
          add_config "CONFIG_NFT_FIB=y"
          add_config "CONFIG_NFT_FIB_IPV4=y"
          add_config "CONFIG_NFT_FIB_IPV6=y"
          add_config "CONFIG_BRIDGE_VLAN_FILTERING=y"

          echo "===== 5. 存储与文件系统（全量）重点修复缺失CONFIG_DEVPTS_MULTIPLE_INSTANCES ====="
          add_config "CONFIG_OVERLAY_FS=y"
          add_config "CONFIG_EXT4_FS=y"
          add_config "CONFIG_EXT4_FS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS_SECURITY=y"
          add_config "CONFIG_BTRFS_FS=y"
          add_config "CONFIG_BTRFS_FS_POSIX_ACL=y"
          add_config "CONFIG_SQUASHFS=y"
          add_config "CONFIG_SQUASHFS_XATTR=y"
          add_config "CONFIG_TMPFS_XATTR=y"
          add_config "CONFIG_TMPFS_POSIX_ACL=y"
          add_config "CONFIG_FW_LOADER=y"
          add_config "CONFIG_DEVTMPFS=y"
          add_config "CONFIG_DEVTMPFS_MOUNT=y"
          add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"

          echo "===== 6. 安全机制（全量）====="
          add_config "CONFIG_SECCOMP=y"
          add_config "CONFIG_SECCOMP_FILTER=y"
          add_config "CONFIG_SECURITY_APPARMOR=y"
          add_config "CONFIG_BPF=y"
          add_config "CONFIG_BPF_SYSCALL=y"
          add_config "CONFIG_BPF_JIT=y"
          add_config "CONFIG_CGROUP_BPF=y"

          echo "===== 7. 进程间通信与通用功能 ====="
          add_config "CONFIG_SYSVIPC=y"
          add_config "CONFIG_POSIX_MQUEUE=y"
          add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
          add_config "CONFIG_FHANDLE=y"

          echo "===== 8. 容器热迁移与功能修复 ====="
          add_config "CONFIG_CHECKPOINT_RESTORE=y"
          add_config "# CONFIG_ANDROID_PARANOID_NETWORK is not set"

          echo "===== 9. 新增ZFS完整支持 核心修复/dev/zfs缺失 ====="
          add_config "CONFIG_ZFS=y"
          add_config "CONFIG_ZFS_POSIX_ACL=y"
          add_config "CONFIG_ZFS_XATTR=y"
          add_config "CONFIG_ZFS_DEBUG=n"

          echo "[✓] Docker/LXC/ZFS全量配置写入完成"

          # ===== 全量校验 =====
          echo ""
          echo "===== 开始Docker/LXC/ZFS全量配置校验 ====="
          FAIL=0
          TOTAL=0
          PASS=0
          ALL_CHECKS=(
            "CONFIG_MMU=y"
            "CONFIG_MODULES=y"
            "CONFIG_BLK_DEV=y"
            "CONFIG_BLOCK=y"
            "CONFIG_CRYPTO=y"
            "CONFIG_CRYPTO_SHA256=y"
            "CONFIG_CRYPTO_SHA512=y"
            "CONFIG_CRYPTO_AES=y"
            "CONFIG_NAMESPACES=y"
            "CONFIG_PID_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_CGROUP_CPUACCT=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_SCHED=y"
            "CONFIG_CPUSETS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_MEMCG_SWAP=y"
            "CONFIG_MEMCG_KMEM=y"
            "CONFIG_BLK_CGROUP=y"
            "CONFIG_CGROUP_PIDS=y"
            "CONFIG_CGROUP_PERF=y"
            "CONFIG_CFS_BANDWIDTH=y"
            "CONFIG_FAIR_GROUP_SCHED=y"
            "CONFIG_CGROUP_NET_PRIO=y"
            "CONFIG_CGROUP_HUGETLB=y"
            "CONFIG_NET_CLS_CGROUP=y"
            "CONFIG_BLK_DEV_THROTTLING=y"
            "CONFIG_CGROUP_BPF=y"
            "CONFIG_VETH=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_BRIDGE_NETFILTER=y"
            "CONFIG_MACVLAN=y"
            "CONFIG_IPVLAN=y"
            "CONFIG_VXLAN=y"
            "CONFIG_VLAN_8021Q=y"
            "CONFIG_NETFILTER=y"
            "CONFIG_NETFILTER_ADVANCED=y"
            "CONFIG_NF_CONNTRACK=y"
            "CONFIG_NF_TABLES=y"
            "CONFIG_NF_TABLES_IPV4=y"
            "CONFIG_NF_TABLES_IPV6=y"
            "CONFIG_NFT_MASQ=y"
            "CONFIG_NFT_NAT=y"
            "CONFIG_NF_NAT=y"
            "CONFIG_NF_NAT_REDIRECT=y"
            "CONFIG_IP_NF_FILTER=y"
            "CONFIG_IP_NF_IPTABLES=y"
            "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_IP_NF_NAT=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
            "CONFIG_NETFILTER_XT_MARK=y"
            "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
            "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
            "CONFIG_IP_VS=y"
            "CONFIG_IP_VS_NFCT=y"
            "CONFIG_IP_VS_PROTO_TCP=y"
            "CONFIG_IP_VS_PROTO_UDP=y"
            "CONFIG_IP_VS_RR=y"
            "CONFIG_IPV6=y"
            "CONFIG_IP6_NF_FILTER=y"
            "CONFIG_IP6_NF_NAT=y"
            "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            "CONFIG_NETFILTER_XT_MATCH_IPVS=y"
            "CONFIG_IP_SCTP=y"
            "CONFIG_NFT_CT=y"
            "CONFIG_NFT_FIB=y"
            "CONFIG_NFT_FIB_IPV4=y"
            "CONFIG_NFT_FIB_IPV6=y"
            "CONFIG_BRIDGE_VLAN_FILTERING=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_EXT4_FS=y"
            "CONFIG_EXT4_FS_POSIX_ACL=y"
            "CONFIG_EXT4_FS_SECURITY=y"
            "CONFIG_BTRFS_FS=y"
            "CONFIG_BTRFS_FS_POSIX_ACL=y"
            "CONFIG_SQUASHFS=y"
            "CONFIG_SQUASHFS_XATTR=y"
            "CONFIG_TMPFS_XATTR=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_FW_LOADER=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_DEVTMPFS_MOUNT=y"
            "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
            "CONFIG_SECCOMP=y"
            "CONFIG_SECCOMP_FILTER=y"
            "CONFIG_SECURITY_APPARMOR=y"
            "CONFIG_BPF=y"
            "CONFIG_BPF_SYSCALL=y"
            "CONFIG_BPF_JIT=y"
            "CONFIG_CGROUP_BPF=y"
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_FHANDLE=y"
            "CONFIG_CHECKPOINT_RESTORE=y"
            "CONFIG_ZFS=y"
            "CONFIG_ZFS_POSIX_ACL=y"
            "CONFIG_ZFS_XATTR=y"
          )

          for check in "${ALL_CHECKS[@]}"; do
            TOTAL=$((TOTAL + 1))
            if grep -q "^${check}$" "$DEFCONFIG" 2>/dev/null; then
              PASS=$((PASS + 1))
            else
              echo "  [✗] ${check} 校验失败，未生效"
              FAIL=1
            fi
          done

          echo ""
          echo "Docker/LXC 全量配置校验结果：${PASS}/${TOTAL} 通过"
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第七步校验未通过，存在Docker/LXC/ZFS必需配置缺失，终止构建"
            exit 1
          fi
          echo "✅ 第七步校验通过，全部 ${TOTAL} 项配置已锁定生效"

      # ==================== 第九步：KernelSU-Next ====================
      - name: 【第九步】部署 KernelSU-Next Legacy
        id: step9
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
          echo "[✓] KernelSU-Next 部署完成"

      - name: 【校验·第九步】KernelSU 配置确认
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          grep -q "^CONFIG_KSU=y$" "$CONFIG_FILE" 2>/dev/null && echo "[✓] CONFIG_KSU=y" || { echo "[✗] CONFIG_KSU=y 缺失"; FAIL=1; }
          [ -d "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/kernelsu" ] && echo "[✓] KernelSU 驱动目录存在" || { echo "[✗] 驱动目录缺失"; FAIL=1; }
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第九步校验失败，终止"
            exit 1
          fi
          echo "✅ 第九步校验通过"


      # ==================== 新增：独立非交互式olddefconfig同步，提前解析所有配置依赖 ====================
      - name: 【前置同步】非交互式全量依赖预同步，提前消化Kconfig所有配置变更
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          yes "" | make O=out ARCH=arm64 olddefconfig
          echo "[✓] 预同步完成，所有配置依赖关系已提前解析，无任何交互式弹窗"



      # ============================================================
      # 第十步后置：olddefconfig 同步后二次强制锁定 + 全量校验
      # 核心针对6项上报缺失配置做三层兜底修复
      # ============================================================
      - name: 【第十步后置】olddefconfig同步后二次强制锁定+核心缺失项三层兜底修复
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=kernel_workspace/android-kernel/out/.config
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
