          for cfg in \
            CONFIG_CRYPTO_SHA256=y \
            CONFIG_CRYPTO_SHA512=y \
            CONFIG_CRYPTO_AES=y \
            CONFIG_CRYPTO_CBC=y \
            CONFIG_CRYPTO_ECB=y \
            CONFIG_CRYPTO_XTS=y \
            CONFIG_CRYPTO_CRC32C=y \
            CONFIG_CRYPTO_CRC32=y; do
            TOTAL=$((TOTAL + 1))
            if grep -q "^${cfg}$" "$DEFCONFIG" 2>/dev/null; then
              PASS=$((PASS + 1))
            else
              echo "  [✗] ${cfg} 缺失 —— 加密算法"
              FAIL=1
            fi
          done
  
          # ===== 第13类：Docker特定依赖（6项）=====
          echo ""
          echo "--- 13. Docker特定依赖 ---"
          for cfg in \
            CONFIG_IP_NF_TARGET_REDIRECT=y \
            CONFIG_BRIDGE_EBT_BROUTE=y \
            CONFIG_BRIDGE_EBT_T_FILTER=y \
            CONFIG_BRIDGE_EBT_T_NAT=y \
            CONFIG_BRIDGE_EBT_ARP=y \
            CONFIG_BRIDGE_EBT_IP=y \
            CONFIG_BRIDGE_EBT_IP6=y; do
            TOTAL=$((TOTAL + 1))
            if grep -q "^${cfg}$" "$DEFCONFIG" 2>/dev/null; then
              PASS=$((PASS + 1))
            else
              echo "  [✗] ${cfg} 缺失 —— Docker网络桥接"
              FAIL=1
            fi
          done
  
          echo ""
          echo "=============================================================="
          echo "Docker/LXC 全量配置编译前最终校验结果：${PASS}/${TOTAL} 通过"
          echo "=============================================================="
  
          if [ $FAIL -eq 1 ]; then
            echo "❌ Docker/LXC全量配置校验未通过，共 $((TOTAL - PASS)) 项缺失，终止编译"
            echo "请回到config.env配置步骤，确保所有缺失项均已正确写入defconfig"
            exit 1
          fi
          echo "✅ Docker/LXC全量配置编译前最终校验全部通过，共计 ${PASS} 项配置正确，可以安全开始编译"


  
