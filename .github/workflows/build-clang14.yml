          printf '#endif\n' >> $TARGET_FILE
          printf '#ifndef p4d_none\n' >> $TARGET_FILE
          printf '#define p4d_none(p4d) (0)\n' >> $TARGET_FILE
          printf '#endif\n' >> $TARGET_FILE
          printf '#ifndef pgd_offset_k\n' >> $TARGET_FILE
          printf '#define pgd_offset_k(addr) pgd_offset(&init_mm, (addr))\n' >> $TARGET_FILE
