name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      # ==================== 第一步：全局环境初始化 ====================
      - name: 【第一步】加载全局配置
        id: step1
        run: |
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
              echo "[✓] 已加载：$line"
            fi
          done < config.env
          echo "[✓] 全局配置加载完成"

      - name: 【校验·第一步】环境变量完整性
        run: |
          FAIL=0
          for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
            if [ -z "${!var}" ]; then
              echo "[✗] 缺失：${var}"
              FAIL=1
            else
              echo "[✓] ${var} = ${!var}"
            fi
          done
          if [ ! -f config.env ]; then
            echo "[✗] config.env 不存在"
            FAIL=1
          else
            echo "[✓] config.env 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第一步校验通过"

      # ==================== 第二步：安装编译依赖 ====================
      - name: 【第二步】安装编译依赖
        id: step2
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[✓] 编译依赖安装完成"

      - name: 【校验·第二步】依赖完整性
        run: |
          FAIL=0
          DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3")
          for dep in "${DEPS[@]}"; do
            if command -v "$dep" &> /dev/null; then
              echo "[✓] ${dep}"
            else
              echo "[✗] ${dep} 未安装"
              FAIL=1
            fi
          done
          if [ ! -d "$GITHUB_WORKSPACE/kernel_workspace" ]; then
            echo "[✗] kernel_workspace 目录未创建"
            FAIL=1
          else
            echo "[✓] kernel_workspace 已创建"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第二步校验通过"

      # ==================== 第三步：资源缓存 ====================
      - name: 【第三步】Clang 工具链缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: 【第三步】内核源码缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-${{ env.KERNEL_SOURCE_BRANCH }}

      - name: 【校验·第三步】缓存路径可写
        run: |
          FAIL=0
          for dir in "kernel_workspace/clang-aosp" "kernel_workspace/android-kernel"; do
            mkdir -p $GITHUB_WORKSPACE/${dir}
            if [ -w $GITHUB_WORKSPACE/${dir} ]; then
              echo "[✓] ${dir} 可写"
            else
              echo "[✗] ${dir} 不可写"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第三步校验通过"

      # ==================== 第四步：拉取 Clang14 ====================
      - name: 【第四步】拉取 AOSP Clang14
        id: step4
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[✓] Clang14 工具链就绪"

      - name: 【校验·第四步】Clang 可执行文件
        run: |
          FAIL=0
          CLANG_BIN=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin
          for f in clang clang++ lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x ${CLANG_BIN}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第四步校验失败，终止"
            exit 1
          fi
          echo "✅ 第四步校验通过"

      # ==================== 第五步：拉取内核源码 ====================
      - name: 【第五步】拉取内核源码
        id: step5
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[✓] 内核源码就绪"

      - name: 【校验·第五步】源码完整性
        run: |
          FAIL=0
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel
          for f in "Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build"; do
            if [ -e ${KERNEL_DIR}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ ! -d ${KERNEL_DIR}/.git ]; then
            echo "[✗] .git 缺失"
            FAIL=1
          else
            echo "[✓] .git 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第五步校验通过"

      # ==================== 第六步：生成基础配置 ====================
      - name: 【第六步】生成基础内核配置
        id: step6
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 基础配置生成完成"

      - name: 【校验·第六步】.config 文件
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if [ ! -f "$CONFIG_FILE" ] || [ ! -s "$CONFIG_FILE" ]; then
            echo "[✗] .config 不存在或为空"
            FAIL=1
          else
            echo "[✓] .config 存在，$(wc -l < "$CONFIG_FILE") 行"
            grep -q ^CONFIG_ARM64=y "$CONFIG_FILE" && echo "[✓] CONFIG_ARM64=y"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第六步校验失败，终止"
            exit 1
          fi
          echo "✅ 第六步校验通过"

      # ==================== 第七步：Docker/LXC 全量配置 ====================
      - name: 【第七步】写入 Docker/LXC 全量配置
        id: step7
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=kernel_workspace/android-kernel/out/.config
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
              sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
            else
              echo "$config" >> "$DEFCONFIG"
            fi
          }
          add_config "CONFIG_SYSVIPC=y"
          add_config "CONFIG_POSIX_MQUEUE=y"
          add_config "CONFIG_NAMESPACES=y"
          add_config "CONFIG_PID_NS=y"
          add_config "CONFIG_UTS_NS=y"
          add_config "CONFIG_IPC_NS=y"
          add_config "CONFIG_USER_NS=y"
          add_config "CONFIG_NET_NS=y"
          add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
          add_config "CONFIG_SECCOMP=y"
          add_config "CONFIG_SECCOMP_FILTER=y"
          add_config "CONFIG_CGROUPS=y"
          add_config "CONFIG_CGROUP_CPUACCT=y"
          add_config "CONFIG_CGROUP_DEVICE=y"
          add_config "CONFIG_CGROUP_FREEZER=y"
          add_config "CONFIG_CGROUP_SCHED=y"
          add_config "CONFIG_CPUSETS=y"
          add_config "CONFIG_MEMCG=y"
          add_config "CONFIG_MEMCG_SWAP=y"
          add_config "CONFIG_MEMCG_KMEM=y"
          add_config "CONFIG_BLK_CGROUP=y"
          add_config "CONFIG_CGROUP_PIDS=y"
          add_config "CONFIG_CGROUP_PERF=y"
          add_config "CONFIG_CFS_BANDWIDTH=y"
          add_config "CONFIG_FAIR_GROUP_SCHED=y"
          add_config "CONFIG_CGROUP_NET_PRIO=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"
          add_config "CONFIG_NET_CLS_CGROUP=y"
          add_config "CONFIG_BLK_DEV_THROTTLING=y"
          add_config "CONFIG_CGROUP_BPF=y"
          add_config "CONFIG_DEVTMPFS=y"
          add_config "CONFIG_DEVTMPFS_MOUNT=y"
          add_config "CONFIG_FW_LOADER=y"
          add_config "CONFIG_FW_LOADER_USER_HELPER=y"
          add_config "CONFIG_OVERLAY_FS=y"
          add_config "CONFIG_TMPFS_XATTR=y"
          add_config "CONFIG_TMPFS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS=y"
          add_config "CONFIG_EXT4_FS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS_SECURITY=y"
          add_config "CONFIG_BTRFS_FS=y"
          add_config "CONFIG_BTRFS_FS_POSIX_ACL=y"
          add_config "CONFIG_SQUASHFS=y"
          add_config "CONFIG_SQUASHFS_XATTR=y"
          add_config "CONFIG_VETH=y"
          add_config "CONFIG_BRIDGE=y"
          add_config "CONFIG_BRIDGE_NETFILTER=y"
          add_config "CONFIG_MACVLAN=y"
          add_config "CONFIG_IPVLAN=y"
          add_config "CONFIG_VXLAN=y"
          add_config "CONFIG_VLAN_8021Q=y"
          add_config "CONFIG_NETFILTER=y"
          add_config "CONFIG_NETFILTER_ADVANCED=y"
          add_config "CONFIG_NF_CONNTRACK=y"
          add_config "CONFIG_NF_TABLES=y"
          add_config "CONFIG_NF_TABLES_IPV4=y"
          add_config "CONFIG_NF_TABLES_IPV6=y"
          add_config "CONFIG_NFT_MASQ=y"
          add_config "CONFIG_NFT_NAT=y"
          add_config "CONFIG_NF_NAT=y"
          add_config "CONFIG_NF_NAT_REDIRECT=y"
          add_config "CONFIG_IP_NF_FILTER=y"
          add_config "CONFIG_IP_NF_IPTABLES=y"
          add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_NF_NAT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
          add_config "CONFIG_NETFILTER_XT_MARK=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_VS=y"
          add_config "CONFIG_IP_VS_NFCT=y"
          add_config "CONFIG_IP_VS_PROTO_TCP=y"
          add_config "CONFIG_IP_VS_PROTO_UDP=y"
          add_config "CONFIG_IP_VS_RR=y"
          add_config "CONFIG_IPV6=y"
          add_config "CONFIG_IP6_NF_FILTER=y"
          add_config "CONFIG_IP6_NF_NAT=y"
          add_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_SECURITY_APPARMOR=y"
          add_config "CONFIG_FHANDLE=y"
          add_config "CONFIG_CHECKPOINT_RESTORE=y"
          add_config "CONFIG_BPF=y"
          add_config "CONFIG_BPF_SYSCALL=y"
          add_config "CONFIG_BPF_JIT=y"
          add_config "CONFIG_MODULES=y"
          add_config "# CONFIG_ANDROID_PARANOID_NETWORK is not set"
          echo "[✓] Docker/LXC 全量配置已写入"

      - name: 【校验·第七步】核心配置验证
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          CORE=(
            "CONFIG_NAMESPACES=y" "CONFIG_CGROUPS=y" "CONFIG_MEMCG=y"
            "CONFIG_USER_NS=y" "CONFIG_NET_NS=y" "CONFIG_OVERLAY_FS=y"
            "CONFIG_VETH=y" "CONFIG_BRIDGE=y" "CONFIG_NETFILTER=y"
            "CONFIG_NF_NAT=y" "CONFIG_SECCOMP=y" "CONFIG_SECURITY_APPARMOR=y"
            "CONFIG_BPF=y" "CONFIG_MODULES=y"
          )
          for cfg in "${CORE[@]}"; do
            if grep -q "^${cfg}$" "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg}"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第七步校验失败，终止"
            exit 1
          fi
          echo "✅ 第七步校验通过"

      # ==================== 第八步：cgroup 自动挂载 + ramdisk 脚本 ====================
      - name: 【第八步】cgroup 内核自动挂载配置
        id: step8
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cat >> out/.config << 'EOF'
          CONFIG_CGROUP_AUTOMOUNT=y
          CONFIG_TMPFS=y
          CONFIG_HUGETLBFS=y
          CONFIG_CGROUP_HUGETLB=y
          EOF
          echo "[✓] cgroup 自动挂载已开启"

      - name: 【校验·第八步】自动挂载配置确认
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          for cfg in "CONFIG_CGROUP_AUTOMOUNT=y" "CONFIG_TMPFS=y" "CONFIG_HUGETLBFS=y"; do
            if grep -q "^${cfg}$" "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg}"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步校验失败，终止"
            exit 1
          fi
          echo "✅ 第八步校验通过"

      - name: 【第八步续】ramdisk 挂载脚本
        id: step8b
        run: |
          cd $GITHUB_WORKSPACE
          INIT_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d
          RCS_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d
          mkdir -p "$INIT_DIR" "$RCS_DIR"
          cat > $INIT_DIR/auto-mount-cgroups.sh << 'MOUNT_SCRIPT'
          #!/bin/sh
          set -e
          MAX_RETRY=10
          RETRY_INTERVAL=10
          CGROUP_ROOT="/sys/fs/cgroup"
          do_mount_cgroups() {
              mount -t tmpfs -o mode=755 tmpfs "$CGROUP_ROOT" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/devices"
              mount -t cgroup -o devices cgroup "$CGROUP_ROOT/devices" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/systemd"
              mount -t cgroup -o none,name=systemd cgroup "$CGROUP_ROOT/systemd" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/freezer"
              mount -t cgroup -o freezer cgroup "$CGROUP_ROOT/freezer" 2>/dev/null || true
          }
          retry=0
          while [ $retry -lt $MAX_RETRY ]; do
              do_mount_cgroups()
              if mount | grep -q "cgroup on $CGROUP_ROOT/devices" && mount | grep -q "cgroup on $CGROUP_ROOT/systemd" && mount | grep -q "cgroup on $CGROUP_ROOT/freezer"; then
                  echo "[OK] cgroup 挂载成功（尝试次数：$((retry+1))）"
                  exit 0
              fi
              retry=$((retry+1))
              sleep $RETRY_INTERVAL
          done
          echo "[FAIL] cgroup 挂载失败"
          exit 1
          MOUNT_SCRIPT
          chmod 755 $INIT_DIR/auto-mount-cgroups.sh
          ln -sf ../init.d/auto-mount-cgroups.sh $RCS_DIR/S99-auto-mount-cgroups.sh
          echo "[✓] ramdisk 挂载脚本就绪"

      - name: 【校验·第八步续】ramdisk 脚本确认
        run: |
          FAIL=0
          SCRIPT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d/auto-mount-cgroups.sh
          SYMLINK=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d/S99-auto-mount-cgroups.sh
          [ -f "$SCRIPT" ] && echo "[✓] 脚本存在" || { echo "[✗] 脚本缺失"; FAIL=1; }
          [ -x "$SCRIPT" ] && echo "[✓] 脚本可执行" || { echo "[✗] 脚本不可执行"; FAIL=1; }
          [ -L "$SYMLINK" ] && echo "[✓] 符号链接存在" || { echo "[✗] 符号链接缺失"; FAIL=1; }
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步续校验失败，终止"
            exit 1
          fi
          echo "✅ 第八步续校验通过"

      # ==================== 第九步：KernelSU-Next ====================
      - name: 【第九步】部署 KernelSU-Next Legacy
        id: step9
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
          echo "[✓] KernelSU-Next 部署完成"

      - name: 【校验·第九步】KernelSU 配置确认
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          grep -q "^CONFIG_KSU=y$" "$CONFIG_FILE" 2>/dev/null && echo "[✓] CONFIG_KSU=y" || { echo "[✗] CONFIG_KSU=y 缺失"; FAIL=1; }
          [ -d "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/kernelsu" ] && echo "[✓] KernelSU 驱动目录存在" || { echo "[✗] 驱动目录缺失"; FAIL=1; }
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第九步校验失败，终止"
            exit 1
          fi
          echo "✅ 第九步校验通过"

      # ==================== 第十步：olddefconfig + Clang 兼容修复 ====================
      - name: 【第十步】olddefconfig 同步
        id: step10
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 olddefconfig
          echo "[✓] olddefconfig 同步完成"

      - name: 【修复Clang兼容1】writeback.h 补充 cgroup 头文件
        id: fix-writeback
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp include/trace/events/writeback.h include/trace/events/writeback.h.bak
          sed -i '1i #include <linux/cgroup.h>' include/trace/events/writeback.h
          grep -q "#include <linux/cgroup.h>" include/trace/events/writeback.h && echo "[✓] writeback.h 修复完成" || { echo "[✗] 修复失败"; exit 1; }

      - name: 【校验·修复1】writeback.h 确认
        run: |
          HEADER=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/include/trace/events/writeback.h
          if grep -q "#include <linux/cgroup.h>" "$HEADER"; then
            echo "[✓] writeback.h 头文件已补充"
          else
            echo "[✗] writeback.h 修复校验失败"
            exit 1
          fi
          echo "✅ 修复1校验通过"

      - name: 【修复Clang兼容2】AppArmor crypto.c 变长数组
        id: fix-apparmor
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp security/apparmor/crypto.c security/apparmor/crypto.c.bak
          python3 << 'PYEOF'
          content = open('security/apparmor/crypto.c', 'r').read()
          func_name = 'int aa_calc_profile_hash'
          idx = content.find(func_name)
          if idx == -1:
              func_name = 'aa_calc_profile_hash'
              idx = content.find(func_name)
          if idx == -1:
              print("[✗] 未找到函数")
              exit(1)
          brace_start = content.find('{', idx)
          depth = 1
          pos = brace_start + 1
          while pos < len(content) and depth > 0:
              if content[pos] == '{': depth += 1
              elif content[pos] == '}': depth -= 1
              pos += 1
          new_func = '''int aa_calc_profile_hash(struct aa_profile *profile, u32 version, void *start, size_t len)
          {
              struct shash_desc *desc;
              int error = -ENOMEM;
              u32 le32_version = cpu_to_le32(version);
              if (!apparmor_tfm) return 0;
              profile->hash = kzalloc(apparmor_hash_size, GFP_KERNEL);
              if (!profile->hash) goto fail;
              desc = kzalloc(sizeof(*desc) + crypto_shash_descsize(apparmor_tfm), GFP_KERNEL);
              if (!desc) goto fail;
              desc->tfm = apparmor_tfm;
              desc->flags = 0;
              error = crypto_shash_init(desc);
              if (error) goto fail_desc;
              error = crypto_shash_update(desc, (u8 *)&le32_version, 4);
              if (error) goto fail_desc;
              error = crypto_shash_update(desc, (u8 *)start, len);
              if (error) goto fail_desc;
              error = crypto_shash_final(desc, profile->hash);
              if (error) goto fail_desc;
              kfree(desc);
              return 0;
          fail_desc:
              kfree(desc);
          fail:
              kfree(profile->hash);
              profile->hash = NULL;
              return error;
          }'''
          content = content[:idx] + new_func + content[pos:]
          open('security/apparmor/crypto.c', 'w').write(content)
          print("[✓] AppArmor crypto.c 修复完成")
          PYEOF

      - name: 【校验·修复2】变长数组确认
        run: |
          CRYPTO_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/security/apparmor/crypto.c
          if grep -q "char ctx\[crypto_shash_descsize" "$CRYPTO_FILE"; then
            echo "[✗] 变长数组未移除"
            exit 1
          else
            echo "[✓] 变长数组已移除"
          fi
          echo "✅ 修复2校验通过"

      - name: 【修复Clang兼容3】stack_pointer.h 全局寄存器变量替换为内联函数
        id: fix-sp
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp arch/arm64/include/asm/stack_pointer.h arch/arm64/include/asm/stack_pointer.h.bak
          python3 << 'PYEOF'
          content = open('arch/arm64/include/asm/stack_pointer.h', 'r').read()
          old = 'register unsigned long current_stack_pointer asm ("sp");'
          new = '''static __always_inline unsigned long current_stack_pointer(void)
          {
              unsigned long sp;
              asm volatile("mov %0, sp" : "=r"(sp));
              return sp;
          }'''
          if old in content:
              content = content.replace(old, new)
              open('arch/arm64/include/asm/stack_pointer.h', 'w').write(content)
              print("[✓] stack_pointer.h 全局寄存器变量已替换为内联函数")
          else:
              print("[!] 未找到目标代码，可能已被修复，跳过")
          PYEOF

      - name: 【校验·修复3】stack_pointer.h 确认
        run: |
          FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/include/asm/stack_pointer.h
          if grep -q 'register unsigned long current_stack_pointer asm' "$FILE"; then
            echo "[✗] 全局寄存器变量未移除"
            exit 1
          else
            echo "[✓] 全局寄存器变量已移除"
          fi
          echo "✅ 修复3校验通过"

      # ==================== 核心错误修复：回滚spinlock.h错误替换 ====================
      - name: 【修复Clang兼容4】回滚spinlock.h错误的通用寄存器替换，恢复原生I立即数兼容
        id: fix-spinlock-rollback
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp arch/arm64/include/asm/spinlock.h arch/arm64/include/asm/spinlock.h.errorbak
          sed -i 's/"r" (1 << TICKET_SHIFT)/"I" (1 << TICKET_SHIFT)/g' arch/arm64/include/asm/spinlock.h
          sed -i '/#define TICKET_SHIFT 16/a asm(".equ TICKET_SHIFT, 16");' arch/arm64/include/asm/spinlock.h
          echo "[✓] spinlock.h原生立即数约束已恢复，适配Clang生成合法64位汇编"

      - name: 【校验·修复4】spinlock.h最终适配验证
        run: |
          SPINLOCK_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/include/asm/spinlock.h
          FAIL=0
          if grep -q '"I" (1 << TICKET_SHIFT)' "$SPINLOCK_FILE"; then
            echo "[✓] 原生'I'立即数约束已成功恢复"
          else
            echo "[✗] spinlock.h原生约束未正确回滚"
            FAIL=1
          fi
          if grep -q 'asm(".equ TICKET_SHIFT, 16");' "$SPINLOCK_FILE"; then
            echo "[✓] TICKET_SHIFT已同步定义为汇编级可见立即数"
          else
            echo "[✗] 汇编级常量定义未成功写入"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ spinlock.h最终适配校验失败，终止构建"
            exit 1
          fi
          echo "✅ 修复4校验通过，完全规避add w9,w9,x10类位宽不匹配的非法汇编错误"

      - name: 【修复Clang兼容5.1】适配perf_event.h中current_stack_pointer调用逻辑
        id: fix-perf-stack-adapt
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          PERF_HEADER=arch/arm64/include/asm/perf_event.h
          cp "$PERF_HEADER" "$PERF_HEADER.bak"
          sed -i 's/(regs)->sp = current_stack_pointer;/(regs)->sp = (u64)current_stack_pointer();/g' "$PERF_HEADER"
          echo "[✓] perf_event.h宏逻辑已适配修复"

      - name: 【校验·修复5.1】perf_event.h修改确认
        run: |
          PERF_HEADER=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/include/asm/perf_event.h
          if grep -q "(regs)->sp = (u64)current_stack_pointer();" "$PERF_HEADER"; then
            echo "[✓] 显式类型转换已写入perf_event.h"
          else
            echo "[✗] perf_event.h适配修改失败"
            exit 1
          fi
          echo "✅ 修复5.1校验通过"

      - name: 【修复Clang兼容5.2】适配stacktrace.c中current_stack_pointer调用点
        id: fix-stacktrace-complete
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          STACKTRACE_FILE=arch/arm64/kernel/stacktrace.c
          cp "$STACKTRACE_FILE" "$STACKTRACE_FILE.oldbak"
          sed -i 's/frame.sp = current_stack_pointer;/frame.sp = current_stack_pointer();/' "$STACKTRACE_FILE"
          echo "[✓] stacktrace.c所有current_stack_pointer调用点已适配为函数调用"

      - name: 【校验·修复5.2】stacktrace.c全量适配确认
        run: |
          STACKTRACE_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/kernel/stacktrace.c
          if grep -q "frame.sp = current_stack_pointer()" "$STACKTRACE_FILE"; then
            echo "[✓] stacktrace.c已完成全量适配，返回值类型完全对齐"
          else
            echo "[✗] stacktrace.c适配未完全生效，终止构建"
            exit 1
          fi
          echo "✅ 修复5.2校验通过，消除该文件内所有类型不兼容隐患"

      - name: 【修复Clang兼容5.3】适配traps.c中current_stack_pointer调用点
        id: fix-traps-complete
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          TRAPS_FILE=arch/arm64/kernel/traps.c
          cp "$TRAPS_FILE" "$TRAPS_FILE.oldbak"
          sed -i 's/frame.sp = current_stack_pointer;/frame.sp = current_stack_pointer();/' "$TRAPS_FILE"
          echo "[✓] traps.c所有current_stack_pointer调用点已适配为函数调用"


      - name: 【校验·修复5.3】traps.c全量适配确认
        run: |
          TRAPS_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/kernel/traps.c
          if grep -q "frame.sp = current_stack_pointer()" "$TRAPS_FILE"; then
            echo "[✓] traps.c已完成全量适配，返回值类型完全对齐"
          else
            echo "[✗] traps.c适配未完全生效，终止构建"
            exit 1
          fi
          echo "✅ 修复5.3校验通过，消除该文件内所有类型不兼容隐患"

      # ==================== 第十一步：编译内核 ====================
      - name: 【第十一步】开始编译内核
        id: step11
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc) 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ 内核编译失败，退出码：${BUILD_EXIT_CODE}"
            echo "=== 最后50行编译日志 ==="
            tail -50 build.log
            exit 1
          fi
          echo "[✓] 内核编译成功"

      - name: 【校验·第十一步】编译产物完整性
        run: |
          FAIL=0
          KERNEL_OUT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out
          KERNEL_IMAGE=$KERNEL_OUT/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "[✗] 内核镜像缺失：${KERNEL_IMAGE}"
            FAIL=1
          else
            echo "[✓] 内核镜像已生成：$(ls -lh $KERNEL_IMAGE | awk '{print $5}')"
          fi
          if [ ! -f "$KERNEL_OUT/arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb" ]; then
            echo "[✗] DTB 文件缺失"
            FAIL=1
          else
            echo "[✓] DTB 文件已生成"
          fi
          if [ ! -f "$KERNEL_OUT/vmlinux" ]; then
            echo "[✗] vmlinux 缺失"
            FAIL=1
          else
            echo "[✓] vmlinux 已生成"
          fi
          BUILD_LOG=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/build.log
          if grep -qi "error:" "$BUILD_LOG" 2>/dev/null; then
            echo "[✗] 编译日志中存在 error 关键字"
            grep -i "error:" "$BUILD_LOG" | tail -10
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十一步校验通过"

      # ==================== 第十二步：生成 Image.gz-dtb ====================
      - name: 【第十二步】生成 Image.gz-dtb
        id: step12
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          if [ ! -f Image ]; then
            echo "[✗] Image 文件不存在"
            exit 1
          fi
          gzip -9 -c Image > Image.gz
          echo "[✓] Image.gz 压缩完成"
          if [ ! -f dts/qcom/msm8998-xiaomi-sagit.dtb ]; then
            echo "[✗] DTB 文件不存在"
            exit 1
          fi
          cat Image.gz dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
          echo "[✓] Image.gz-dtb 拼接完成"

      - name: 【校验·第十二步】Image.gz-dtb 完整性
        run: |
          FAIL=0
          BOOT_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot
          if [ ! -f "$BOOT_DIR/Image.gz" ]; then
            echo "[✗] Image.gz 缺失"
            FAIL=1
          else
            echo "[✓] Image.gz 存在：$(ls -lh $BOOT_DIR/Image.gz | awk '{print $5}')"
          fi
          if [ ! -f "$BOOT_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 缺失"
            FAIL=1
          else
            echo "[✓] Image.gz-dtb 存在：$(ls -lh $BOOT_DIR/Image.gz-dtb | awk '{print $5}')"
          fi
          if [ ! -s "$BOOT_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 为空文件"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十二步校验通过"

      # ==================== 第十三步：拉取 AnyKernel3 ====================
      - name: 【第十三步】拉取 AnyKernel3 模板
        id: step13
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3/.git ]; then
            git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3.git
          fi
          cd AnyKernel3
          rm -f Image* dtb* dtbo* *.zip 2>/dev/null || true
          cp $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb ./
          echo "[✓] AnyKernel3 模板就绪，Image.gz-dtb 已复制"

      - name: 【校验·第十三步】AnyKernel3 文件确认
        run: |
          FAIL=0
          AK3_DIR=$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          for f in "anykernel.sh" "META-INF/com/google/android/update-binary" "tools/ak3-core.sh"; do
            if [ -f "$AK3_DIR/$f" ]; then
              echo "[✓] $f"
            else
              echo "[✗] $f 缺失"
              FAIL=1
            fi
          done
          if [ ! -f "$AK3_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 未复制到 AnyKernel3"
            FAIL=1
          else
            echo "[✓] Image.gz-dtb 已就位：$(ls -lh $AK3_DIR/Image.gz-dtb | awk '{print $5}')"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十三步校验通过"

      # ==================== 第十四步：修改 anykernel.sh ====================
      - name: 【第十四步】配置 anykernel.sh
        id: step14
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          sed -i 's|^kernel.string=.*|kernel.string=小米6全功能内核·Docker/LXC/KernelSU|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=sagit|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=MI 6|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^is_slot_device=.*|is_slot_device=0;|' anykernel.sh
          sed -i 's|^ramdisk_compression=.*|ramdisk_compression=auto;|' anykernel.sh
          grep -q "^kernel.string=小米6全功能内核" anykernel.sh && echo "[✓] 内核字符串已配置" || echo "[!] 字符串配置异常"
          grep -q "^device.name1=sagit" anykernel.sh && echo "[✓] 设备名已配置" || echo "[!] 设备名配置异常"
          echo "[✓] anykernel.sh 配置完成"

      - name: 【校验·第十四步】anykernel.sh 关键参数确认
        run: |
          FAIL=0
          AK3_SH=$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3/anykernel.sh
          CHECKS=(
            "device.name1=sagit"
            "block=/dev/block/bootdevice/by-name/boot"
            "is_slot_device=0"
            "ramdisk_compression=auto"
          )
          for check in "${CHECKS[@]}"; do
            if grep -q "^${check}" "$AK3_SH" 2>/dev/null; then
              echo "[✓] ${check}"
            else
              echo "[✗] ${check}"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十四步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十四步校验通过"

      # ==================== 第十五步：打包 ZIP ====================
      - name: 【第十五步】打包 AnyKernel3 ZIP
        id: step15
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          ZIP_NAME=${{ env.KERNEL_ZIP_NAME }}
          if [ -z "$ZIP_NAME" ]; then
            ZIP_NAME="Xiaomi6-Kernel-Docker-LXC-KSU-$(date +%Y%m%d-%H%M%S).zip"
          fi
          zip -r9 "../${ZIP_NAME}" ./* -x ".git/*" ".github/*" "*.md" "LICENSE"
          echo "[✓] ZIP 打包完成：${ZIP_NAME}"

      - name: 【校验·第十五步】ZIP 文件完整性
        run: |
          FAIL=0
          ZIP_DIR=$GITHUB_WORKSPACE/kernel_workspace
          ZIP_FILE=$(ls -t $ZIP_DIR/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "[✗] 未找到 ZIP 文件"
            FAIL=1
          else
            echo "[✓] ZIP 文件：$(basename $ZIP_FILE)"
            echo "[✓] 大小：$(ls -lh $ZIP_FILE | awk '{print $5}')"
            if ! unzip -t "$ZIP_FILE" > /dev/null 2>&1; then
              echo "[✗] ZIP 文件损坏（unzip -t 测试失败）"
              FAIL=1
            else
              echo "[✓] ZIP 完整性校验通过"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "Image.gz-dtb"; then
              echo "[✗] ZIP 中缺少 Image.gz-dtb"
              FAIL=1
            else
              echo "[✓] ZIP 包含 Image.gz-dtb"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "anykernel.sh"; then
              echo "[✗] ZIP 中缺少 anykernel.sh"
              FAIL=1
            else
              echo "[✓] ZIP 包含 anykernel.sh"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "META-INF/com/google/android/update-binary"; then
              echo "[✗] ZIP 中缺少 update-binary"
              FAIL=1
            else
              echo "[✓] ZIP 包含 update-binary"
            fi
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十五步校验通过"

      # ==================== 第十六步：上传构建产物 ====================
      - name: 【第十六步】上传内核 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi6-Kernel-Docker-LXC-KSU
          path: ${{ github.workspace }}/kernel_workspace/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: 【第十六步】上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: ${{ github.workspace }}/kernel_workspace/android-kernel/build.log
          if-no-files-found: warn
          compression-level: 6

      - name: 【校验·第十六步】产物上传确认
        run: |
          ZIP_DIR=$GITHUB_WORKSPACE/kernel_workspace
          ZIP_COUNT=$(ls -1 $ZIP_DIR/*.zip 2>/dev/null | wc -l)
          if [ $ZIP_COUNT -gt 0 ]; then
            echo "[✓] 共 ${ZIP_COUNT} 个 ZIP 文件待上传"
            ls -lh $ZIP_DIR/*.zip
          else
            echo "[✗] 无 ZIP 文件可上传"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/build.log" ]; then
            echo "[✓] 编译日志待上传"
          else
            echo "[!] 编译日志不存在，跳过上传"
          fi
          echo "✅ 第十六步校验通过"

      # ==================== 构建完成 ====================
      - name: 【构建完成】汇总报告
        if: always()
        run: |
          echo "=============================================="
          echo "  小米6全功能内核构建流程结束"
          echo "  Docker / LXC / KernelSU-Next 已集成"
          echo "  构建时间：$(date '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="
          echo ""
          echo "内置功能清单："
          echo "  ✓ Docker 容器支持（OverlayFS + cgroups v1）"
          echo "  ✓ LXC 容器支持（完整命名空间隔离）"
          echo "  ✓ KernelSU-Next Root 方案"
          echo "  ✓ AppArmor 强制访问控制"
          echo "  ✓ BPF 系统调用追踪"
          echo "  ✓ 网络命名空间 / VETH / Bridge / NAT"
          echo "  ✓ cgroup 自动挂载（ramdisk 级）"
          echo "  ✓ Clang14 全量兼容修复"
          echo ""
          echo "刷入方法："
          echo "  1. 进入 TWRP Recovery"
          echo "  2. 刷入生成的 AnyKernel3 ZIP 包"
          echo "  3. 重启系统"
          echo "=============================================="
