            echo "[✓] 第四层parentheses-equality告警关闭规则已生效"
          else
            echo "[✗] 第四层规则写入失败，终止构建"
            FAIL=1
          fi
          if grep -q "KBUILD_CFLAGS   += -Wno-error=implicit-function-declaration" Makefile; then
            echo "[✓] 第五层implicit-function-declaration错误屏蔽规则已生效"
          else
            echo "[✗] 第五层规则写入失败，终止构建"
            FAIL=1
          fi
          if grep -q "KBUILD_CFLAGS   += -Wno-implicit-function-declaration" Makefile; then
            echo "[✓] 第六层implicit-function-declaration告警关闭规则已生效"
          else
            echo "[✗] 第六层规则写入失败，终止构建"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi
          echo "✅ 六层Werror豁免配置全部校验通过，从根源规避所有已知Clang告警升级为致命错误"

      
          # -------------------------- 第四层：定义编译全局环境变量 --------------------------
          echo ""
          echo "=== 初始化编译全局环境变量 ==="
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:/usr/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=/usr/bin/arm-linux-gnueabi-
          echo "[✓] 全量编译环境变量初始化完成"
      
          # -------------------------- 第五层：启动全量内核编译 --------------------------
          echo ""
          echo "=== 启动Clang全量内核编译 ==="
          make O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j$(nproc) 2>&1 | tee full_build_detail.log
          BUILD_EXIT_CODE=$PIPESTATUS
      
          # -------------------------- 第六层：全量编译错误日志抓取 --------------------------
          echo ""
          echo "=== 全量错误日志分析 ==="
          grep -n -i "error:" full_build_detail.log || echo "[!] 日志中无显性error标记"
          grep -n -i "undefined reference" full_build_detail.log || echo "[!] 日志中无未定义符号错误"
          grep -n -i "relocation truncated" full_build_detail.log || echo "[!] 日志中无截断重定位错误"
          grep -n -i "fatal error" full_build_detail.log || echo "[!] 日志中无致命编译错误"
          grep -n -i "parentheses-equality" full_build_detail.log || echo "[!] 日志中无冗余括号相关告警"
          grep -n -i "implicit-function-declaration" full_build_detail.log || echo "[!] 日志中无隐式函数声明相关告警"
          grep -n -i "incomplete definition of type" full_build_detail.log || echo "[!] 日志中无不完整类型定义错误"
          grep -n -i "incomplete definition of type" full_build_detail.log || echo "[!] 日志中无不完整类型定义错误"
          grep -n -i "sensorb_cfg_data32" full_build_detail.log || echo "[!] 日志中无32位结构体类型相关错误"
          grep -n -i "compat_ptr" full_build_detail.log || echo "[!] 日志中无compat_ptr相关错误"

      
          # -------------------------- 第七层：编译结果状态判定 --------------------------
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ 内核编译失败，退出码：${BUILD_EXIT_CODE}"
            echo "=== 最后100行完整编译日志 ==="
            tail -100 full_build_detail.log
            exit 1
          fi
          echo "[✓] 内核编译完全成功，所有已知类型告警已被四层规则完全屏蔽"



      - name: 【兜底修复】小米6专属DTB文件生成
        id: sagit-dtb-fix
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          DTB_OUT_DIR=out/arch/arm64/boot/dts/qcom
          if [ ! -f $DTB_OUT_DIR/msm8998-xiaomi-sagit.dtb ]; then
            find $DTB_OUT_DIR -name "*sagit*.dtb" -exec cp {} $DTB_OUT_DIR/msm8998-xiaomi-sagit.dtb \;
            echo "[✓] 已自动匹配小米6 DTB文件到标准路径"
          else
            echo "[✓] 标准路径下小米6 DTB已存在"
          fi

      - name: 【校验·小米6 DTB确认】
        run: |
          DTB_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb
          if [ -f "$DTB_FILE" ] && [ -s "$DTB_FILE" ]; then
            echo "[✓] 小米6专属DTB文件校验通过：$(ls -lh $DTB_FILE | awk '{print $5}')"
          else
            echo "[✗] 小米6 DTB文件生成失败"
            exit 1
          fi
          echo "✅ DTB兜底修复校验通过"



      - name: 【校验·第十一步】编译产物完整性
        run: |
          FAIL=0
          KERNEL_OUT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out
          KERNEL_IMAGE=$KERNEL_OUT/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}
          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "[✗] 内核镜像缺失：${KERNEL_IMAGE}"
            FAIL=1
          else
            echo "[✓] 内核镜像已生成：$(ls -lh $KERNEL_IMAGE | awk '{print $5}')"
          fi
          if [ ! -f "$KERNEL_OUT/arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb" ]; then
            echo "[✗] DTB 文件缺失"
            FAIL=1
          else
            echo "[✓] DTB 文件已生成"
          fi
          if [ ! -f "$KERNEL_OUT/vmlinux" ]; then
            echo "[✗] vmlinux 缺失"
            FAIL=1
          else
            echo "[✓] vmlinux 已生成"
          fi
          BUILD_LOG=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/full_build_detail.log
          if grep -qi "error:" "$BUILD_LOG" 2>/dev/null; then
            echo "[✗] 编译日志中存在 error 关键字"
            grep -i "error:" "$BUILD_LOG" | tail -10
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十一步校验通过"


      # ==================== 第十二步：生成 Image.gz-dtb ====================
      - name: 【第十二步】生成 Image.gz-dtb
        id: step12
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          if [ ! -f Image ]; then
            echo "[✗] Image 文件不存在"
            exit 1
          fi
          gzip -9 -c Image > Image.gz
          echo "[✓] Image.gz 压缩完成"
          if [ ! -f dts/qcom/msm8998-xiaomi-sagit.dtb ]; then
            echo "[✗] DTB 文件不存在"
            exit 1
          fi
          cat Image.gz dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
          echo "[✓] Image.gz-dtb 拼接完成"

      - name: 【校验·第十二步】Image.gz-dtb 完整性
        run: |
          FAIL=0
          BOOT_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot
          if [ ! -f "$BOOT_DIR/Image.gz" ]; then
            echo "[✗] Image.gz 缺失"
            FAIL=1
          else
            echo "[✓] Image.gz 存在：$(ls -lh $BOOT_DIR/Image.gz | awk '{print $5}')"
          fi
          if [ ! -f "$BOOT_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 缺失"
            FAIL=1
          else
            echo "[✓] Image.gz-dtb 存在：$(ls -lh $BOOT_DIR/Image.gz-dtb | awk '{print $5}')"
          fi
          if [ ! -s "$BOOT_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 为空文件"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十二步校验通过"

      # ==================== 第十三步：拉取 AnyKernel3 ====================
      - name: 【第十三步】拉取 AnyKernel3 模板
        id: step13
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d AnyKernel3/.git ]; then
            git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3.git
          fi
          cd AnyKernel3
          rm -f Image* dtb* dtbo* *.zip 2>/dev/null || true
          cp $GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb ./
          echo "[✓] AnyKernel3 模板就绪，Image.gz-dtb 已复制"

      - name: 【校验·第十三步】AnyKernel3 文件确认
        run: |
          FAIL=0
          AK3_DIR=$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          for f in "anykernel.sh" "META-INF/com/google/android/update-binary" "tools/ak3-core.sh"; do
            if [ -f "$AK3_DIR/$f" ]; then
              echo "[✓] $f"
            else
              echo "[✗] $f 缺失"
              FAIL=1
            fi
          done
          if [ ! -f "$AK3_DIR/Image.gz-dtb" ]; then
            echo "[✗] Image.gz-dtb 未复制到 AnyKernel3"
            FAIL=1
          else
            echo "[✓] Image.gz-dtb 已就位：$(ls -lh $AK3_DIR/Image.gz-dtb | awk '{print $5}')"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十三步校验通过"

      # ==================== 第十四步：修改 anykernel.sh ====================
      - name: 【第十四步】配置 anykernel.sh
        id: step14
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          sed -i 's|^kernel.string=.*|kernel.string=小米6全功能内核·Docker/LXC/KernelSU|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=sagit|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=MI 6|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^device.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^is_slot_device=.*|is_slot_device=0;|' anykernel.sh
          sed -i 's|^ramdisk_compression=.*|ramdisk_compression=auto;|' anykernel.sh
          grep -q "^kernel.string=小米6全功能内核" anykernel.sh && echo "[✓] 内核字符串已配置" || echo "[!] 字符串配置异常"
          grep -q "^device.name1=sagit" anykernel.sh && echo "[✓] 设备名已配置" || echo "[!] 设备名配置异常"
          echo "[✓] anykernel.sh 配置完成"
      
      - name: 【校验·第十四步】anykernel.sh 关键参数确认及自动补全
        run: |
          AK3_SH=$GITHUB_WORKSPACE/kernel_workspace/AnyKernel3/anykernel.sh
          FAIL=0
      
          # 第一步：确保三个关键配置项存在，缺失则自动补全
          declare -A DEFAULTS=(
            ["block"]="/dev/block/bootdevice/by-name/boot"
            ["is_slot_device"]="0"
            ["ramdisk_compression"]="auto"
          )
      
          for key in "${!DEFAULTS[@]}"; do
            val="${DEFAULTS[$key]}"
            # 匹配行首的 key= 声明（容忍末尾分号）
            if grep -q "^${key}=" "$AK3_SH" 2>/dev/null; then
              echo "[✓] ${key}= 已存在"
            else
              echo "[!] ${key}= 缺失，自动补全为 ${key}=${val};"
              sed -i "/^device.name1=/a\\${key}=${val};" "$AK3_SH"
            fi
          done
      
          # 第二步：宽松校验，容忍分号结尾
          CHECKS=(
            "device.name1=sagit"
            "block=/dev/block/bootdevice/by-name/boot"
            "is_slot_device=0"
            "ramdisk_compression=auto"
          )
          for check in "${CHECKS[@]}"; do
            if grep -qE "^${check};?\s*$" "$AK3_SH" 2>/dev/null; then
              echo "[✓] ${check}"
            else
              echo "[✗] ${check}"
              FAIL=1
            fi
          done
      
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十四步校验失败，终止"
            echo "--- anykernel.sh 当前相关配置 ---"
            grep -nE '^(device\.name1|block|is_slot_device|ramdisk_compression)=' "$AK3_SH" 2>/dev/null || echo "(无匹配行)"
            exit 1
          fi
          echo "✅ 第十四步校验通过，AnyKernel3 关键参数全部正确"


      # ==================== 第十五步：打包 ZIP ====================
      - name: 【第十五步】打包 AnyKernel3 ZIP
        id: step15
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
          ZIP_NAME=${{ env.KERNEL_ZIP_NAME }}
          if [ -z "$ZIP_NAME" ]; then
            ZIP_NAME="Xiaomi6-Kernel-Docker-LXC-KSU-$(date +%Y%m%d-%H%M%S).zip"
          fi
          zip -r9 "../${ZIP_NAME}" ./* -x ".git/*" ".github/*" "*.md" "LICENSE"
          echo "[✓] ZIP 打包完成：${ZIP_NAME}"

      - name: 【校验·第十五步】ZIP 文件完整性
        run: |
          FAIL=0
          ZIP_DIR=$GITHUB_WORKSPACE/kernel_workspace
          ZIP_FILE=$(ls -t $ZIP_DIR/*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "[✗] 未找到 ZIP 文件"
            FAIL=1
          else
            echo "[✓] ZIP 文件：$(basename $ZIP_FILE)"
            echo "[✓] 大小：$(ls -lh $ZIP_FILE | awk '{print $5}')"
            if ! unzip -t "$ZIP_FILE" > /dev/null 2>&1; then
              echo "[✗] ZIP 文件损坏（unzip -t 测试失败）"
              FAIL=1
            else
              echo "[✓] ZIP 完整性校验通过"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "Image.gz-dtb"; then
              echo "[✗] ZIP 中缺少 Image.gz-dtb"
              FAIL=1
            else
              echo "[✓] ZIP 包含 Image.gz-dtb"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "anykernel.sh"; then
              echo "[✗] ZIP 中缺少 anykernel.sh"
              FAIL=1
            else
              echo "[✓] ZIP 包含 anykernel.sh"
            fi
            if ! unzip -l "$ZIP_FILE" | grep -q "META-INF/com/google/android/update-binary"; then
              echo "[✗] ZIP 中缺少 update-binary"
              FAIL=1
            else
              echo "[✓] ZIP 包含 update-binary"
            fi
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第十五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第十五步校验通过"

      # ==================== 第十六步：上传构建产物 ====================
      - name: 【第十六步】上传内核 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi6-Kernel-Docker-LXC-KSU
          path: ${{ github.workspace }}/kernel_workspace/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: 【第十六步】上传编译日志
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: ${{ github.workspace }}/kernel_workspace/android-kernel/full_build_detail.log
          if-no-files-found: warn
          compression-level: 6


      - name: 【校验·第十六步】产物上传确认
        run: |
          ZIP_DIR=$GITHUB_WORKSPACE/kernel_workspace
          ZIP_COUNT=$(ls -1 $ZIP_DIR/*.zip 2>/dev/null | wc -l)
          if [ $ZIP_COUNT -gt 0 ]; then
            echo "[✓] 共 ${ZIP_COUNT} 个 ZIP 文件待上传"
            ls -lh $ZIP_DIR/*.zip
          else
            echo "[✗] 无 ZIP 文件可上传"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/build.log" ]; then
            echo "[✓] 编译日志待上传"
          else
            echo "[!] 编译日志不存在，跳过上传"
          fi
          echo "✅ 第十六步校验通过"

      # ==================== 构建完成 ====================
      - name: 【构建完成】汇总报告
        if: always()
        run: |
          echo "=============================================="
          echo "  小米6全功能内核构建流程结束"
          echo "  Docker / LXC / KernelSU-Next 已集成"
          echo "  构建时间：$(date '+%Y-%m-%d %H:%M:%S')"
          echo "=============================================="
          echo ""
          echo "内置功能清单："
          echo "  ✓ Docker 容器支持（OverlayFS + cgroups v1）"
          echo "  ✓ LXC 容器支持（完整命名空间隔离）"
          echo "  ✓ KernelSU-Next Root 方案"
          echo "  ✓ AppArmor 强制访问控制"
          echo "  ✓ BPF 系统调用追踪"
          echo "  ✓ 网络命名空间 / VETH / Bridge / NAT"
          echo "  ✓ cgroup 自动挂载（ramdisk 级）"
          echo "  ✓ Clang14 全量兼容修复"
          echo ""
          echo "刷入方法："
          echo "  1. 进入 TWRP Recovery"
          echo "  2. 刷入生成的 AnyKernel3 ZIP 包"
          echo "  3. 重启系统"
          echo "=============================================="
