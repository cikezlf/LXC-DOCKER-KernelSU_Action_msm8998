      - name: 【修复Clang兼容3】stack_pointer.h 全局寄存器变量替换为内联函数
        id: fix-sp
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp arch/arm64/include/asm/stack_pointer.h arch/arm64/include/asm/stack_pointer.h.bak
          python3 << 'PYEOF'
          content = open('arch/arm64/include/asm/stack_pointer.h', 'r').read()
          old = 'register unsigned long current_stack_pointer asm ("sp");'
          new = '''static __always_inline unsigned long current_stack_pointer(void)
          {
              unsigned long sp;
              asm volatile("mov %0, sp" : "=r"(sp));
              return sp;
          }'''
          if old in content:
              content = content.replace(old, new)
              open('arch/arm64/include/asm/stack_pointer.h', 'w').write(content)
              print("[✓] stack_pointer.h 全局寄存器变量已替换为内联函数")
          else:
              print("[!] 未找到目标代码，可能已被修复，跳过")
          PYEOF

