          else
            echo "  [✗] CONFIG_ANDROID_PARANOID_NETWORK 未正确禁用 —— 容器网络权限受限"
            TOTAL=$((TOTAL + 1)); FAIL=1
          fi
          if grep -q "^# CONFIG_RT_GROUP_SCHED is not set$" "$DEFCONFIG" 2>/dev/null; then
            TOTAL=$((TOTAL + 1)); PASS=$((PASS + 1))
          else
            if grep -q "^CONFIG_RT_GROUP_SCHED=y$" "$DEFCONFIG" 2>/dev/null; then
              TOTAL=$((TOTAL + 1)); PASS=$((PASS + 1))
            else
              TOTAL=$((TOTAL + 1)); FAIL=1
            fi
          fi
  
          # ===== 第11类：ZFS文件系统全量支持（5项）=====
