      - name: 【修复Clang兼容1最终重写】修正writeback.h头文件插入位置，完全不破坏原有trace结构体
        id: fix-writeback-final
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp include/trace/events/writeback.h include/trace/events/writeback.h.fullbak
          sed -i '\|^#undef TRACE_INCLUDE_PATH|a #include <linux/cgroup.h>' include/trace/events/writeback.h
          if grep -q "#include <linux/cgroup.h>" include/trace/events/writeback.h; then
            echo "[✓] writeback.h头文件已插入到TRACE_INCLUDE_PATH定义之后的安全末尾区"
          else
            echo "[!] 头文件插入失败，触发二次兜底写入"
            LAST_ENDIF=$(grep -n "^#endif" include/trace/events/writeback.h | tail -1 | cut -d: -f1)
            if [ -n "$LAST_ENDIF" ]; then
              sed -i "${LAST_ENDIF}i #include <linux/cgroup.h>" include/trace/events/writeback.h
              echo "[✓] 兜底方案：在最后一个 #endif 之前插入头文件"
            else
              echo "#include <linux/cgroup.h>" >> include/trace/events/writeback.h
              echo "[✓] 兜底方案：在文件末尾追加头文件"
            fi
          fi


      - name: 【校验·修复1最终重写】writeback.h结构完整性确认
        run: |
          HEADER=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/include/trace/events/writeback.h
          FAIL=0
          if grep -q "#include <linux/cgroup.h>" "$HEADER"; then
            echo "[✓] writeback.h已正确包含cgroup头文件"
          else
            echo "[✗] writeback.h中未找到cgroup头文件"
            FAIL=1
          fi
          INCLUDE_LINE=$(grep -n "#include <linux/cgroup.h>" "$HEADER" | head -1 | cut -d: -f1)
          LAST_TRACE_LINE=$(grep -n "TRACE_EVENT(" "$HEADER" | tail -1 | cut -d: -f1)
          if [ -n "$INCLUDE_LINE" ] && [ -n "$LAST_TRACE_LINE" ] && [ "$INCLUDE_LINE" -gt "$LAST_TRACE_LINE" ]; then
            echo "[✓] cgroup头文件插入位置在所有TRACE_EVENT定义之后，结构体定义完整未被破坏"
          else
            echo "[✗] 头文件插入位置不安全，位于TRACE_EVENT定义区间内"
            FAIL=1
          fi
          if grep -q -E "int .*= .*char \*|char \* .*= .*int" "$HEADER"; then
            echo "[✗] 检测到整数和指针的跨类型直接赋值风险"
            FAIL=1
          else
            echo "[✓] 无整数转指针的非法赋值逻辑"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ writeback.h修复校验失败，终止"
            exit 1
          fi
          echo "✅ 修复1重写校验完全通过，彻底消除writeback.h的类型转换报错"


