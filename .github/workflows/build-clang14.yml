name: 小米6全功能内核·Docker/LXC/KernelSU稳定版
on:
  workflow_dispatch:

jobs:
  build:
    name: 内核完整构建流程
    runs-on: ubuntu-latest
    #runs-on: [self-hosted, Linux, X64]
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - uses: actions/checkout@v4

      # ==================== 第一步：全局环境初始化 ====================
      - name: 【第一步】加载全局配置
        id: step1
        run: |
          sed -i 's/\r$//' config.env
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            [[ "$line" =~ ^# ]] && continue
            if [[ "$line" =~ [A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "$line" >> $GITHUB_ENV
              echo "[✓] 已加载：$line"
            fi
          done < config.env
          echo "[✓] 全局配置加载完成"

      - name: 【校验·第一步】环境变量完整性
        run: |
          FAIL=0
          for var in KERNEL_SOURCE KERNEL_SOURCE_BRANCH KERNEL_CONFIG KERNEL_IMAGE_NAME KERNEL_ZIP_NAME; do
            if [ -z "${!var}" ]; then
              echo "[✗] 缺失：${var}"
              FAIL=1
            else
              echo "[✓] ${var} = ${!var}"
            fi
          done
          if [ ! -f config.env ]; then
            echo "[✗] config.env 不存在"
            FAIL=1
          else
            echo "[✓] config.env 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第一步校验失败，终止"
            exit 1
          fi
          echo "✅ 第一步校验通过"

      # ==================== 第二步：安装编译依赖 ====================
      - name: 【第二步】安装编译依赖
        id: step2
        run: |
          sudo apt-get update
          sudo -E apt-get -y -qq install git make bc bison ccache openssl zip kmod cpio flex libelf-dev curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          echo "[✓] 编译依赖安装完成"

      - name: 【校验·第二步】依赖完整性
        run: |
          FAIL=0
          DEPS=("git" "make" "bc" "bison" "ccache" "openssl" "zip" "kmod" "cpio" "flex" "curl" "wget" "dtc" "python3")
          for dep in "${DEPS[@]}"; do
            if command -v "$dep" &> /dev/null; then
              echo "[✓] ${dep}"
            else
              echo "[✗] ${dep} 未安装"
              FAIL=1
            fi
          done
          if [ ! -d "$GITHUB_WORKSPACE/kernel_workspace" ]; then
            echo "[✗] kernel_workspace 目录未创建"
            FAIL=1
          else
            echo "[✓] kernel_workspace 已创建"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第二步校验失败，终止"
            exit 1
          fi
          echo "✅ 第二步校验通过"

      # ==================== 第三步：资源缓存 ====================
      - name: 【第三步】Clang 工具链缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/clang-aosp
          key: clang-aosp-android13-r450784d

      - name: 【第三步】内核源码缓存
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kernel_workspace/android-kernel
          key: kernel-src-${{ env.KERNEL_SOURCE_BRANCH }}

      - name: 【校验·第三步】缓存路径可写
        run: |
          FAIL=0
          for dir in "kernel_workspace/clang-aosp" "kernel_workspace/android-kernel"; do
            mkdir -p $GITHUB_WORKSPACE/${dir}
            if [ -w $GITHUB_WORKSPACE/${dir} ]; then
              echo "[✓] ${dir} 可写"
            else
              echo "[✗] ${dir} 不可写"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第三步校验失败，终止"
            exit 1
          fi
          echo "✅ 第三步校验通过"

      # ==================== 第四步：拉取 Clang14 ====================
      - name: 【第四步】拉取 AOSP Clang14
        id: step4
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d clang-aosp/.git ]; then
            git clone -q --depth=1 --single-branch https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android13-release clang-aosp
          fi
          echo "[✓] Clang14 工具链就绪"

      - name: 【校验·第四步】Clang 可执行文件
        run: |
          FAIL=0
          CLANG_BIN=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r450784d/bin
          for f in clang clang++ lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x ${CLANG_BIN}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第四步校验失败，终止"
            exit 1
          fi
          echo "✅ 第四步校验通过"



      # ==================== 第五步：拉取内核源码 ====================
      - name: 【第五步】拉取内核源码
        id: step5
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          if [ ! -d android-kernel/.git ]; then
            git clone "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_SOURCE_BRANCH }}" android-kernel --depth=1
          fi
          echo "[✓] 内核源码就绪"

      - name: 【校验·第五步】源码完整性
        run: |
          FAIL=0
          KERNEL_DIR=$GITHUB_WORKSPACE/kernel_workspace/android-kernel
          for f in "Makefile" "arch/arm64" "kernel" "init/Kconfig" "scripts/Makefile.build"; do
            if [ -e ${KERNEL_DIR}/${f} ]; then
              echo "[✓] ${f}"
            else
              echo "[✗] ${f} 缺失"
              FAIL=1
            fi
          done
          if [ ! -d ${KERNEL_DIR}/.git ]; then
            echo "[✗] .git 缺失"
            FAIL=1
          else
            echo "[✓] .git 存在"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第五步校验失败，终止"
            exit 1
          fi
          echo "✅ 第五步校验通过"

      # ==================== 第六步：生成基础配置 ====================
      - name: 【第六步】生成基础内核配置
        id: step6
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          make O=out ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          echo "[✓] 基础配置生成完成"

      - name: 【校验·第六步】.config 文件
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          if [ ! -f "$CONFIG_FILE" ] || [ ! -s "$CONFIG_FILE" ]; then
            echo "[✗] .config 不存在或为空"
            FAIL=1
          else
            echo "[✓] .config 存在，$(wc -l < "$CONFIG_FILE") 行"
            grep -q ^CONFIG_ARM64=y "$CONFIG_FILE" && echo "[✓] CONFIG_ARM64=y"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第六步校验失败，终止"
            exit 1
          fi
          echo "✅ 第六步校验通过"


      - name: 适配修复 禁用VDSO32编译选项，彻底消除32位链接依赖
        id: disable-vdso32
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          sed -i '/CONFIG_COMPAT_VDSO/d' out/.config
          sed -i '/CONFIG_VDSO32/d' out/.config
          echo "# CONFIG_COMPAT_VDSO is not set" >> out/.config
          echo "# CONFIG_VDSO32 is not set" >> out/.config
          sed -i 's/CONFIG_64BIT_VDSO_COMPAT=y/# CONFIG_64BIT_VDSO_COMPAT is not set/g' out/.config
          make O=out ARCH=arm64 olddefconfig
          sed -i '/CONFIG_VDSO32/d' out/.config
          sed -i '/CONFIG_COMPAT_VDSO/d' out/.config
          echo "# CONFIG_COMPAT_VDSO is not set" >> out/.config
          echo "# CONFIG_VDSO32 is not set" >> out/.config
          echo "[✓] VDSO32 全链路禁用完成，切断Kbuild自动恢复逻辑"

      
      - name: 校验 VDSO32禁用确认
        run: |
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          FAIL=0
          if grep -q "^CONFIG_COMPAT_VDSO=y" "$CONFIG_FILE"; then
            echo "[✗] CONFIG_COMPAT_VDSO 被自动恢复为开启状态"
            FAIL=1
          else
            echo "[✓] CONFIG_COMPAT_VDSO 已永久禁用"
          fi
          if grep -q "^CONFIG_VDSO32=y" "$CONFIG_FILE"; then
            echo "[✗] CONFIG_VDSO32 被自动恢复为开启状态"
            FAIL=1
          else
            echo "[✓] CONFIG_VDSO32 已永久禁用"
          fi
          VDSO_MAKEFILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/arch/arm64/kernel/Makefile
          if grep -q "vdso32" "$VDSO_MAKEFILE"; then
            sed -i '/vdso32/d' "$VDSO_MAKEFILE"
            echo "[✓] 已从内核Makefile移除vdso32编译规则，彻底跳过32位构建分支"
          fi
          if [ $FAIL -eq 1 ]; then
            echo "❌ VDSO32禁用校验失败，终止"
            exit 1
          fi
          echo "✅ VDSO32 适配校验通过，完全消除32位链接冲突"





      # ==================== 第七步：Docker/LXC 全量配置 ====================
      - name: 【第七步】写入 Docker/LXC 全量配置
        id: step7
        run: |
          cd $GITHUB_WORKSPACE
          DEFCONFIG=kernel_workspace/android-kernel/out/.config
          add_config() {
            local config="$1"
            local key="${config%%=*}"
            local clean_key="${key# }"
            if grep -q "^${clean_key}=" "$DEFCONFIG" 2>/dev/null || grep -q "^# ${clean_key} is not set" "$DEFCONFIG" 2>/dev/null; then
              sed -i "s|^${clean_key}=.*|${config}|" "$DEFCONFIG" 2>/dev/null
              sed -i "s|^# ${clean_key} is not set|${config}|" "$DEFCONFIG" 2>/dev/null
            else
              echo "$config" >> "$DEFCONFIG"
            fi
          }
          add_config "CONFIG_SYSVIPC=y"
          add_config "CONFIG_POSIX_MQUEUE=y"
          add_config "CONFIG_NAMESPACES=y"
          add_config "CONFIG_PID_NS=y"
          add_config "CONFIG_UTS_NS=y"
          add_config "CONFIG_IPC_NS=y"
          add_config "CONFIG_USER_NS=y"
          add_config "CONFIG_NET_NS=y"
          add_config "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
          add_config "CONFIG_SECCOMP=y"
          add_config "CONFIG_SECCOMP_FILTER=y"
          add_config "CONFIG_CGROUPS=y"
          add_config "CONFIG_CGROUP_CPUACCT=y"
          add_config "CONFIG_CGROUP_DEVICE=y"
          add_config "CONFIG_CGROUP_FREEZER=y"
          add_config "CONFIG_CGROUP_SCHED=y"
          add_config "CONFIG_CPUSETS=y"
          add_config "CONFIG_MEMCG=y"
          add_config "CONFIG_MEMCG_SWAP=y"
          add_config "CONFIG_MEMCG_KMEM=y"
          add_config "CONFIG_BLK_CGROUP=y"
          add_config "CONFIG_CGROUP_PIDS=y"
          add_config "CONFIG_CGROUP_PERF=y"
          add_config "CONFIG_CFS_BANDWIDTH=y"
          add_config "CONFIG_FAIR_GROUP_SCHED=y"
          add_config "CONFIG_CGROUP_NET_PRIO=y"
          add_config "CONFIG_CGROUP_HUGETLB=y"
          add_config "CONFIG_NET_CLS_CGROUP=y"
          add_config "CONFIG_BLK_DEV_THROTTLING=y"
          add_config "CONFIG_CGROUP_BPF=y"
          add_config "CONFIG_DEVTMPFS=y"
          add_config "CONFIG_DEVTMPFS_MOUNT=y"
          add_config "CONFIG_FW_LOADER=y"
          add_config "CONFIG_FW_LOADER_USER_HELPER=y"
          add_config "CONFIG_OVERLAY_FS=y"
          add_config "CONFIG_TMPFS_XATTR=y"
          add_config "CONFIG_TMPFS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS=y"
          add_config "CONFIG_EXT4_FS_POSIX_ACL=y"
          add_config "CONFIG_EXT4_FS_SECURITY=y"
          add_config "CONFIG_BTRFS_FS=y"
          add_config "CONFIG_BTRFS_FS_POSIX_ACL=y"
          add_config "CONFIG_SQUASHFS=y"
          add_config "CONFIG_SQUASHFS_XATTR=y"
          add_config "CONFIG_VETH=y"
          add_config "CONFIG_BRIDGE=y"
          add_config "CONFIG_BRIDGE_NETFILTER=y"
          add_config "CONFIG_MACVLAN=y"
          add_config "CONFIG_IPVLAN=y"
          add_config "CONFIG_VXLAN=y"
          add_config "CONFIG_VLAN_8021Q=y"
          add_config "CONFIG_NETFILTER=y"
          add_config "CONFIG_NETFILTER_ADVANCED=y"
          add_config "CONFIG_NF_CONNTRACK=y"
          add_config "CONFIG_NF_TABLES=y"
          add_config "CONFIG_NF_TABLES_IPV4=y"
          add_config "CONFIG_NF_TABLES_IPV6=y"
          add_config "CONFIG_NFT_MASQ=y"
          add_config "CONFIG_NFT_NAT=y"
          add_config "CONFIG_NF_NAT=y"
          add_config "CONFIG_NF_NAT_REDIRECT=y"
          add_config "CONFIG_IP_NF_FILTER=y"
          add_config "CONFIG_IP_NF_IPTABLES=y"
          add_config "CONFIG_IP_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_NF_NAT=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          add_config "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y"
          add_config "CONFIG_NETFILTER_XT_MARK=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
          add_config "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
          add_config "CONFIG_IP_VS=y"
          add_config "CONFIG_IP_VS_NFCT=y"
          add_config "CONFIG_IP_VS_PROTO_TCP=y"
          add_config "CONFIG_IP_VS_PROTO_UDP=y"
          add_config "CONFIG_IP_VS_RR=y"
          add_config "CONFIG_IPV6=y"
          add_config "CONFIG_IP6_NF_FILTER=y"
          add_config "CONFIG_IP6_NF_NAT=y"
          add_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          add_config "CONFIG_SECURITY_APPARMOR=y"
          add_config "CONFIG_FHANDLE=y"
          add_config "CONFIG_CHECKPOINT_RESTORE=y"
          add_config "CONFIG_BPF=y"
          add_config "CONFIG_BPF_SYSCALL=y"
          add_config "CONFIG_BPF_JIT=y"
          add_config "CONFIG_MODULES=y"
          add_config "# CONFIG_ANDROID_PARANOID_NETWORK is not set"
          echo "[✓] Docker/LXC 全量配置已写入"

      - name: 【校验·第七步】核心配置验证
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          CORE=(
            "CONFIG_NAMESPACES=y" "CONFIG_CGROUPS=y" "CONFIG_MEMCG=y"
            "CONFIG_USER_NS=y" "CONFIG_NET_NS=y" "CONFIG_OVERLAY_FS=y"
            "CONFIG_VETH=y" "CONFIG_BRIDGE=y" "CONFIG_NETFILTER=y"
            "CONFIG_NF_NAT=y" "CONFIG_SECCOMP=y" "CONFIG_SECURITY_APPARMOR=y"
            "CONFIG_BPF=y" "CONFIG_MODULES=y"
          )
          for cfg in "${CORE[@]}"; do
            if grep -q "^${cfg}$" "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg}"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第七步校验失败，终止"
            exit 1
          fi
          echo "✅ 第七步校验通过"

      # ==================== 第八步：cgroup 自动挂载 + ramdisk 脚本 ====================
      - name: 【第八步】cgroup 内核自动挂载配置
        id: step8
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cat >> out/.config << 'EOF'
          CONFIG_CGROUP_AUTOMOUNT=y
          CONFIG_TMPFS=y
          CONFIG_HUGETLBFS=y
          CONFIG_CGROUP_HUGETLB=y
          EOF
          echo "[✓] cgroup 自动挂载已开启"

      - name: 【校验·第八步】自动挂载配置确认
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          for cfg in "CONFIG_CGROUP_AUTOMOUNT=y" "CONFIG_TMPFS=y" "CONFIG_HUGETLBFS=y"; do
            if grep -q "^${cfg}$" "$CONFIG_FILE" 2>/dev/null; then
              echo "[✓] ${cfg}"
            else
              echo "[✗] ${cfg}"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步校验失败，终止"
            exit 1
          fi
          echo "✅ 第八步校验通过"

      - name: 【第八步续】ramdisk 挂载脚本
        id: step8b
        run: |
          cd $GITHUB_WORKSPACE
          INIT_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d
          RCS_DIR=kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d
          mkdir -p "$INIT_DIR" "$RCS_DIR"
          cat > $INIT_DIR/auto-mount-cgroups.sh << 'MOUNT_SCRIPT'
          #!/bin/sh
          set -e
          MAX_RETRY=10
          RETRY_INTERVAL=10
          CGROUP_ROOT="/sys/fs/cgroup"
          do_mount_cgroups() {
              mount -t tmpfs -o mode=755 tmpfs "$CGROUP_ROOT" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/devices"
              mount -t cgroup -o devices cgroup "$CGROUP_ROOT/devices" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/systemd"
              mount -t cgroup -o none,name=systemd cgroup "$CGROUP_ROOT/systemd" 2>/dev/null || true
              mkdir -p "$CGROUP_ROOT/freezer"
              mount -t cgroup -o freezer cgroup "$CGROUP_ROOT/freezer" 2>/dev/null || true
          }
          retry=0
          while [ $retry -lt $MAX_RETRY ]; do
              do_mount_cgroups()
              if mount | grep -q "cgroup on $CGROUP_ROOT/devices" && mount | grep -q "cgroup on $CGROUP_ROOT/systemd" && mount | grep -q "cgroup on $CGROUP_ROOT/freezer"; then
                  echo "[OK] cgroup 挂载成功（尝试次数：$((retry+1))）"
                  exit 0
              fi
              retry=$((retry+1))
              sleep $RETRY_INTERVAL
          done
          echo "[FAIL] cgroup 挂载失败"
          exit 1
          MOUNT_SCRIPT
          chmod 755 $INIT_DIR/auto-mount-cgroups.sh
          ln -sf ../init.d/auto-mount-cgroups.sh $RCS_DIR/S99-auto-mount-cgroups.sh
          echo "[✓] ramdisk 挂载脚本就绪"

      - name: 【校验·第八步续】ramdisk 脚本确认
        run: |
          FAIL=0
          SCRIPT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/init.d/auto-mount-cgroups.sh
          SYMLINK=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/usr/initramfs-tools/etc/rcS.d/S99-auto-mount-cgroups.sh
          [ -f "$SCRIPT" ] && echo "[✓] 脚本存在" || { echo "[✗] 脚本缺失"; FAIL=1; }
          [ -x "$SCRIPT" ] && echo "[✓] 脚本可执行" || { echo "[✗] 脚本不可执行"; FAIL=1; }
          [ -L "$SYMLINK" ] && echo "[✓] 符号链接存在" || { echo "[✗] 符号链接缺失"; FAIL=1; }
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第八步续校验失败，终止"
            exit 1
          fi
          echo "✅ 第八步续校验通过"
      # ==================== 第九步：KernelSU-Next ====================
      - name: 【第九步】部署 KernelSU-Next Legacy
        id: step9
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          cp $GITHUB_WORKSPACE/ksu-legacy-setup.sh ./
          chmod 755 ksu-legacy-setup.sh
          ./ksu-legacy-setup.sh
          grep -q "CONFIG_KSU" out/.config || echo "CONFIG_KSU=y" >> out/.config
          echo "[✓] KernelSU-Next 部署完成"

      - name: 【校验·第九步】KernelSU 配置确认 + 最新正式版本校验
        id: ksu-upgrade-verify
        run: |
          FAIL=0
          CONFIG_FILE=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config
          grep -q "^CONFIG_KSU=y$" "$CONFIG_FILE" 2>/dev/null && echo "[✓] CONFIG_KSU=y" || { echo "[✗] CONFIG_KSU=y 缺失"; FAIL=1; }
          [ -d "$GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/kernelsu" ] && echo "[✓] KernelSU 驱动目录存在" || { echo "[✗] 驱动目录缺失"; FAIL=1; }
      
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/KernelSU-Next
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "legacy分支(无tag)")
          LATEST_TAG=$(git ls-remote --tags --refs --sort='-v:refname' \
            https://github.com/KernelSU-Next/KernelSU-Next \
            | grep -v -iE "beta|rc|test|preview|nightly|dev" 2>/dev/null \
            | head -1 \
            | cut -d '/' -f 3)
      
          echo "[✓] 当前KernelSU-Next版本: ${CURRENT_TAG}"
          if [ -n "$LATEST_TAG" ]; then
            echo "[✓] 远程最新正式稳定版: ${LATEST_TAG}"
            if [ "$CURRENT_TAG" = "$LATEST_TAG" ]; then
              echo "[✓] 已是最新正式稳定版，无需额外升级"
            else
              echo "[!] 注意: 当前版本与远程最新正式版不一致(可能已fallback到legacy分支)"
              echo "[!] 这通常不影响内核编译，但建议检查ksu-legacy-setup.sh的执行日志"
            fi
          else
            echo "[!] 无法获取远程最新版本信息，跳过版本比对"
          fi
      
          if [ $FAIL -eq 1 ]; then
            echo "❌ 第九步校验失败，终止"
            exit 1
          fi
          echo "✅ 第九步校验通过，KernelSU-Next版本校验完成"

